<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nisa Fen Çalışması</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: tek sütun "çalışma defteri"; sayfalama hash ile (ana → bölüm: konu → test → yazılı → baba kontrolü → sonuç; tatbikat: 7 soru → kontrol → sonuç) */
:root{
  --bg:#eef2f8; --paper:#ffffff; --fg:#1b2540; --muted:#5d6a86; --line:#d6deec;
  --accent:#2f5bd3; --accent-soft:#e6ecfc; --ok:#178a57; --ok-soft:#e0f3e9; --warn:#b5531a; --warn-soft:#fbeadf;
  --force:#d0452f; --box:#c7d2e6; --sun:#f4b733; --shadow:rgba(20,28,48,.30); --on-accent:#ffffff;
  --c1:#4b46c7; --c1-soft:#e9e8fb; --c2:#c26510; --c2-soft:#fcecd9; --c3:#c93a2b; --c3-soft:#fbe3df; --c4:#1d8656; --c4-soft:#dcf2e6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629}}
:root[data-theme="dark"]{
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{font-weight:700;text-decoration:none;font-size:.95rem}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.crumb.on{background:var(--unit,var(--accent));border-color:var(--unit,var(--accent));color:var(--on-accent)}
.crumb.done{color:var(--ok);border-color:var(--ok)}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.paper > section{display:grid;gap:10px}
.rule{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.rule b{font-family:var(--display);font-size:1.15rem}
.ornek{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ornek .eyebrow{color:var(--accent)}
.hata{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px}
.hata b:first-child{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.mini > b:first-child{font-family:var(--display);font-size:1.05rem;display:block}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:420px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:800}
td.blank{height:2.2em}

.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:320px}
.fig text{font-family:var(--body);font-weight:700;font-size:13px;fill:var(--fg)}
.cap{font-size:.82rem;color:var(--muted);text-align:center}

.qs{list-style:none;padding:0;display:grid;gap:10px}
.qs li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.ql{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.5}
.pts{color:var(--muted);font-size:.85rem;white-space:nowrap}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}

button,.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.wa{background:#1f9d55;color:#fff}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions.center{justify-content:center}

.lead{font-size:1.05rem;border-left:4px solid var(--unit,var(--accent));padding:4px 0 4px 14px;color:var(--fg)}
details.yokla{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
details.yokla summary{cursor:pointer;font-weight:700;display:grid;gap:2px}
details.yokla summary .eyebrow{color:var(--accent)}
details.yokla summary::after{content:"Cevabı görmek için dokun";font-weight:600;font-size:.82rem;color:var(--muted)}
details.yokla[open] summary::after{content:""}
details.yokla p{margin-top:8px;background:var(--ok-soft);border-radius:8px;padding:8px 10px}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pg{width:36px;height:36px;padding:0;border-radius:50%;font-size:.95rem;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pg.on{background:var(--unit,var(--accent));color:var(--on-accent);border-color:var(--unit,var(--accent))}
.pg.done{color:var(--ok);border-color:var(--ok)}
.hata ul{margin-top:6px}
.themebtn{min-height:0;padding:6px 12px;font-size:.85rem;border-radius:999px;margin-left:auto}
/* Ana sayfa */
.home-head{display:grid;gap:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;list-style:none;padding:0;counter-reset:h}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;counter-increment:h}
.how li::before{content:counter(h);font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.3rem;display:block;line-height:1}
.unit{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg)}
.unit:hover{border-color:var(--unit,var(--accent))}
.unit .no{font-family:var(--display);font-weight:800;font-size:1.6rem;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--unit-soft,var(--accent-soft));color:var(--unit,var(--accent))}
.unit h3{font-size:1.1rem}
.unit .sub{font-size:.85rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.list{display:grid;gap:10px}

/* Test */
.opts{display:grid;gap:8px}
.opt{background:var(--paper);color:var(--fg);border:2px solid var(--line);text-align:left;font-family:var(--body);font-weight:700;font-size:1rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--ok-soft)} .fb.good b{color:var(--ok)}
.fb.bad{background:var(--warn-soft)} .fb.bad b{color:var(--warn)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--unit,var(--accent));border-radius:99px}
#app[data-unit] .paper{border-top:5px solid var(--unit)}

/* Kontrol */
.grp{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.grp.first{border-top:0;padding-top:0}
.qhead{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--accent);margin-top:6px}
.model{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
label.item{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;cursor:pointer;padding:6px 4px;border-radius:8px}
label.item:hover{background:var(--accent-soft)}
label.item input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ok)}
.item .p{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.scorebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--paper);border-radius:14px;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.scorebar .big{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.scorebar button{background:var(--paper);color:var(--fg);padding:10px 14px}

/* Sonuç */
.result{text-align:center;justify-items:center}
.big-score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.scores div{border:1px solid var(--line);border-radius:12px;padding:10px}
.scores b{font-family:var(--display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.todo{list-style:none;padding:0;display:grid;gap:8px;text-align:left;width:100%}
.todo li{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px}
.allgood{background:var(--ok-soft);padding:12px;border-radius:10px;width:100%}
textarea.copybox{width:100%;min-height:140px;font-family:var(--body);font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}

html{-webkit-text-size-adjust:100%}
button,.btn,.opt,label.item,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Tablet (iPad) */
@media (min-width:700px){
  body{font-size:18px;line-height:1.65;padding-block:28px 64px}
  .wrap{max-width:860px;gap:20px}
  .paper{padding:30px 34px;gap:18px;border-radius:20px}
  h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
  .lead{font-size:1.15rem}
  .fig svg{min-width:0}
  .fig text{font-size:14px}
  table{font-size:1rem}
  th,td{padding:10px 14px}
  button,.btn{font-size:1.15rem;padding:14px 22px;min-height:52px}
  .opts{grid-template-columns:1fr 1fr;gap:12px}
  .opt{min-height:64px;font-size:1.08rem}
  .pg{width:46px;height:46px;font-size:1.05rem;min-height:0;padding:0}
  label.item{grid-template-columns:30px 1fr auto;padding:10px 8px;font-size:1.05rem}
  label.item input{width:26px;height:26px}
  .unit{grid-template-columns:64px 1fr auto;padding:18px}
  .unit .no{width:64px;height:64px;font-size:1.9rem}
  .unit h3{font-size:1.3rem}
  .cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .mini{padding:14px 16px}
  details.yokla{padding:14px 18px}
  .scorebar{padding:14px 22px}
  .big-score{font-size:4rem}
}
@media (min-width:1000px){ .wrap{max-width:920px} }
@media (prefers-reduced-motion:no-preference){.paper{animation:in .22s ease}}
@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}

/* ===== Kareli defter teması ===== */
:root{
  --bg:#F8FAFD; --grid:#DCE6F5; --paper:#FFFFFF; --fg:#1E2A5A; --muted:#51608F; --line:#C9D4EA; --edge:#1E2A5A;
  --accent:#2C47A8; --accent-soft:#EEF2FB; --on-accent:#FFFFFF; --note:#FFF06A; --note-edge:#E3D23E; --tape:#9FD8F7;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --display:var(--hand);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}}
:root[data-theme="dark"]{
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2{font-family:var(--hand);font-weight:400;letter-spacing:.2px}
h1{font-size:2.3rem;line-height:1.05} h2{font-size:1.7rem;line-height:1.1}
h3{font-family:var(--body);font-weight:800}
.eyebrow{text-transform:none;letter-spacing:0;font-size:.88rem;font-weight:800}
.back{font-weight:800;color:var(--fg)}
.paper{border:2px solid var(--edge);border-radius:8px;box-shadow:6px 6px 0 var(--edge)}
#app[data-unit] .paper{border-top:2px solid var(--edge);background-image:linear-gradient(var(--unit),var(--unit));background-size:100% 12px;background-repeat:no-repeat;padding-top:32px}
.rule{background:var(--note);border-radius:3px;box-shadow:0 6px 0 -2px var(--note-edge)}
.rule b{font-family:var(--hand);font-weight:400;font-size:1.45rem;line-height:1.2}
.note{background:var(--accent-soft);border:2px dashed var(--line)}
.ornek{background:var(--paper)}
.unit{border:2px solid var(--edge);border-radius:8px;box-shadow:4px 4px 0 var(--edge)}
.unit:hover{border-color:var(--edge);box-shadow:5px 5px 0 var(--edge);transform:translate(-1px,-1px)}
.unit .no{border:2px solid var(--edge);border-radius:50%;font-family:var(--hand);font-weight:400}
.how li{border:2px solid var(--edge);border-radius:8px}
.how li::before{font-family:var(--hand);font-weight:400;font-size:1.6rem;color:var(--fg)}
button,.btn{font-family:var(--body);font-weight:800}
.primary{background:var(--fg);color:var(--paper);border:2px solid var(--fg)}
.ghost{background:var(--paper);color:var(--fg);border:2px solid var(--edge)}
.opt{border:2px solid var(--edge);border-radius:10px}
.crumb{border:2px solid var(--line)}
.pg{border:2px solid var(--line)}
.progress{height:12px;background:var(--paper);border:2px solid var(--edge)}
.chip{border:1.5px solid var(--line);font-family:var(--hand);font-weight:400;font-size:1.02rem;background:var(--paper)}
.chip.ok{border-color:var(--ok)}
.scorebar{background:var(--fg);color:var(--paper);border-radius:10px}
.big-score{font-family:var(--hand);font-weight:400}
.scores div{border:2px solid var(--edge);border-radius:8px}
.scores b{font-family:var(--hand);font-weight:400}
details.yokla{border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.qhead{font-family:var(--hand);font-weight:400;font-size:1.55rem}
.themebtn{border:2px solid var(--edge)}
.todo li{border-radius:3px}
@media (min-width:700px){ h1{font-size:2.8rem} h2{font-size:2rem} .rule b{font-size:1.6rem} }

/* ===== Anlatım sayfaları: ferah düzen ve defter süsleri ===== */
:root{--rl:#E3EAF6;--margin:#F3A6A6;--hl:rgba(255,232,64,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}}
:root[data-theme="dark"]{--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}
article.paper{gap:22px}
article.paper > p, article.paper > .lead{max-width:40em}
article.paper h1{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--unit,var(--accent));text-decoration-thickness:2px;text-underline-offset:12px;text-decoration-skip-ink:none;padding-bottom:4px}
article.paper h3{margin-top:4px}
article.paper p b, article.paper li b{background:linear-gradient(transparent 56%,var(--hl) 56%);padding:0 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rule p b, .rule li b, .hata p b, .hata li b{background:none;padding:0}
article.paper .deney p b{background:none;padding:0}
.rule span b{font-family:inherit;font-size:inherit;font-weight:800;line-height:inherit}
.ornek{position:relative;display:block;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rl) 31px,var(--rl) 32px);background-position:0 12px;border:2px solid var(--edge);border-radius:6px;box-shadow:4px 4px 0 var(--edge);padding:12px 18px 14px 50px;line-height:32px}
.ornek > *{margin:0;line-height:32px}
.ornek .eyebrow{display:block;color:var(--unit,var(--accent))}
.ornek .tbl-wrap,.ornek .fig{margin:8px 0;line-height:1.5}
.ornek .tbl-wrap *{line-height:1.5}
.rule{position:relative;transform:rotate(-.4deg);padding:20px 20px 18px;margin-top:6px}
.rule::before{content:"";position:absolute;top:-11px;left:24px;width:84px;height:22px;background:var(--tape);opacity:.8;transform:rotate(-3deg)}
article.paper > .fig{background:var(--paper);border:2px solid var(--edge);border-radius:6px;padding:14px 12px}
.hata{background:var(--warn-soft);border:2px dashed var(--warn);border-radius:6px;padding:14px 16px}
.mini{border:2px solid var(--edge);border-radius:8px;background:var(--paper);box-shadow:3px 3px 0 var(--edge)}
.mini > b:first-child{font-family:var(--hand);font-weight:400;font-size:1.35rem;margin-bottom:2px}
details.yokla{background:var(--accent-soft);border:2px dashed var(--edge)}
details.yokla[open]{background:var(--paper);border-style:solid}
.adimlar{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px 18px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--edge)}
.adimlar .eyebrow{color:var(--unit,var(--accent))}
.adimlar ol{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:a}
.adimlar li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.adimlar li::before{content:counter(a);width:32px;height:32px;border-radius:50%;background:var(--unit,var(--accent));color:var(--on-accent);display:grid;place-items:center;font-family:var(--hand);font-size:1.2rem}
.adimlar .actions{justify-content:flex-start}
.birlikte{border:2px dashed var(--unit,var(--accent));border-radius:10px;background:var(--unit-soft,var(--accent-soft));padding:16px 18px;display:grid;gap:10px}
.birlikte .eyebrow{color:var(--fg)}
.birlikte .satir{font-size:1.12rem;line-height:2.3}
.birlikte .actions{justify-content:flex-start}

<body>
<div class="wrap" id="app"></div>

<script>
const DERS='fen';
/* ---------- ETKİLEŞİMLİ ANLATIM KUTULARI ---------- */
const adimAdim=(baslik,adimlar)=>`<div class="adimlar"><span class="eyebrow">${baslik}</span><ol>${adimlar.map((a,i)=>`<li${i?' hidden':''}><span>${a}</span></li>`).join('')}</ol><div class="actions"><button class="primary" data-act="adim">Sonraki adım</button></div></div>`;
const bosluk=(cevap,genis)=>`<input class="bos${genis?' genis':''}" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Boşluk" data-c="${cevap}">`;
const birlikte=(satirlar)=>`<div class="birlikte"><span class="eyebrow">Birlikte yapalım: boşlukları doldur</span>${satirlar.map(s=>`<div class="satir">${s}</div>`).join('')}<div class="actions"><button class="ghost" data-act="kontrol">Kontrol et</button></div><p class="bfb" hidden></p></div>`;
/* ---------- ÇİZİM YARDIMCILARI ---------- */
function planetSVG(belt){
  const P=[["Merkür",72,4,"#9a8f86"],["Venüs",102,7,"#d9b26a"],["Dünya",134,7.5,"#3c86d6"],["Mars",164,5,"#c8553a"],
           ["Jüpiter",272,26,"#d3a273"],["Satürn",378,21,"#e2c88a"],["Uranüs",482,13,"#7fc6cf"],["Neptün",590,12.5,"#4a6fd1"]];
  let s=`<svg viewBox="0 0 660 165" role="img" aria-label="Güneş ve sırasıyla sekiz gezegen">`;
  s+=`<circle cx="-38" cy="80" r="80" fill="var(--sun)"/><text x="6" y="160">Güneş</text>`;
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let i=0;i<46;i++){ s+=`<circle cx="${184+rnd()*44}" cy="${48+rnd()*64}" r="${0.8+rnd()*1.6}" fill="var(--muted)"/>`; }
  s+=`<text x="206" y="34" text-anchor="middle" style="font-size:${belt==='?'?20:12}px">${belt==='?'?'?':'Asteroit kuşağı'}</text>`;
  P.forEach(([n,x,r,c],i)=>{
    if(i>=4){
      const tilt = n==="Uranüs" ? ` transform="rotate(80 ${x} 80)"` : ` transform="rotate(-12 ${x} 80)"`;
      const w = n==="Satürn"?3:1.4;
      s+=`<ellipse cx="${x}" cy="80" rx="${r*1.75}" ry="${r*0.42}" fill="none" stroke="${c}" stroke-width="${w}" opacity=".9"${tilt}/>`;
    }
    s+=`<circle cx="${x}" cy="80" r="${r}" fill="${c}"/>`;
    if(n==="Jüpiter") s+=`<ellipse cx="${x+8}" cy="88" rx="5" ry="3" fill="#b1442c"/>`;
    const ly = i<4 ? (i%2===0?148:126) : 132;
    s+=`<text x="${x}" y="${ly}" text-anchor="middle">${n}</text>`;
  });
  return `<div class="fig">${s}</svg></div><p class="cap">Görsel ölçekli değildir.</p>`;
}
function eclipseSVG(type){
  let s=`<svg viewBox="0 0 520 180" role="img" aria-label="${type==='ay'?'Güneş, Dünya, Ay sıralaması: Ay tutulması':'Güneş, Ay, Dünya sıralaması: Güneş tutulması'}">`;
  s+=`<g stroke="var(--sun)" stroke-width="2" opacity=".5"><line x1="100" y1="66" x2="240" y2="74"/><line x1="100" y1="114" x2="240" y2="106"/></g>`;
  s+=`<circle cx="62" cy="90" r="52" fill="var(--sun)"/><text x="62" y="168" text-anchor="middle">Güneş</text>`;
  if(type==='ay'){
    s+=`<polygon points="262,67 262,113 480,98 480,82" fill="var(--shadow)"/>`;
    s+=`<circle cx="262" cy="90" r="24" fill="#3c86d6"/><path d="M262 66 a24 24 0 0 1 0 48 z" fill="var(--shadow)"/>`;
    s+=`<circle cx="430" cy="90" r="11" fill="#b5534a"/><circle cx="430" cy="90" r="11" fill="var(--shadow)"/>`;
    s+=`<text x="262" y="136" text-anchor="middle">Dünya</text><text x="430" y="126" text-anchor="middle">Ay</text>`;
    s+=`<text x="380" y="60" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Dünya'nın gölgesi</text>`;
  } else {
    s+=`<polygon points="252,81 400,88 400,92 252,99" fill="var(--shadow)"/>`;
    s+=`<circle cx="252" cy="90" r="9" fill="#a9b1bf"/><path d="M252 81 a9 9 0 0 1 0 18 z" fill="var(--shadow)"/>`;
    s+=`<circle cx="430" cy="90" r="30" fill="#3c86d6"/><circle cx="401" cy="90" r="4" fill="#111a2e"/>`;
    s+=`<text x="252" y="122" text-anchor="middle">Ay</text><text x="430" y="140" text-anchor="middle">Dünya</text>`;
    s+=`<text x="326" y="68" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Ay'ın gölgesi</text>`;
  }
  return `<div class="fig">${s}</svg></div><p class="cap">Görsel ölçekli değildir.</p>`;
}
function arrow(x1,y,x2){
  const d = x2>x1?1:-1;
  return `<line x1="${x1}" y1="${y}" x2="${x2-d*12}" y2="${y}" stroke="var(--force)" stroke-width="4" stroke-linecap="round"/>`+
         `<path d="M${x2} ${y} L${x2-d*15} ${y-7} L${x2-d*15} ${y+7} Z" fill="var(--force)"/>`;
}
function forceSVG(forces,obj){
  obj = obj||'kutu';
  const bx1=255,bx2=345,by1=70,by2=130, max=Math.max(...forces.map(f=>f.v));
  const len=v=>40+(v/max)*150;
  let s=`<svg viewBox="0 0 600 ${obj==='araba'?178:168}" role="img" aria-label="Cisme etki eden kuvvetler">`;
  s+=`<text x="16" y="22" style="fill:var(--muted)">◀ Batı</text><text x="584" y="22" text-anchor="end" style="fill:var(--muted)">Doğu ▶</text>`;
  if(obj==='araba'){
    s+=`<line x1="40" y1="157" x2="560" y2="157" stroke="var(--line)" stroke-width="2"/>`;
    s+=`<rect x="${bx1}" y="${by1+10}" width="${bx2-bx1}" height="52" rx="10" fill="var(--box)"/>`;
    s+=`<circle cx="${bx1+22}" cy="145" r="11" fill="var(--fg)"/><circle cx="${bx2-22}" cy="145" r="11" fill="var(--fg)"/>`;
  } else {
    s+=`<rect x="${bx1}" y="${by1}" width="${bx2-bx1}" height="${by2-by1}" rx="6" fill="var(--box)"/>`;
  }
  const east=forces.filter(f=>f.d==='D'), west=forces.filter(f=>f.d==='B');
  const ys=n=>n===1?[102]:[90,118];
  const lab=f=>f.lab||(f.n?`${f.n} = ${f.v} N`:`${f.v} N`);
  east.forEach((f,i)=>{const y=ys(east.length)[i],x2=bx2+len(f.v); s+=arrow(bx2,y,x2)+`<text x="${(bx2+x2)/2}" y="${y-9}" text-anchor="middle">${lab(f)}</text>`;});
  west.forEach((f,i)=>{const y=ys(west.length)[i],x2=bx1-len(f.v); s+=arrow(bx1,y,x2)+`<text x="${(bx1+x2)/2}" y="${y-9}" text-anchor="middle">${lab(f)}</text>`;});
  return `<div class="fig">${s}</svg></div>`;
}
const tbl=(head,rows)=>`<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>c===''?'<td class="blank"></td>':`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const qs=items=>`<ol class="qs">${items.map(([l,t,p])=>`<li><span class="ql">${l}</span><span>${t} <span class="pts">(${p} puan)</span></span></li>`).join('')}</ol>`;

/* ---------- EK ÇİZİMLER ---------- */
function phasesSVG(){
  const moon=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="11" fill="#4a5163"/><path d="M${cx} ${cy-11} a11 11 0 0 0 0 22 z" fill="#efe9d4"/>`;
  let s=`<svg viewBox="0 0 600 225" role="img" aria-label="Ay'ın yeni ay ve dolunay evrelerindeki konumu">`;
  s+=`<g stroke="var(--sun)" stroke-width="2" opacity=".45"><line x1="60" y1="60" x2="200" y2="70"/><line x1="60" y1="120" x2="200" y2="110"/></g>`;
  s+=`<circle cx="-15" cy="90" r="68" fill="var(--sun)"/><text x="12" y="182">Güneş</text>`;
  s+=`<circle cx="330" cy="90" r="100" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 6"/>`;
  s+=`<circle cx="330" cy="90" r="22" fill="#3c86d6"/><path d="M330 68 a22 22 0 0 1 0 44 z" fill="var(--shadow)"/><text x="330" y="132" text-anchor="middle">Dünya</text>`;
  s+=moon(230,90)+moon(430,90);
  s+=`<text x="230" y="68" text-anchor="middle">Yeni ay</text><text x="430" y="68" text-anchor="middle">Dolunay</text>`;
  s+=`<text x="300" y="168" text-anchor="middle" style="fill:var(--muted);font-size:12px">Dünya'dan bakınca:</text>`;
  s+=`<circle cx="230" cy="190" r="12" fill="#4a5163" stroke="var(--muted)" stroke-width="1.5"/><text x="230" y="218" text-anchor="middle" style="font-size:12px">Görünmez</text>`;
  s+=`<circle cx="430" cy="190" r="12" fill="#efe9d4" stroke="var(--muted)" stroke-width="1.5"/><text x="430" y="218" text-anchor="middle" style="font-size:12px">Tam yuvarlak</text>`;
  return `<div class="fig">${s}</svg></div><p class="cap">Ay'ın Güneş'e bakan yarısı hep aydınlıktır. Görselde ölçek yoktur.</p>`;
}
function dinamoSVG(v){
  const px=130+v*34;
  let s=`<svg viewBox="0 0 600 120" role="img" aria-label="${v} N gösteren dinamometre">`;
  s+=`<rect x="20" y="42" width="60" height="46" rx="6" fill="var(--box)"/><line x1="80" y1="65" x2="112" y2="65" stroke="var(--fg)" stroke-width="3"/>`;
  s+=`<rect x="110" y="45" width="380" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
  let z=`M115 65`; const step=(px-115)/12; for(let i=1;i<=12;i++){ z+=` L${115+i*step} ${i%2?57:73}`; }
  s+=`<path d="${z}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  for(let i=0;i<=10;i++){ const x=130+i*34; s+=`<line x1="${x}" y1="45" x2="${x}" y2="${i%5===0?57:52}" stroke="var(--muted)" stroke-width="1.5"/><text x="${x}" y="104" text-anchor="middle" style="font-size:12px">${i}</text>`; }
  s+=`<line x1="${px}" y1="38" x2="${px}" y2="92" stroke="var(--force)" stroke-width="3"/><text x="${px}" y="30" text-anchor="middle" style="fill:var(--force)">${v} N</text>`;
  s+=`<line x1="${px}" y1="65" x2="495" y2="65" stroke="var(--fg)" stroke-width="3"/>`+arrow(495,65,580);
  s+=`<text x="540" y="52" text-anchor="middle">Çek</text>`;
  return `<div class="fig">${s}</svg></div><p class="cap">Ölçekteki sayılar Newton (N) cinsindendir.</p>`;
}
function gridArrowSVG(){
  let s=`<svg viewBox="0 0 600 175" role="img" aria-label="Kareli kağıtta kuvvet okları">`;
  for(let x=30;x<=570;x+=30) s+=`<line x1="${x}" y1="20" x2="${x}" y2="140" stroke="var(--line)" stroke-width="1"/>`;
  for(let y=20;y<=140;y+=30) s+=`<line x1="30" y1="${y}" x2="570" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
  s+=`<circle cx="270" cy="50" r="4" fill="var(--force)"/>`+arrow(270,50,360)+`<text x="315" y="42" text-anchor="middle">3 N, doğu</text>`;
  s+=`<circle cx="330" cy="110" r="4" fill="var(--force)"/>`+arrow(330,110,180)+`<text x="255" y="102" text-anchor="middle">5 N, batı</text>`;
  s+=`<text x="16" y="166" style="fill:var(--muted)">1 kare = 1 N</text><text x="584" y="166" text-anchor="end" style="fill:var(--muted)">◀ Batı · Doğu ▶</text>`;
  return `<div class="fig">${s}</svg></div>`;
}
const yok=(q,a)=>`<details class="yokla"><summary><span class="eyebrow">Kendini yokla</span>${q}</summary><p>${a}</p></details>`;

/* ---------- KONU ANLATIMLARI (sayfa sayfa) ---------- */
const KONU=[
/* ===== BÖLÜM 1: GEZEGENLER ===== */
[
{t:"Güneş'in ailesi",h:`
<p class="lead">Gece gökyüzüne baktığında gördüğün parlak noktaların bazıları aslında yıldız değil, gezegendir. Hadi bizim "mahallemiz" olan Güneş sistemini tanıyalım.</p>
<p><b>Güneş sistemi</b>, ortadaki Güneş ve onun etrafında dolanan gök cisimlerinden oluşur. Bunların en büyükleri <b>gezegenlerdir</b>.</p>
<p>Gezegenlerin kendi ışıkları yoktur. Güneş'ten gelen ışığı yansıttıkları için parlak görünürler. Her gezegen Güneş'in etrafında kendine ait bir yolda, yani <b>yörüngesinde</b> döner.</p>
<p>Güneş sisteminde <b>8 gezegen</b> vardır. Güneş'e yakından uzağa doğru sıraları şöyledir:</p>
${planetSVG()}
<div class="rule"><span class="eyebrow">Sırayı akılda tutmanın yolu</span><b>Me-Ve-Dü-Ma · Jü-Sa-Ur-Ne</b><span>Merkür, Venüs, Dünya, Mars · Jüpiter, Satürn, Uranüs, Neptün. Bunu bir tekerleme gibi iki kez yüksek sesle söyle. Sınavda sıralama sorulursa önce kağıdın kenarına bunu yaz.</span></div>
${yok("Dünya, Güneş'e yakınlık sırasına göre kaçıncı gezegendir?","<b>3.</b> gezegendir. Me-Ve-<b>Dü</b>: Merkür, Venüs, Dünya.")}
${yok("Güneş'e en uzak gezegen hangisidir?","<b>Neptün.</b> Tekerlemenin son hecesi: Ne.")}`},
{t:"İki mahalle: iç ve dış gezegenler",h:`
<p class="lead">Mars ile Jüpiter arasında bir "sınır" var: <b>asteroit kuşağı</b>. Bu kuşak, gezegenleri iki mahalleye ayırır.</p>
<h3>İç gezegenler: Merkür, Venüs, Dünya, Mars</h3>
<p>Asteroit kuşağının <b>iç tarafındadırlar</b>, yani Güneş'e daha yakındırlar. <b>Kayaç ve metallerden</b> oluşurlar ve katı bir yüzeyleri vardır. Dünya'ya, yani "kara"ya benzedikleri için bunlara <b>karasal gezegenler</b> denir. Küçüktürler ve <b>halkaları yoktur</b>.</p>
<h3>Dış gezegenler: Jüpiter, Satürn, Uranüs, Neptün</h3>
<p>Asteroit kuşağının <b>dış tarafındadırlar</b>. Büyük ölçüde <b>gazlardan</b> oluştukları için <b>gazsal gezegenler</b> denir. Dev gibidirler ve <b>dördünün de halkası vardır</b>. Satürn'ün halkaları en belirgin olduğu için akılda kalır ama tek halkalı gezegen o değildir.</p>
${tbl(["","İç gezegenler","Dış gezegenler"],[
 ["Gezegenler","Merkür, Venüs, Dünya, Mars","Jüpiter, Satürn, Uranüs, Neptün"],
 ["Neyden oluşur?","Kayaç ve metal → <b>karasal</b>","Büyük ölçüde gaz → <b>gazsal</b>"],
 ["Büyüklük","Küçük","Büyük"],
 ["Halka","Yok → <b>halkasız</b>","Var → <b>halkalı</b>"],
 ["Yeri","Asteroit kuşağının iç tarafı","Asteroit kuşağının dış tarafı"]])}
<p>Gördüğün gibi aynı dört gezegene üç farklı ad verilebilir: <b>iç–dış</b>, <b>karasal–gazsal</b>, <b>halkasız–halkalı</b>. Hangisini kullanırsan kullan doğrudur; önemli olan gerekçesini yazmaktır.</p>
<h3>Asteroit kuşağı nedir?</h3>
<p>Farklı büyüklükte <b>kaya ve metal parçalarından</b> oluşan bir bölgedir. Bazı parçalar çakıl taşı kadar küçük, bazıları kocaman bir dağ kadar büyüktür. <b>Gezegen değildir</b>; sadece iki grubu birbirinden ayıran bir kuşaktır.</p>
${yok("Venüs karasal mı, gazsal mı bir gezegendir?","<b>Karasal.</b> Çünkü kayaç ve metallerden oluşur. (Me-Ve-Dü-Ma'nın içinde.)")}
${yok("Halkası olan gezegenler hangileridir?","<b>Jüpiter, Satürn, Uranüs ve Neptün.</b> Yani dış gezegenlerin hepsi.")}`},
{t:"Her gezegeni tanı",h:`
<p class="lead">Yazılıda bazen gezegenin adı yerine bir özelliği verilir: "Kızıl Gezegen olarak bilinir" gibi. O yüzden her gezegenin bir kimlik kartı olsun.</p>
<div class="cards">
<div class="mini"><b>Merkür</b><span class="muted">İç · karasal</span><br>Güneş'e en yakın ve <b>hacmi en küçük</b> gezegen. Yüzeyi <b>kraterlerle</b> dolu.</div>

/* ===== BÖLÜM 2: TUTULMALAR ===== */
[
{t:"Önce gölge ve Ay'ın evreleri",h:`
<p class="lead">Karanlık bir odada bir topa el feneri tutarsan topun arkasında bir gölge oluşur. Uzayda da aynısı olur: el feneri Güneş, toplar ise Dünya ve Ay.</p>
<p>Güneş kendi ışığını üretir. Dünya ve Ay ise ışık üretmez. Güneş'ten gelen ışık onların bir yarısını aydınlatır, arkalarında da bir <b>gölge</b> oluşur.</p>
<p>Ay, Dünya'nın etrafında yaklaşık bir ayda bir tur atar. Döndükçe aydınlık yüzünü bize farklı açılardan gösterir; bazen ince bir hilal, bazen yarım, bazen tam yuvarlak görürüz. Buna <b>Ay'ın evreleri</b> denir. Tutulmaları anlamak için iki evreyi bilmen yeter:</p>
${phasesSVG()}
<div class="cards">
<div class="mini"><b>Yeni ay</b>Ay, Güneş ile Dünya'nın <b>arasındadır</b>. Ay'ın aydınlık yüzü Güneş'e döner, bize karanlık yüzü bakar. Bu yüzden Ay'ı <b>göremeyiz</b>.</div>
<div class="mini"><b>Dolunay</b>Dünya, Güneş ile Ay'ın <b>arasındadır</b>. Ay'ın aydınlık yüzünün <b>tamamını</b> görürüz; Ay tam yuvarlak ve parlaktır.</div>
</div>
<div class="rule"><span class="eyebrow">Bunu bilirsen evreyi ezberlemene gerek kalmaz</span><b>Yeni ay → Ay ortada. Dolunay → Dünya ortada.</b></div>
${yok("Dolunayda Güneş, Dünya ve Ay nasıl sıralanır?","<b>Güneş – Dünya – Ay.</b> Dünya ortadadır.")}`},
{t:"Güneş tutulması",h:`
<p class="lead">Düşün: öğle vakti, güneşli bir gün. Birden hava kararmaya başlıyor, kuşlar susuyor, sokak lambaları yanıyor. Bu bir <b>Güneş tutulması</b>.</p>
<p><b>Ne olur?</b> Ay, Güneş ile Dünya'nın <b>tam arasına</b> girer ve Güneş'in önünü kapatır. Ay'ın gölgesi Dünya'ya düşer. Gölgenin düştüğü yerdeki insanlar Güneş'i kısmen ya da tamamen kapanmış görür.</p>
${eclipseSVG('gunes')}
<div class="rule"><span class="eyebrow">Sıralama</span><b>Güneş – Ay – Dünya</b><span>Ay ortada → Ay'ın gölgesi Dünya'ya düşer → Güneş "tutulur".</span></div>
<h3>Neden yeni ay evresinde olur?</h3>
<p>Çünkü Ay ortadadır. Az önce öğrendiğin gibi, Ay ortadayken <b>yeni ay</b> evresindedir.</p>
<h3>Neden gündüz olur?</h3>
<p>Güneş'i ancak gündüz görebiliriz. Güneş'in kapandığını da ancak <b>gündüz</b> fark ederiz.</p>
<h3>Neden dar bir alandan görülür ve kısa sürer?</h3>
<p>Ay, Dünya'dan çok küçüktür. Bu yüzden gölgesi Dünya'nın üzerinde <b>küçük bir leke</b> gibi kalır; tutulmayı sadece o lekenin düştüğü yerdekiler görür. Ay hareket ettikçe bu leke kayar ve bir yerde ancak <b>birkaç dakika</b> kalır.</p>
<div class="hata"><b>Dikkat!</b> Güneş tutulmasına asla çıplak gözle bakma. Güneş ışığı çok güçlüdür; tutulma sırasında bile gözüne kalıcı zarar verebilir. Sadece <b>özel tutulma gözlüğüyle</b> bakılır.</div>
${yok("Güneş tutulması neden Dünya'nın her yerinden görülmez?","Çünkü Ay küçüktür ve gölgesi Dünya'nın sadece <b>küçük bir bölgesine</b> düşer.")}`},
{t:"Ay tutulması",h:`
<p class="lead">Bir gece dolunaya bakıyorsun. Ay yavaş yavaş kararıyor, sonra kızılımsı bir renge bürünüyor. Bu bir <b>Ay tutulması</b>.</p>
<p><b>Ne olur?</b> Dünya, Güneş ile Ay'ın <b>tam arasına</b> girer. Dünya'nın gölgesi Ay'ın üzerine düşer ve Ay kararır.</p>
${eclipseSVG('ay')}
<div class="rule"><span class="eyebrow">Sıralama</span><b>Güneş – Dünya – Ay</b><span>Dünya ortada → Dünya'nın gölgesi Ay'a düşer → Ay "tutulur".</span></div>
<h3>Neden dolunayda olur?</h3>
<p>Çünkü Dünya ortadadır. Dünya ortadayken Ay <b>dolunay</b> evresindedir.</p>
<h3>Neden gece olur?</h3>
<p>Ay, Dünya'nın Güneş'e bakmayan tarafındadır. Dünya'nın Güneş'e bakmayan tarafında ise <b>gece</b> yaşanır. Yani Ay tutulmasını ancak gece olan yerler görür.</p>
<h3>Neden geniş bir alandan görülür ve uzun sürer?</h3>
<p>Dünya, Ay'dan çok büyüktür; gölgesi de çok büyüktür. Ay bu kocaman gölgenin içinden geçerken <b>uzun süre</b> gölgede kalır (tam kararma yaklaşık bir saate kadar sürebilir). Kararan şey Ay'ın kendisi olduğu için Ay'ı görebilen <b>gece olan her yerden</b> tutulma izlenir.</p>
<p><b>Neden kızıl?</b> Dünya'nın havasından (atmosferinden) geçen az miktarda ışık Ay'a ulaşır ve Ay'ı kızılımsı gösterir.</p>
<p>Ay tutulmasını <b>çıplak gözle</b> rahatça izleyebilirsin; gözlerine zararı yoktur.</p>
${yok("Türkiye'de gündüz olduğu bir saatte Ay tutulması oluyor. Türkiye'den izlenebilir mi?","<b>Hayır.</b> Ay tutulması gece olan yerlerden görülür. Gündüz olan yerde Ay ufkun altındadır.")}`},
{t:"Yan yana koy, farkı gör",h:`
<p class="lead">İki tutulmayı yan yana koyalım. Bu tablo yazılıda en çok işine yarayacak sayfa.</p>
${tbl(["","Güneş tutulması","Ay tutulması"],[
 ["Sıralama","Güneş – Ay – Dünya","Güneş – Dünya – Ay"],
 ["Ortadaki","Ay","Dünya"],
 ["Gölge","Ay'ın gölgesi Dünya'ya düşer","Dünya'nın gölgesi Ay'a düşer"],
 ["Ay'ın evresi","Yeni ay","Dolunay"],
 ["Ne zaman?","Gündüz","Gece"],
 ["Görüldüğü alan","Dar (küçük bölge)","Geniş (gece olan her yer)"],
 ["Süre","Kısa (birkaç dakika)","Uzun"],
 ["Çıplak gözle","Bakılmaz, göze zarar verir","İzlenebilir"]])}
<p><b>İkisinin ortak özellikleri:</b> Güneş, Dünya ve Ay <b>aynı hizadadır</b>. Bir gök cisminin <b>gölgesi</b> başka bir gök cisminin üzerine düşer.</p>
<h3>Peki neden her ay tutulma olmaz?</h3>
<p>Her ay bir yeni ay ve bir dolunay olur. O zaman her ay iki tutulma olması gerekmez mi? <b>Hayır!</b></p>
<p>Ay'ın Dünya etrafındaki yolu biraz <b>eğiktir</b>. Bu yüzden Ay çoğu ay, Güneş ile Dünya'nın tam hizasının <b>biraz üstünden ya da altından</b> geçer ve gölge hedefi ıskalar. Tutulma için üçünün <b>tam aynı hizaya</b> gelmesi gerekir; bu da her ay olmaz.</p>
<div class="rule"><span class="eyebrow">Unutma</span><b>Yeni ay ve dolunay tutulma için gerekli ama yeterli değil.</b><span>Tam hizalanma da gerekir.</span></div>
${yok("\"Her yeni ayda Güneş tutulması olur.\" Bu görüş doğru mu?","<b>Yanlış.</b> Güneş tutulması yeni ayda olur ama her yeni ayda olmaz, çünkü üç gök cismi her ay tam aynı hizaya gelmez.")}`},
{t:"Yazılıda nasıl sorulur?",h:`
<p class="lead">Tutulma soruları genelde üç şekilde gelir. Her birinin bir püf noktası var.</p>
<h3>1. Metinden çıkarım yapma</h3>
<p>Bir haber ya da hikâye verilir, "Hangi çıkarımlarda bulunabiliriz?" diye sorulur. Metindeki ipucu kelimelerin altını çiz:</p>
${tbl(["Metinde görürsen","Ne anlatır?"],[
 ["gündüz / gece","Güneş tutulması / Ay tutulması"],
 ["yeni ay / dolunay","Güneş tutulması / Ay tutulması"],
 ["birkaç dakika / yaklaşık bir saat","Güneş tutulması kısa, Ay tutulması uzun sürer"],
 ["küçük bölge / birçok ülke","Güneş tutulması dar, Ay tutulması geniş alandan görülür"]])}
<div class="ornek"><span class="eyebrow">Çözümlü örnek</span>
<p>Metin: "Tutulma gece yaşandı. Dolunay hâlindeki Ay yaklaşık bir saat boyunca karanlıkta kaldı."</p>
<p>Çıkarım: <b>Bu bir Ay tutulmasıdır, çünkü gece gözlemlenmiştir ve Ay dolunay evresindedir. Uzun sürmesi de Ay tutulmasının özelliğidir.</b></p></div>
<h3>2. Kartları sınıflandırma</h3>
<p>Her karta tek bir soru sor: <b>"Bu sadece Güneş tutulmasında mı, sadece Ay tutulmasında mı, yoksa ikisinde de mi var?"</b></p>
${tbl(["Kart","Grup"],[["Gündüz gözlemlenir.","Güneş tutulması"],["Güneş, Dünya ve Ay aynı hizadadır.","Ortak"],["Dünya'nın gölgesi Ay'a düşer.","Ay tutulması"]])}
<h3>3. Bir görüşü değerlendirme</h3>
<div class="rule"><span class="eyebrow">Kalıp</span><b>"Bu görüş doğru / yanlıştır. Çünkü ..."</b></div>
<div class="ornek"><p>Görüş: "Her dolunayda Ay tutulması olur."</p>
<p>Cevap: <b>Bu görüş yanlıştır. Ay tutulması dolunayda olur ama her dolunayda olmaz. Çünkü tutulma için Güneş, Dünya ve Ay'ın tam aynı hizada olması gerekir ve bu her ay gerçekleşmez.</b></p></div>
<div class="hata"><b>Sık yapılan hatalar:</b>
<ul><li>"Güneş tutulmasında Dünya ortadadır" demek. Güneş tutulmasında <b>Ay</b> ortadadır!</li>
<li>Yeni ay ile dolunayı karıştırmak. Hatırla: Ay ortada → yeni ay.</li>
<li>Cevabın sonuna "çünkü..." ile gerekçe yazmamak.</li></ul></div>`}

/* ===== BÖLÜM 3: BİLEŞKE KUVVET ===== */
[
{t:"Kuvvet nedir, nasıl ölçülür?",h:`
<p class="lead">Kapıyı itiyorsun, çekmeceyi çekiyorsun, topa tekme atıyorsun. Hepsinde bir <b>kuvvet</b> uyguluyorsun.</p>
<p><b>Kuvvet</b>, bir cisme uygulanan <b>itme ya da çekmedir</b>. Kuvvet bir cismi hareket ettirebilir, durdurabilir, hızlandırabilir, yavaşlatabilir ya da şeklini değiştirebilir.</p>
<p>Kuvvetin birimi <b>Newton</b>'dur, kısaca <b>N</b> yazılır. Kuvveti ölçen alete <b>dinamometre</b> denir.</p>
${dinamoSVG(6)}
<h3>Dinamometre nasıl çalışır?</h3>
<p>İçinde bir <b>yay</b> vardır. Ucundan ne kadar güçlü çekersen yay o kadar uzar. Yayın ucundaki gösterge, ölçekteki bir sayıya denk gelir; o sayı uygulanan kuvvettir.</p>
<h3>Nasıl okunur?</h3>
<p>Göstergenin hizasındaki sayıyı oku ve yanına birimini (N) yaz. Yukarıdaki dinamometre <b>6 N</b> gösteriyor.</p>
${yok("Kuvvetin birimi nedir, hangi aletle ölçülür?","Birimi <b>Newton (N)</b>'dur. <b>Dinamometre</b> ile ölçülür.")}`},
{t:"Kuvveti okla göstermek",h:`
<p class="lead">Kuvvet gözle görülmez. Bu yüzden kağıt üzerinde onu bir <b>okla</b> gösteririz.</p>
<p>Bir ok, kuvvet hakkında dört bilgi verir:</p>
<ul>
<li><b>Uygulama noktası:</b> okun başladığı yer, yani kuvvetin cisme uygulandığı nokta.</li>
<li><b>Yön:</b> okun ucunun gösterdiği taraf.</li>
<li><b>Doğrultu:</b> okun üzerinde bulunduğu çizgi.</li>
<li><b>Büyüklük:</b> okun uzunluğu. Uzun ok büyük kuvvet, kısa ok küçük kuvvet demektir.</li>
</ul>
${gridArrowSVG()}
<p>Kareli kağıtta genelde "1 kare = 1 N" gibi bir ölçek verilir. Yukarıda 3 kare doğuya çizilen ok <b>3 N, doğu</b>; 5 kare batıya çizilen ok <b>5 N, batı</b> demektir.</p>
<h3>Yön mü, doğrultu mu? (En çok karışan konu)</h3>
<div class="rule"><span class="eyebrow">Tren rayı örneği</span><span>Bir tren rayı düşün. <b>Ray, doğrultudur</b>: doğu–batı. Tren bu rayda doğuya da gidebilir, batıya da. <b>Trenin gittiği taraf ise yöndür</b>.</span></div>
<p>Bu yüzden doğuya ve batıya uygulanan iki kuvvetin <b>yönleri farklı</b>, <b>doğrultuları aynıdır</b>: ikisi de doğu–batı doğrultusundadır.</p>
${yok("Batıya uygulanan 4 N'luk bir kuvvetin yönü ve doğrultusu nedir?","Yönü: <b>batı</b>. Doğrultusu: <b>doğu–batı</b>.")}`},
{t:"Bileşke kuvvet: takım arkadaşları ve rakipler",h:`
<p class="lead">Bir cisme aynı anda birden fazla kuvvet etki edebilir. Peki sonuçta cisme ne olur?</p>
<p>Bir cisme etki eden bütün kuvvetlerin yaptığı etkiyi <b>tek başına</b> yapan kuvvete <b>bileşke kuvvet</b> denir. Yani bileşke, "Bütün bu kuvvetlerin sonucu ne?" sorusunun cevabıdır.</p>
<h3>Aynı yönde: takım arkadaşları güç birleştirir</h3>
<p>İki arkadaş bozulan bir arabayı aynı yöne itiyorsa güçleri toplanır.</p>
${forceSVG([{v:6,d:'D'},{v:4,d:'D'}])}
<p>6 N + 4 N = <b>10 N</b>, yönü yine <b>doğu</b>.</p>
<h3>Zıt yönde: rakipler</h3>
<p>Halat çekmede iki takım zıt yönlere çeker. Büyük kuvvetten küçüğü çıkarırız. Kazanan, büyük kuvvetin tarafıdır.</p>
${forceSVG([{v:7,d:'D'},{v:4,d:'B'}])}
<p>7 N − 4 N = <b>3 N</b>. Yönü büyük kuvvetin yönüdür: <b>doğu</b>.</p>
<h3>Eşit ve zıt: berabere</h3>
${forceSVG([{v:5,d:'D'},{v:5,d:'B'}])}
<p>5 N − 5 N = <b>0 N</b>. Bileşke sıfırdır, sanki hiç kuvvet yokmuş gibi. Bölüm 4'te buna <b>dengelenmiş kuvvet</b> diyeceğiz.</p>
<div class="rule"><span class="eyebrow">İki altın kural</span><b>Aynı yön → topla.<br>Zıt yön → büyükten küçüğü çıkar, yön büyüğün yönü.</b></div>
${yok("Bir cisme batıya 8 N ve doğuya 3 N kuvvet uygulanıyor. Bileşke kuvvet nedir?","8 − 3 = <b>5 N, batı</b>.")}`},
{t:"Üç kuvvet ve ters sorular",h:`
<p class="lead">Şimdi biraz zorlaştıralım. Merak etme, aynı iki kuralı kullanacağız.</p>
<h3>Üç kuvvet: önce takımları kur</h3>
${forceSVG([{n:'F1',v:12,d:'B'},{n:'F2',v:8,d:'B'},{n:'F3',v:15,d:'D'}])}
<div class="ornek"><span class="eyebrow">Adım adım</span>
<ol><li>Aynı yöndekileri topla (takım arkadaşları): batıya 12 + 8 = <b>20 N</b></li>
<li>Diğer takım: doğuya <b>15 N</b></li>
<li>Büyükten küçüğü çıkar: 20 − 15 = <b>5 N</b></li>
<li>Yön, büyük tarafın yönü: <b>batı</b></li></ol>
${tbl(["Büyüklüğü","Yönü","Doğrultusu"],[["5 N","Batı","Doğu–batı"]])}</div>
<h3>Ters soru: "Kaç N uygulamalı?"</h3>
<div class="ornek"><span class="eyebrow">Çözümlü örnek</span>
<p>Bir kutuya doğuya 5 N uygulanıyor. Bileşkenin <b>3 N, batı</b> olması isteniyor. Batıya kaç N uygulanmalı?</p>

<h3>Sürtünme nedir?</h3>
<p>İki yüzey birbirine sürtündüğünde harekete karşı koyan bir kuvvet oluşur: <b>sürtünme kuvveti</b>. Halıda bir topu yuvarlarsan çabucak durur; buz pistinde kaydırdığın bir disk ise çok uzağa gider. Çünkü buzda sürtünme çok azdır.</p>

<p>Yazılıda bu cümleyi sık sık göreceksin. Anlamı: <b>"Sürtünme yokmuş gibi düşün."</b> Böylece sadece soruda verilen kuvvetlere bakarsın.</p>
<h3>Sürtünme yoksa ne olur?</h3>
<p>Sürtünmesiz bir yerde <b>hareket eden</b> bir cisme dengelenmiş kuvvetler etki ediyorsa cisim <b>aynı süratle, aynı yönde</b> gitmeye devam eder. Onu yavaşlatacak hiçbir şey yoktur!</p>

{t:"Tablodan hareketi okumak",h:`
<p class="lead">Yazılıda arabanın hareketi genelde bir tabloyla verilir: her 1 saniyede aldığı yol. Bu sayılara bakarak arabanın ne yaptığını anlayabilirsin.</p>

<div class="ornek"><span class="eyebrow">Çözümlü örnek 1</span>

{t:"Deney tasarlamak",h:`
<p class="lead">Yazılıda "Bu deneyi nasıl yaparsınız?" diye sorulabilir. Korkma; bir yemek tarifi anlatır gibi adım adım yazman yeterli.</p>

<h3>Adımlar</h3>

/* ---------- DURUM ---------- */
const app=document.getElementById('app');

P.b=P.b||{}; P.t=P.t||{};

/* tema: oto / acik / koyu */
const HOST_THEME=document.documentElement.getAttribute('data-theme');
let THEME=(()=>{try{return localStorage.getItem('nisaTema')||'oto'}catch(e){return 'oto'}})();
const THEME_AD={oto:'Otomatik',acik:'Açık',koyu:'Koyu'};
function applyTheme(){const r=document.documentElement;
  if(THEME==='oto'){HOST_THEME?r.setAttribute('data-theme',HOST_THEME):r.removeAttribute('data-theme');}
  else r.setAttribute('data-theme',THEME==='acik'?'light':'dark');}
const themeBtn=()=>`<button class="ghost themebtn" data-act="theme" aria-label="Temayı değiştir">Tema: ${THEME_AD[THEME]}</button>`;
applyTheme();

/* kontrol grupları ve maddeler */
function blocks(key){
  const n=+key.slice(1);
  if(key[0]==='b') return [{si:0,k:n,groups:B[n-1].yazili.kontrol}];
  return T[n-1].sorular.map((s,i)=>({si:i,k:s.k,groups:s.c}));
}
function items(key){
  const out=[];
  blocks(key).forEach(bl=>bl.groups.forEach((g,gi)=>g.i.forEach((it,ii)=>out.push({id:`${key}.${bl.si}.${gi}.${ii}`,t:it[0],p:it[1],fix:it[2],k:bl.k}))));
  return out;
}
const checkedSet=key=>S.checks[key]||(S.checks[key]=new Set());
function scoreOf(key){const c=checkedSet(key);return items(key).filter(i=>c.has(i.id)).reduce((s,i)=>s+i.p,0)}
const maxOf=key=>items(key).reduce((s,i)=>s+i.p,0);

/* ---------- ORTAK PARÇALAR ---------- */
function topBar(crumbs,cur){
  return `<div class="top"><a class="back" href="#ana">← Bölümler</a>${crumbs?`<div class="crumbs">${crumbs.map((c,i)=>`<span class="crumb ${i===cur?'on':i<cur?'done':''}">${c}</span>`).join('')}</div>`:''}${themeBtn()}</div>`;
}
const BC=["Konu","Test","Yazılı","Sonuç"];
function sendBox(msg){
  const url='https://wa.me/?text='+encodeURIComponent(msg);
  return `<div class="actions center"><a class="btn wa" href="${url}" target="_blank" rel="noopener">Abime WhatsApp'tan gönder</a>
  <button class="ghost" data-act="copy">Metni kopyala</button></div>
  <textarea class="copybox" id="copybox" readonly hidden>${msg}</textarea>`;
}

/* ---------- SAYFALAR ---------- */
function vAna(){
  const N=B.length, done=B.map((_,i)=>!!(P.b[i+1]&&P.b[i+1].yazili!=null)), doneCount=done.filter(Boolean).length;
  const STAR='<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3L2.9 9.4l6.3-.9z"/></svg>';
  const nx=done.indexOf(false); let not;
  if(nx>=0){const n=nx+1,p=P.b[n]||{},b=B[nx],yz=p.test!=null;
    not={b:'Sıradaki bölüm',m:`${n}. bölüm: <b>${b.ad}</b>. `+(yz?'Testi bitirdin, sırada yazılı sorusu var. Kağıt kalemini hazırla.':`Önce konuyu oku (${KONU[nx].length} sayfa), sonra ${b.test.length} soruluk testi çöz.`),l:`#b${n}-${yz?'yazili':'konu'}`,d:(doneCount||yz)?'Kaldığım yerden devam et':'Hadi başlayalım'};}
  else{const tj=T.findIndex((_,i)=>P.t[i+1]==null);

      :{b:'Hepsi tamam!',m:'Bütün bölümler ve tatbikatlar bitti. Sınav sabahı Son Tekrar sayfasına bir göz at.',l:'#tekrar',d:"Son Tekrar'ı aç"};}
  let h=`<header class="home-head"><div class="top"><a class="back" href="../">← Ana sayfa</a>${themeBtn()}</div>
  <div class="ahead"><div><p class="date">6. Sınıf · 1. Dönem 1. Yazılı</p><h1>Fen Bilimleri</h1></div><div class="stars">${STAR}<span>${doneCount}/${N} bölüm</span></div></div>
  <p class="muted">Sınavda 7 soru var: Gezegenler 1, Tutulmalar 2, Bileşke kuvvet 2, Dengelenmiş kuvvet 2.</p></header>
  <section class="today"><h2>${not.b}</h2><p>${not.m}</p><div class="acts"><a class="btn primary" href="${not.l}">${not.d}</a></div></section>
  <ol class="how"><li>Konuyu oku, kutuları doldur</li><li>Testi çöz, site anında kontrol eder</li><li>Yazılı sorusunu kağıda çöz</li><li>Babam kontrol etsin, sonucu abime gönder</li></ol>
  <h2>Bölümler</h2><div class="bgrid">`;
  B.forEach((b,i)=>{const n=i+1,p=P.b[n]||{},d=done[i],t=p.test!=null;
    const durum=d?`${STAR}<span>Tamamlandı · Test ${p.test}/${b.test.length} · Yazılı ${p.yazili}/10</span>`:t?`<span>Test ${p.test}/${b.test.length} · sırada yazılı</span>`:`<span>${KONU[i].length} sayfa konu · ${b.test.length} soruluk test</span>`;
    h+=`<a class="bcard${d?' done':''}" style="--unit:var(--c${n});--unit-soft:var(--c${n}-soft)" href="#b${n}-konu"><span class="band"></span><span class="bbody"><span class="bno">${n}</span><span class="btxt"><h3>${b.ad}</h3><span class="sub">${b.kisa}</span></span></span><span class="bdur">${durum}</span></a>`;});

    h+=`<a class="bcard tcard${p!=null?' done':''}" href="#t${n}-soru"><span class="band"></span><span class="bbody"><span class="bno">T${n}</span><span class="btxt"><h3>${t.ad}</h3><span class="sub">${t.sorular.length} soru, gerçek sınav gibi, baba kontrollü</span></span></span><span class="bdur">${durum}</span></a>`;});
  h+=`<a class="bcard tcard" href="#tekrar"><span class="band"></span><span class="bbody"><span class="bno">★</span><span class="btxt"><h3>Son Tekrar</h3><span class="sub">Sınav sabahı için bütün kurallar tek sayfada</span></span></span><span class="bdur"><span>1 sayfa</span></span></a></div>
  <div class="actions center" id="resetZone"><button class="ghost" data-act="reset1">İlerlemeyi sıfırla</button></div>`;

}
function vKonu(n){
  const b=B[n-1], pages=KONU[n-1], L=pages.length, i=Math.min(S.page[n]||0,L-1), pg=pages[i];
  return topBar(BC,0)+`<article class="paper"><div class="top"><span class="eyebrow">Bölüm ${n} · ${b.ad}</span><span class="eyebrow">Sayfa ${i+1}/${L}</span></div>
  <div class="progress"><span style="width:${(i+1)/L*100}%"></span></div>
  <nav class="pages" aria-label="Sayfalar">${pages.map((p,j)=>`<button class="pg ${j===i?'on':j<i?'done':''}" data-act="pg" data-p="${j}" title="${p.t}">${j+1}</button>`).join('')}</nav>
  <h1>${pg.t}</h1>${pg.h}
  <div class="actions">${i>0?`<button class="ghost" data-act="pprev">← Önceki</button>`:''}${i<L-1?`<button class="primary" data-act="pnext">Sonraki sayfa →</button>`:`<button class="primary" data-act="startTest" data-n="${n}">Teste geç →</button>`}</div></article>`;
}
function vTest(n){
  const b=B[n-1],st=S.test[n]||(S.test[n]={i:0,ans:[]}),Q=b.test;
  if(st.i<Q.length){
    const q=Q[st.i],a=st.ans[st.i],answered=a!=null;
    let h=topBar(BC,1)+`<section class="paper"><div class="top"><span class="eyebrow">Bölüm ${n} · Test</span><span class="eyebrow">Soru ${st.i+1}/${Q.length}</span></div>
    <div class="progress"><span style="width:${(st.i+(answered?1:0))/Q.length*100}%"></span></div><h2>${q.q}</h2><div class="opts">`;
    q.o.forEach((o,j)=>{let cls='';if(answered){if(j===q.a)cls='right';else if(j===a)cls='wrong';}
      h+=`<button class="opt ${cls}" data-act="ans" data-j="${j}" ${answered?'disabled':''}>${String.fromCharCode(65+j)}) ${o}</button>`;});
    h+=`</div>`;
    if(answered){h+=a===q.a?`<div class="fb good"><b>Doğru!</b> ${q.n}</div>`:`<div class="fb bad"><b>Doğru cevap: ${q.o[q.a]}.</b> ${q.n}</div>`;
      h+=`<div class="actions"><button class="primary" data-act="next">${st.i+1<Q.length?'Sonraki soru →':'Test sonucunu gör →'}</button></div>`;}
    return h+`</section>`;
  }
  const sc=Q.filter((q,i)=>st.ans[i]===q.a).length, wrong=Q.filter((q,i)=>st.ans[i]!==q.a);
  let h=topBar(BC,1)+`<section class="paper result"><span class="eyebrow">Bölüm ${n} · Test sonucu</span><div class="big-score">${sc}/${Q.length}</div>`;
  h+=wrong.length?`<p>Yanlış yaptığın konular için kısa notların:</p><ul class="todo">${wrong.map(q=>`<li><b>${q.q}</b><br>${q.n}</li>`).join('')}</ul>`:`<div class="allgood">Hepsi doğru! Yazılı sorusuna geçebilirsin.</div>`;
  h+=`<div class="actions center"><button class="ghost" data-act="startTest" data-n="${n}">Testi tekrar çöz</button><a class="btn primary" href="#b${n}-yazili">Yazılı sorusuna geç →</a></div></section>`;
  return h;
}
function vYazili(n){
  const b=B[n-1];
  return topBar(BC,2)+`<section class="paper"><span class="eyebrow">Bölüm ${n} · Yazılı sorusu</span><h1>Sınavdaki gibi</h1>
  <div class="note">Nisa, cevaplarını <b>kağıda</b> yaz. Tablo varsa kağıda çizip doldur. Bitince telefonu babana ver.</div>
  ${b.yazili.soru}
  <div class="actions"><a class="btn primary" href="#b${n}-kontrol">Bitirdim, babama veriyorum →</a></div></section>`;
}
function vKontrol(key){
  const n=+key.slice(1), isB=key[0]==='b', set=checkedSet(key);
  let h=topBar(isB?BC:null,2)+`<section class="paper"><span class="eyebrow">${isB?`Bölüm ${n}`:T[n-1].ad} · Baba kontrolü</span>
  <div class="note">Babacığım, Nisa'nın kağıdına bak. Yazdığı her madde için kutuyu işaretle. Aynı anlamı kendi cümlesiyle yazdıysa da say.</div>`;
  blocks(key).forEach(bl=>{
    if(!isB) h+=`<div class="qhead">Soru ${bl.si+1} · ${KONU_AD[bl.k-1]}</div>`;
    bl.groups.forEach((g,gi)=>{
      h+=`<div class="grp ${gi===0?'first':''}"><h3>${g.b}</h3><div class="model">${g.m}</div>`;
      g.i.forEach((it,ii)=>{const id=`${key}.${bl.si}.${gi}.${ii}`;
        h+=`<label class="item" for="${id}"><input type="checkbox" id="${id}" data-id="${id}" ${set.has(id)?'checked':''}><span>${it[0]}</span><span class="p">${it[1]} p</span></label>`;});
      h+=`</div>`;
    });
  });
  h+=`</section><div class="scorebar"><span>Puan <span class="big" id="score">${scoreOf(key)}</span> / ${maxOf(key)}</span><a class="btn" style="background:var(--paper);color:var(--fg);padding:10px 14px" href="#${key}-sonuc">Sonucu gör</a></div>`;
  return h;
}
function vSonucB(n){
  const key='b'+n, s=scoreOf(key), mx=maxOf(key), c=checkedSet(key);
  P.b[n]=Object.assign({},P.b[n],{yazili:s}); save();
  const test=P.b[n].test, miss=items(key).filter(i=>!c.has(i.id)).map(i=>i.fix);
  const msg=`Nisa · Fen Bölüm ${n}: ${B[n-1].ad}\nTest: ${test!=null?test+'/5':'çözülmedi'}\nYazılı: ${s}/${mx}`+(miss.length?`\nTekrar edilecekler:\n- ${miss.join('\n- ')}`:'\nEksik yok.');
  let h=topBar(BC,3)+`<section class="paper result"><span class="eyebrow">Bölüm ${n} · Sonuç</span><h1>${B[n-1].ad}</h1>
  <div class="scores"><div>Test<b>${test!=null?test+'/5':'—'}</b></div><div>Yazılı<b>${s}/${mx}</b></div></div>`;
  h+=miss.length?`<span class="eyebrow">Tekrar edilecekler</span><ul class="todo">${miss.map(m=>`<li>${m}</li>`).join('')}</ul>`:`<div class="allgood">Eksik yok, harika!</div>`;
  h+=sendBox(msg)+`<div class="actions center"><a class="btn ghost" href="#b${n}-kontrol">Kontrole dön</a>${n<4?`<a class="btn primary" href="#b${n+1}-konu">Sonraki bölüm →</a>`:`<a class="btn primary" href="#ana">Bölümlere dön</a>`}</div></section>`;
  return h;
}
function vTSoru(n){
  const t=T[n-1],i=S.tIdx[n]||0,q=t.sorular[i],L=t.sorular.length;
  let h=topBar(null)+`<section class="paper"><div class="top"><span class="eyebrow">${t.ad} · ${KONU_AD[q.k-1]}</span><span class="eyebrow">Soru ${i+1}/${L}</span></div>
  <div class="progress"><span style="width:${(i+1)/L*100}%"></span></div>
  ${i===0?`<div class="note">Gerçek sınav gibi çöz: cevapları kağıda, soru numarasıyla yaz. Bitince telefonu babana ver.</div>`:''}
  <h2>${i+1}. Soru</h2>${q.h}
  <div class="actions">${i>0?`<button class="ghost" data-act="tprev" data-n="${n}">← Önceki</button>`:''}
  ${i<L-1?`<button class="primary" data-act="tnext" data-n="${n}">Sonraki soru →</button>`:`<a class="btn primary" href="#t${n}-kontrol">Bitirdim, babama veriyorum →</a>`}</div></section>`;
  return h;
}
function vSonucT(n){
  const key='t'+n, c=checkedSet(key), all=items(key), s=scoreOf(key), mx=maxOf(key), p100=Math.round(s/mx*100);
  P.t[n]=p100; save();
  const per=[1,2,3,4].map(k=>{const its=all.filter(i=>i.k===k);return [its.filter(i=>c.has(i.id)).reduce((a,i)=>a+i.p,0),its.reduce((a,i)=>a+i.p,0)]});
  const miss=all.filter(i=>!c.has(i.id)).map(i=>i.fix);
  const uniq=[...new Set(miss)];
  const msg=`Nisa · Fen ${T[n-1].ad}\nPuan: ${p100}/100\n`+per.map((v,i)=>`${KONU_AD[i]}: ${v[0]}/${v[1]}`).join('\n')+(uniq.length?`\nTekrar edilecekler:\n- ${uniq.join('\n- ')}`:'\nEksik yok.');
  let h=topBar(null)+`<section class="paper result"><span class="eyebrow">${T[n-1].ad} · Sonuç</span><div class="big-score">${p100}<span class="muted" style="font-size:1.2rem">/100</span></div>
  <div class="scores">${per.map((v,i)=>`<div>${KONU_AD[i]}<b>${v[0]}/${v[1]}</b></div>`).join('')}</div>`;
  h+=uniq.length?`<span class="eyebrow">Tekrar edilecekler</span><ul class="todo">${uniq.map(m=>`<li>${m}</li>`).join('')}</ul>`:`<div class="allgood">Eksik yok, sınava hazırsın!</div>`;
  h+=sendBox(msg)+`<div class="actions center"><a class="btn ghost" href="#t${n}-kontrol">Kontrole dön</a><a class="btn primary" href="#ana">Ana sayfa</a></div></section>`;
  return h;
}
function vTekrar(){
  const R=[
   ["Gezegenler",["Sıra: Me-Ve-Dü-Ma · Jü-Sa-Ur-Ne","İç = karasal = halkasız: Merkür, Venüs, Dünya, Mars","Dış = gazsal = halkalı: Jüpiter, Satürn, Uranüs, Neptün","Mars ile Jüpiter arası: asteroit kuşağı","En küçük Merkür, en büyük Jüpiter","Gerekçe: [Gezegen] [grup] gezegendir, çünkü [özellik]."]],
   ["Tutulmalar",["Ortada duran gölge yapar.","Güneş tutulması: Güneş – Ay – Dünya, gündüz, yeni ay, dar alan, kısa, çıplak gözle bakılmaz","Ay tutulması: Güneş – Dünya – Ay, gece, dolunay, geniş alan, uzun","Ortak: üçü aynı hizada, bir cismin gölgesi diğerine düşer","Her ay tutulma olmaz, çünkü tam hizalanma her ay olmaz."]],
   ["Bileşke kuvvet",["Tablo: Büyüklük (N) · Yön (doğu/batı) · Doğrultu (doğu–batı)","Aynı yön: topla. Zıt yön: büyükten küçüğü çıkar, yön büyüğün.","Üç kuvvet: önce aynı yöndekileri topla.","Ters soru: istenen bileşke + karşı taraftaki kuvvet.","Oku çiz, üzerine büyüklüğünü yaz. İşlemi göster."]],
   ["Dengelenmiş kuvvet",["Bileşke 0 → dengelenmiş → hareket değişmez (duran durur, giden aynı süratle gider).","Bileşke 0 değil → dengelenmemiş → harekete başlar, hızlanır ya da yavaşlar.","Tablo: yollar eşit → sabit sürat; artıyor → hızlanıyor; azalıyor → yavaşlıyor.","Deney: dinamometre (kuvvet), kronometre (süre), cetvel (yol).","Kontrol değişkeni: aynı araba, aynı zemin."]]];
  return topBar(null)+`<article class="paper"><span class="eyebrow">Sınav sabahı</span><h1>Son Tekrar</h1>${R.map(([t,l])=>`<section><h2>${t}</h2><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('')}
  <div class="rule"><b>Unutma:</b><span>Her cevabın sonuna "çünkü..." ile bir gerekçe ekle.</span></div></article>`;
}

/* ---------- YÖNLENDİRME ---------- */
function render(){
  const h=(location.hash||'#ana').slice(1); let html; let m;
  try{const bm=h.match(/^b(\d)-/),tm=h.match(/^t(\d)-/);if(bm)localStorage.setItem('nisaSon',JSON.stringify({d:DERS,b:+bm[1],t:Date.now()}));else if(tm)localStorage.setItem('nisaSon',JSON.stringify({d:DERS,tt:+tm[1],t:Date.now()}));}catch(e){}
  const um=h.match(/^b([1-4])-/);
  if(um){app.style.setProperty('--unit',`var(--c${um[1]})`);app.style.setProperty('--unit-soft',`var(--c${um[1]}-soft)`);app.dataset.unit=um[1];}
  else{app.style.removeProperty('--unit');app.style.removeProperty('--unit-soft');delete app.dataset.unit;}
  if((m=h.match(/^b([1-4])-(konu|test|yazili|kontrol|sonuc)$/))){const n=+m[1];
    html={konu:()=>vKonu(n),test:()=>vTest(n),yazili:()=>vYazili(n),kontrol:()=>vKontrol('b'+n),sonuc:()=>vSonucB(n)}[m[2]]();}
  else if((m=h.match(/^t([12])-(soru|kontrol|sonuc)$/))){const n=+m[1];
    html={soru:()=>vTSoru(n),kontrol:()=>vKontrol('t'+n),sonuc:()=>vSonucT(n)}[m[2]]();}
  else if(h==='tekrar') html=vTekrar();
  else html=vAna();
  app.innerHTML=html;
}
function goTop(){window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();goTop();});
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='startTest'){const n=+el.dataset.n;S.test[n]={i:0,ans:[]};if(location.hash==='#b'+n+'-test'){render();goTop();}else location.hash='b'+n+'-test';}
  else if(act==='ans'){const n=+location.hash.match(/b(\d)/)[1],st=S.test[n];st.ans[st.i]=+el.dataset.j;render();}
  else if(act==='next'){const n=+location.hash.match(/b(\d)/)[1],st=S.test[n];st.i++;
    if(st.i>=B[n-1].test.length){const sc=B[n-1].test.filter((q,i)=>st.ans[i]===q.a).length;P.b[n]=Object.assign({},P.b[n],{test:sc});save();}
    render();goTop();}
  else if(act==='pg'||act==='pnext'||act==='pprev'){const n=+location.hash.match(/b(\d)/)[1];const cur=S.page[n]||0;
    S.page[n]=act==='pg'?+el.dataset.p:cur+(act==='pnext'?1:-1);render();goTop();}
  else if(act==='theme'){THEME={oto:'acik',acik:'koyu',koyu:'oto'}[THEME];try{localStorage.setItem('nisaTema',THEME)}catch(e){}applyTheme();document.querySelectorAll('.themebtn').forEach(b=>b.textContent='Tema: '+THEME_AD[THEME]);}
  else if(act==='reset1'){document.getElementById('resetZone').innerHTML=`<span>Bütün puanlar silinsin mi?</span><button class="ghost" data-act="reset0">Vazgeç</button><button class="primary" data-act="reset2">Evet, sıfırla</button>`;}
  else if(act==='reset0'){render();}
  else if(act==='reset2'){P={b:{},t:{}};save();S.test={};S.checks={};S.tIdx={};S.page={};render();goTop();}
  else if(act==='tnext'||act==='tprev'){const n=+el.dataset.n;S.tIdx[n]=(S.tIdx[n]||0)+(act==='tnext'?1:-1);render();goTop();}
  else if(act==='adim'){const box=el.closest('.adimlar'),nx=box.querySelector('li[hidden]');if(nx){nx.hidden=false;nx.classList.add('yeni');}if(!box.querySelector('li[hidden]')){el.textContent='Çözüm tamam';el.disabled=true;el.className='ghost';}}
  else if(act==='deney'){const box=el.closest('.deney'),n=+el.dataset.n,c={'Mavi':0,'Sarı':0,'Kırmızı':0},renk={'Mavi':'#3c86d6','Sarı':'#e9a619','Kırmızı':'#d0452f'};for(let i=0;i<n;i++){const r=Math.floor(Math.random()*4);c[r<2?'Mavi':r===2?'Sarı':'Kırmızı']++;}box.querySelector('.dsonuc').innerHTML='<p><b>'+n+' kez çevrildi:</b></p>'+Object.keys(c).map(k=>'<div class="dbar"><span class="dad">'+k+'</span><span class="dcub"><span style="width:'+(c[k]/n*100)+'%;background:'+renk[k]+'"></span></span><span class="dsay">'+c[k]+'/'+n+'</span></div>').join('');box.querySelector('.dgecmis').insertAdjacentHTML('afterbegin','<li>'+n+' çevirme → mavi '+c['Mavi']+'/'+n+'</li>');}
  else if(act==='kontrol'){const box=el.closest('.birlikte'),ins=[...box.querySelectorAll('input.bos')];const nz=v=>String(v).trim().replace(/\s+/g,'').replace(/\./g,',').toLowerCase();let ok=0;ins.forEach(i=>{const d=i.dataset.c.split('|').some(c=>nz(c)===nz(i.value));i.classList.toggle('dogru',d);i.classList.toggle('yanlis',!d);if(d)ok++;});const fb=box.querySelector('.bfb');fb.hidden=false;fb.className='bfb '+(ok===ins.length?'iyi':'kotu');fb.textContent=ok===ins.length?'Harika, hepsi doğru!':(ins.length-ok)+' boşluk yanlış. Kırmızı olanları düzeltip tekrar dene.';}
  else if(act==='copy'){const box=document.getElementById('copybox');const txt=box.value;
    const fallback=()=>{box.hidden=false;box.focus();box.select();el.textContent='Seç ve kopyala';};
    try{navigator.clipboard.writeText(txt).then(()=>{el.textContent='Kopyalandı ✓';},fallback);}catch(err){fallback();}}
});
app.addEventListener('change',e=>{
  const cb=e.target.closest('input[data-id]'); if(!cb) return;
  const key=cb.dataset.id.split('.')[0], set=checkedSet(key);
  cb.checked?set.add(cb.dataset.id):set.delete(cb.dataset.id);
  const sc=document.getElementById('score'); if(sc) sc.textContent=scoreOf(key);
});
render();
</script>
