<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nisa'nın Çalışma Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Ana sayfa: kareli defter. Ders ilerlemeleri her dersin kendi kaydından (localStorage) okunur. */
:root{
  --bg:#F8FAFD; --grid:#DCE6F5; --paper:#FFFFFF; --fg:#1E2A5A; --muted:#51608F; --line:#C9D4EA; --edge:#1E2A5A;
  --note:#FFF06A; --note-edge:#E3D23E; --tape:#9FD8F7; --star:#FFC83D; --star-off:#A9B6D6;
  --fen:#4B8DF7; --mat:#FF8A3D; --sos:#2FA36B;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D; --star-off:#4C5A8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D; --star-off:#4C5A8C; color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.55;color:var(--fg);
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:34px}
h1,h2{font-family:var(--hand);font-weight:400;margin:0;line-height:1.05}
h3,p{margin:0}
a{color:var(--fg)}
a:focus-visible,button:focus-visible{outline:3px solid var(--fen);outline-offset:3px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.date{font-weight:700;color:var(--muted)}
h1{font-size:3rem}
.stars{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--edge);border-radius:999px;padding:7px 16px 7px 12px;font-weight:800}
.stars svg{width:24px;height:24px}

.today{position:relative;background:var(--note);padding:30px 30px 28px;transform:rotate(-1deg);box-shadow:0 10px 0 -4px var(--note-edge);display:grid;gap:14px}
.today::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-70px;width:140px;height:28px;background:var(--tape);opacity:.85;transform:rotate(2deg)}
.today h2{font-size:2.3rem}
.today p{font-size:1.15rem;max-width:34em}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;text-decoration:none;font-weight:800;font-size:1.1rem;padding:13px 22px;border-radius:14px;min-height:48px;box-sizing:border-box}
.btn.dark{background:var(--fg);color:var(--paper)}
.btn.plain{padding-inline:8px}

.sec{display:grid;gap:16px}
.sec h2{font-size:2.3rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{text-decoration:none;color:var(--fg);background:var(--paper);border:2px solid var(--edge);border-radius:6px;box-shadow:6px 6px 0 var(--edge);display:flex;flex-direction:column;overflow:hidden}
.card:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--edge)}
.card .band{height:14px;border-bottom:2px solid var(--edge)}
.card .body{padding:18px 20px 20px;display:grid;gap:8px}
.card h3{font-size:1.55rem;font-weight:800;line-height:1.2}
.card .sub{color:var(--muted);font-size:.98rem}
.row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.row svg{width:30px;height:30px}
.card .say{font-family:var(--hand);font-size:1.35rem}

.soon h2{font-size:1.9rem;color:var(--muted)}
.soonlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.soonlist div{border:2px dashed var(--line);border-radius:6px;padding:16px;background:var(--paper);opacity:.9;display:grid;gap:2px}
.soonlist b{font-size:1.15rem}
.soonlist span{font-family:var(--hand);font-size:1.2rem;color:var(--muted)}

.foot{display:flex;justify-content:center}
.themebtn{font:inherit;font-weight:800;font-size:.95rem;color:var(--fg);background:var(--paper);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer}

@media (max-width:600px){ h1{font-size:2.5rem} .cards{grid-template-columns:1fr} .soonlist{grid-template-columns:1fr 1fr} .today{padding:26px 22px 24px} }
@media (min-width:700px){ body{font-size:18px} }
@media (prefers-reduced-motion:reduce){ .card:hover{transform:none} }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
const STAR_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3L2.9 9.4l6.3-.9z" fill="var(--star)" stroke="var(--edge)" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const STAR_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3L2.9 9.4l6.3-.9z" fill="none" stroke="var(--star-off)" stroke-width="1.6" stroke-linejoin="round"/></svg>';

/* Her dersin bilgisi; ilerleme kaydı dersin kendi sayfası tarafından tutulur */
const DERSLER=[
  {id:'fen',ad:'Fen Bilimleri',kisa:'Fen',url:'fen/',key:'nisaFen',renk:'var(--fen)',sub:'Gezegenler, tutulmalar, kuvvet',
   bolum:['Güneş Sistemi ve Gezegenler','Güneş ve Ay Tutulmaları','Bileşke Kuvvet','Dengelenmiş ve Dengelenmemiş Kuvvetler'],sayfa:[4,5,5,5],tatbikat:2,tatSoru:7},
  {id:'mat',ad:'Matematik',kisa:'Matematik',url:'matematik/',key:'nisaMat',renk:'var(--mat)',sub:'Çarpan, bölünebilme, asal, olasılık, ondalık',
   bolum:['Çarpanlar ve Katlar','Bölünebilme Kuralları','Asal Sayılar','Ortak Kat ve Ortak Bölen','Olasılık','Ondalık Gösterimler'],sayfa:[4,5,4,5,5,4],tatbikat:1,tatSoru:7},
  {id:'sos',ad:'Sosyal Bilgiler',kisa:'Sosyal',url:'sosyal/',key:'nisaSos',renk:'var(--sos)',sub:'Roller, kültürel bağlar, çözüm, konum',
   bolum:['Gruplar ve Rollerimiz','Kültürel Bağlar ve Millî Değerler','Toplumsal Sorunlara Çözüm','Paralel, Meridyen ve Mutlak Konum','Türkiye, Kıtalar ve Okyanuslar'],sayfa:[4,4,4,4,4],tatbikat:1,tatSoru:10}
];
const YAKINDA=['Türkçe','İngilizce'];

const oku=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function durum(d){
  const P=oku(d.key)||{}; const b=P.b||{}, t=P.t||{};
  const bitti=d.bolum.map((_,i)=>b[i+1]&&b[i+1].yazili!=null);
  const tat=[...Array(d.tatbikat)].map((_,i)=>t[i+1]);
  const basladi=Object.keys(b).length>0||Object.keys(t).length>0;
  let sira=null;
  for(let i=0;i<d.bolum.length;i++) if(!bitti[i]){sira={tip:'bolum',n:i+1,asama:(b[i+1]&&b[i+1].test!=null)?'yazili':'konu'};break;}
  if(!sira){const j=tat.findIndex(x=>x==null); if(j>=0) sira={tip:'tat',n:j+1};}
  return {bitti,tat,basladi,sira,sayi:bitti.filter(Boolean).length};
}

function oneri(S){
  const son=oku('nisaSon');
  const sirali=[...DERSLER].sort((a,b)=>(son&&a.id===son.d?-1:0)-(son&&b.id===son.d?-1:0));
  let sec=sirali.find(d=>S[d.id].sira&&S[d.id].sira.tip==='bolum')
       || sirali.find(d=>S[d.id].sira);
  if(son){const sd=DERSLER.find(d=>d.id===son.d); if(sd&&S[sd.id].sira) sec=sd;}
  if(!sec) return {baslik:'Hepsini bitirdin!',metin:'Bütün bölümler ve tatbikatlar tamam. Sınavdan önce Son Tekrar sayfalarına bir göz at.',link:'fen/#tekrar',dugme:'Fen Son Tekrar\'ı aç'};
  const r=S[sec.id].sira, herhangi=DERSLER.some(d=>S[d.id].basladi);
  const dugme=herhangi?'Kaldığım yerden devam et':'Hadi başlayalım';
  if(r.tip==='tat') return {baslik:'Bugün ne çalışsam?',metin:`${sec.ad}'in bütün bölümleri bitti! Sırada Sınav Tatbikatı ${r.n} var: gerçek sınav gibi ${sec.tatSoru} soru.`,link:`${sec.url}#t${r.n}-soru`,dugme};
  const ad=sec.bolum[r.n-1];
  if(r.asama==='yazili') return {baslik:'Bugün ne çalışsam?',metin:`${sec.ad}, ${r.n}. bölüm: <b>${ad}</b>. Testi bitirdin, sırada yazılı sorusu var. Kağıt kalemini hazırla.`,link:`${sec.url}#b${r.n}-yazili`,dugme};
  return {baslik:'Bugün ne çalışsam?',metin:`${sec.ad}, ${r.n}. bölüm: <b>${ad}</b>. Önce konuyu oku (${sec.sayfa[r.n-1]} sayfa), sonra 5 soruluk testi çöz.`,link:`${sec.url}#b${r.n}-konu`,dugme};
}

/* tema: oto / açık / koyu (ders sayfalarıyla aynı kayıt) */
const THEME_AD={oto:'Otomatik',acik:'Açık',koyu:'Koyu'};
let THEME=(()=>{try{return localStorage.getItem('nisaTema')||'oto'}catch(e){return 'oto'}})();
function applyTheme(){const r=document.documentElement; if(THEME==='oto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',THEME==='acik'?'light':'dark');}
applyTheme();

function render(){
  const S={}; DERSLER.forEach(d=>S[d.id]=durum(d));
  const yildiz=DERSLER.reduce((a,d)=>a+S[d.id].sayi+S[d.id].tat.filter(x=>x!=null).length,0);
  const o=oneri(S);
  const tarih=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
  let h=`<header class="head"><div><p class="date">${tarih}</p><h1>Merhaba Nisa!</h1></div>
  <div class="stars" aria-label="${yildiz} yıldız">${STAR_ON}<span>${yildiz} yıldız</span></div></header>
  <section class="today" aria-labelledby="bugun"><h2 id="bugun">${o.baslik}</h2><p>${o.metin}</p>
  <div class="acts"><a class="btn dark" href="${o.link}">${o.dugme}</a><a class="btn plain" href="#dersler">Başka bir ders seç</a></div></section>
  <section class="sec" id="dersler" aria-labelledby="dh"><h2 id="dh">Derslerim</h2><div class="cards">`;
  DERSLER.forEach(d=>{const s=S[d.id], N=d.bolum.length;
    const tatSon=s.tat.filter(x=>x!=null);
    const ek=tatSon.length?` · Tatbikat ${tatSon[tatSon.length-1]}/100`:'';
    const say=s.sayi===N?`${N} bölümün hepsi bitti${ek}`:s.sayi===0?`${N} bölüm, hadi ilkine başla`:`${N} bölümden ${s.sayi}${["'i","'si","'ü","'ü","'i","'sı"][s.sayi-1]} bitti${ek}`;
    h+=`<a class="card" href="${d.url}"><span class="band" style="background:${d.renk}"></span><span class="body">
    <h3>${d.ad}</h3><span class="sub">${d.sub}</span>
    <span class="row" aria-hidden="true">${s.bitti.map(x=>x?STAR_ON:STAR_OFF).join('')}</span>
    <span class="say">${say}</span></span></a>`;});
  h+=`</div></section>
  <section class="sec soon" aria-labelledby="yh"><h2 id="yh">Yakında eklenecek</h2><div class="soonlist">${YAKINDA.map(y=>`<div><b>${y}</b><span>Abim hazırlıyor</span></div>`).join('')}</div></section>
  <footer class="foot"><button class="themebtn" id="tema" type="button">Tema: ${THEME_AD[THEME]}</button></footer>`;
  document.getElementById('app').innerHTML=h;
  document.getElementById('tema').onclick=()=>{THEME={oto:'acik',acik:'koyu',koyu:'oto'}[THEME];try{localStorage.setItem('nisaTema',THEME)}catch(e){}applyTheme();render();};
}
render();
window.addEventListener('pageshow',render);
</script>
</body>
</html>
