<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nisa Sosyal Bilgiler Çalışması</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Sosyal Bilgiler · Layout: tek sütun "çalışma defteri"; sayfalama hash ile (ana → bölüm: konu → test → yazılı → baba kontrolü → sonuç; tatbikat: 7 soru → kontrol → sonuç) */
:root{
  --bg:#eef2f8; --paper:#ffffff; --fg:#1b2540; --muted:#5d6a86; --line:#d6deec;
  --accent:#2f5bd3; --accent-soft:#e6ecfc; --ok:#178a57; --ok-soft:#e0f3e9; --warn:#b5531a; --warn-soft:#fbeadf;
  --force:#d0452f; --box:#c7d2e6; --sun:#f4b733; --shadow:rgba(20,28,48,.30); --on-accent:#ffffff;
  --c1:#4b46c7; --c1-soft:#e9e8fb; --c2:#c26510; --c2-soft:#fcecd9; --c3:#c93a2b; --c3-soft:#fbe3df; --c4:#1d8656; --c4-soft:#dcf2e6; --c5:#0b7f86; --c5-soft:#d8f1f2; --c6:#8a4fd6; --c6-soft:#efe6fb;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629; --c5:#4fd2da; --c5-soft:#113538; --c6:#c5a3ff; --c6-soft:#2c2246}}
:root[data-theme="dark"]{
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629; --c5:#4fd2da; --c5-soft:#113538; --c6:#c5a3ff; --c6-soft:#2c2246}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{font-weight:700;text-decoration:none;font-size:.95rem}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.crumb.on{background:var(--unit,var(--accent));border-color:var(--unit,var(--accent));color:var(--on-accent)}
.crumb.done{color:var(--ok);border-color:var(--ok)}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.paper > section{display:grid;gap:10px}
.rule{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.rule b{font-family:var(--display);font-size:1.15rem}
.ornek{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ornek .eyebrow{color:var(--accent)}
.hata{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px}
.hata b:first-child{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.mini > b:first-child{font-family:var(--display);font-size:1.05rem;display:block}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:420px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:800}
td.blank{height:2.2em}

.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:320px}
.fig text{font-family:var(--body);font-weight:700;font-size:13px;fill:var(--fg)}
.cap{font-size:.82rem;color:var(--muted);text-align:center}

.qs{list-style:none;padding:0;display:grid;gap:10px}
.qs li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.ql{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.5}
.pts{color:var(--muted);font-size:.85rem;white-space:nowrap}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}

button,.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.wa{background:#1f9d55;color:#fff}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions.center{justify-content:center}

.lead{font-size:1.05rem;border-left:4px solid var(--unit,var(--accent));padding:4px 0 4px 14px;color:var(--fg)}
details.yokla{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
details.yokla summary{cursor:pointer;font-weight:700;display:grid;gap:2px}
details.yokla summary .eyebrow{color:var(--accent)}
details.yokla summary::after{content:"Cevabı görmek için dokun";font-weight:600;font-size:.82rem;color:var(--muted)}
details.yokla[open] summary::after{content:""}
details.yokla p{margin-top:8px;background:var(--ok-soft);border-radius:8px;padding:8px 10px}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pg{width:36px;height:36px;padding:0;border-radius:50%;font-size:.95rem;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pg.on{background:var(--unit,var(--accent));color:var(--on-accent);border-color:var(--unit,var(--accent))}
.pg.done{color:var(--ok);border-color:var(--ok)}
.hata ul{margin-top:6px}
.themebtn{min-height:0;padding:6px 12px;font-size:.85rem;border-radius:999px;margin-left:auto}
/* Ana sayfa */
.home-head{display:grid;gap:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;list-style:none;padding:0;counter-reset:h}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;counter-increment:h}
.how li::before{content:counter(h);font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.3rem;display:block;line-height:1}
.unit{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg)}
.unit:hover{border-color:var(--unit,var(--accent))}
.unit .no{font-family:var(--display);font-weight:800;font-size:1.6rem;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--unit-soft,var(--accent-soft));color:var(--unit,var(--accent))}
.unit h3{font-size:1.1rem}
.unit .sub{font-size:.85rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.list{display:grid;gap:10px}

/* Test */
.opts{display:grid;gap:8px}
.opt{background:var(--paper);color:var(--fg);border:2px solid var(--line);text-align:left;font-family:var(--body);font-weight:700;font-size:1rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--ok-soft)} .fb.good b{color:var(--ok)}
.fb.bad{background:var(--warn-soft)} .fb.bad b{color:var(--warn)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--unit,var(--accent));border-radius:99px}
#app[data-unit] .paper{border-top:5px solid var(--unit)}

/* Kontrol */
.grp{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.grp.first{border-top:0;padding-top:0}
.qhead{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--accent);margin-top:6px}
.model{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
label.item{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;cursor:pointer;padding:6px 4px;border-radius:8px}
label.item:hover{background:var(--accent-soft)}
label.item input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ok)}
.item .p{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.scorebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--paper);border-radius:14px;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.scorebar .big{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.scorebar button{background:var(--paper);color:var(--fg);padding:10px 14px}

/* Sonuç */
.result{text-align:center;justify-items:center}
.big-score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.scores div{border:1px solid var(--line);border-radius:12px;padding:10px}
.scores b{font-family:var(--display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.todo{list-style:none;padding:0;display:grid;gap:8px;text-align:left;width:100%}
.todo li{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px}
.allgood{background:var(--ok-soft);padding:12px;border-radius:10px;width:100%}
textarea.copybox{width:100%;min-height:140px;font-family:var(--body);font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}

/* Matematik ekleri */
.num{font-family:var(--display);font-size:1.35em;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.blot{display:inline-block;width:1em;height:1.05em;border-radius:48% 52% 40% 60%/55% 45% 55% 45%;background:var(--fg);vertical-align:-.12em;margin:0 2px}
.ph{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;padding:0 3px;border:2px dashed var(--unit,var(--accent));border-radius:6px;font-size:.75em;margin:0 2px;color:var(--unit,var(--accent));font-weight:800;vertical-align:middle;box-sizing:border-box;letter-spacing:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-weight:800;line-height:1.15;margin:0 3px;font-variant-numeric:tabular-nums}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.algo-row{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.algo-box{display:grid;gap:6px;justify-items:center}
.algo{display:grid;grid-template-columns:auto auto;font-family:var(--display);font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.55}
.algo span{padding:0 14px}
.algo span:nth-child(odd){border-right:3px solid var(--fg);text-align:right}
.algo span:nth-child(even){color:var(--unit,var(--accent))}
.sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:560px;width:100%;margin:0 auto}
.sieve span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-weight:800;font-size:.85rem;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.sieve span.p{background:var(--unit,var(--accent));color:var(--on-accent)}
.sieve span.one{background:transparent;border:1px dashed var(--line)}
.unit.other .no{font-size:1.3rem}
.basamak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 18px repeat(3,minmax(0,1fr));gap:6px;max-width:640px;width:100%;margin:0 auto}
.basamak .bs{border:2px solid var(--edge);border-radius:8px;background:var(--paper);display:grid;grid-template-rows:auto 1fr;text-align:center;overflow:hidden}
.basamak .bs.ond{background:var(--unit-soft,var(--accent-soft))}
.basamak .bs.bosb{opacity:.45}
.basamak .ba{font-size:.72rem;font-weight:800;padding:4px 2px;border-bottom:2px solid var(--edge);line-height:1.25;color:var(--muted)}
.basamak .br{font-family:var(--display);font-size:2.2rem;line-height:1.5;min-height:1.5em}
.basamak .virgul{font-family:var(--display);font-size:2.8rem;display:grid;align-items:end;justify-content:center;line-height:1.1}
.fig.yuz svg{max-width:250px;min-width:0;margin:0 auto}

html{-webkit-text-size-adjust:100%}
button,.btn,.opt,label.item,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Tablet (iPad) */
@media (min-width:700px){
  body{font-size:18px;line-height:1.65;padding-block:28px 64px}
  .wrap{max-width:860px;gap:20px}
  .paper{padding:30px 34px;gap:18px;border-radius:20px}
  h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
  .lead{font-size:1.15rem}
  .fig svg{min-width:0}
  .fig text{font-size:14px}
  table{font-size:1rem}
  th,td{padding:10px 14px}
  button,.btn{font-size:1.15rem;padding:14px 22px;min-height:52px}
  .opts{grid-template-columns:1fr 1fr;gap:12px}
  .opt{min-height:64px;font-size:1.08rem}
  .pg{width:46px;height:46px;font-size:1.05rem;min-height:0;padding:0}
  label.item{grid-template-columns:30px 1fr auto;padding:10px 8px;font-size:1.05rem}
  label.item input{width:26px;height:26px}
  .unit{grid-template-columns:64px 1fr auto;padding:18px}
  .unit .no{width:64px;height:64px;font-size:1.9rem}
  .unit h3{font-size:1.3rem}
  .cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .mini{padding:14px 16px}
  details.yokla{padding:14px 18px}
  .scorebar{padding:14px 22px}
  .big-score{font-size:4rem}
}
@media (min-width:1000px){ .wrap{max-width:920px} }
@media (prefers-reduced-motion:no-preference){.paper{animation:in .22s ease}}
@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}

/* ===== Kareli defter teması ===== */
:root{
  --bg:#F8FAFD; --grid:#DCE6F5; --paper:#FFFFFF; --fg:#1E2A5A; --muted:#51608F; --line:#C9D4EA; --edge:#1E2A5A;
  --accent:#2C47A8; --accent-soft:#EEF2FB; --on-accent:#FFFFFF; --note:#FFF06A; --note-edge:#E3D23E; --tape:#9FD8F7;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --display:var(--hand);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}}
:root[data-theme="dark"]{
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2{font-family:var(--hand);font-weight:400;letter-spacing:.2px}
h1{font-size:2.3rem;line-height:1.05} h2{font-size:1.7rem;line-height:1.1}
h3{font-family:var(--body);font-weight:800}
.eyebrow{text-transform:none;letter-spacing:0;font-size:.88rem;font-weight:800}
.back{font-weight:800;color:var(--fg)}
.paper{border:2px solid var(--edge);border-radius:8px;box-shadow:6px 6px 0 var(--edge)}
#app[data-unit] .paper{border-top:2px solid var(--edge);background-image:linear-gradient(var(--unit),var(--unit));background-size:100% 12px;background-repeat:no-repeat;padding-top:32px}
.rule{background:var(--note);border-radius:3px;box-shadow:0 6px 0 -2px var(--note-edge)}
.rule b{font-family:var(--hand);font-weight:400;font-size:1.45rem;line-height:1.2}
.note{background:var(--accent-soft);border:2px dashed var(--line)}
.ornek{background:var(--paper)}
.unit{border:2px solid var(--edge);border-radius:8px;box-shadow:4px 4px 0 var(--edge)}
.unit:hover{border-color:var(--edge);box-shadow:5px 5px 0 var(--edge);transform:translate(-1px,-1px)}
.unit .no{border:2px solid var(--edge);border-radius:50%;font-family:var(--hand);font-weight:400}
.how li{border:2px solid var(--edge);border-radius:8px}
.how li::before{font-family:var(--hand);font-weight:400;font-size:1.6rem;color:var(--fg)}
button,.btn{font-family:var(--body);font-weight:800}
.primary{background:var(--fg);color:var(--paper);border:2px solid var(--fg)}
.ghost{background:var(--paper);color:var(--fg);border:2px solid var(--edge)}
.opt{border:2px solid var(--edge);border-radius:10px}
.crumb{border:2px solid var(--line)}
.pg{border:2px solid var(--line)}
.progress{height:12px;background:var(--paper);border:2px solid var(--edge)}
.chip{border:1.5px solid var(--line);font-family:var(--hand);font-weight:400;font-size:1.02rem;background:var(--paper)}
.chip.ok{border-color:var(--ok)}
.scorebar{background:var(--fg);color:var(--paper);border-radius:10px}
.big-score{font-family:var(--hand);font-weight:400}
.scores div{border:2px solid var(--edge);border-radius:8px}
.scores b{font-family:var(--hand);font-weight:400}
details.yokla{border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.qhead{font-family:var(--hand);font-weight:400;font-size:1.55rem}
.themebtn{border:2px solid var(--edge)}
.todo li{border-radius:3px}
@media (min-width:700px){ h1{font-size:2.8rem} h2{font-size:2rem} .rule b{font-size:1.6rem} }

/* ===== Anlatım sayfaları: ferah düzen ve defter süsleri ===== */
:root{--rl:#E3EAF6;--margin:#F3A6A6;--hl:rgba(255,232,64,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}}
:root[data-theme="dark"]{--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}
article.paper{gap:22px}
article.paper > p, article.paper > .lead{max-width:40em}
article.paper h1{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--unit,var(--accent));text-decoration-thickness:2px;text-underline-offset:12px;text-decoration-skip-ink:none;padding-bottom:4px}
article.paper h3{margin-top:4px}
article.paper p b, article.paper li b{background:linear-gradient(transparent 56%,var(--hl) 56%);padding:0 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rule p b, .rule li b, .hata p b, .hata li b{background:none;padding:0}
article.paper .deney p b{background:none;padding:0}
.rule span b{font-family:inherit;font-size:inherit;font-weight:800;line-height:inherit}
.ornek{position:relative;display:block;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rl) 31px,var(--rl) 32px);background-position:0 12px;border:2px solid var(--edge);border-radius:6px;box-shadow:4px 4px 0 var(--edge);padding:12px 18px 14px 50px;line-height:32px}
.ornek > *{margin:0;line-height:32px}
.ornek .eyebrow{display:block;color:var(--unit,var(--accent))}
.ornek .tbl-wrap,.ornek .fig{margin:8px 0;line-height:1.5}
.ornek .tbl-wrap *{line-height:1.5}
.rule{position:relative;transform:rotate(-.4deg);padding:20px 20px 18px;margin-top:6px}
.rule::before{content:"";position:absolute;top:-11px;left:24px;width:84px;height:22px;background:var(--tape);opacity:.8;transform:rotate(-3deg)}
article.paper > .fig{background:var(--paper);border:2px solid var(--edge);border-radius:6px;padding:14px 12px}
.hata{background:var(--warn-soft);border:2px dashed var(--warn);border-radius:6px;padding:14px 16px}
.mini{border:2px solid var(--edge);border-radius:8px;background:var(--paper);box-shadow:3px 3px 0 var(--edge)}
.mini > b:first-child{font-family:var(--hand);font-weight:400;font-size:1.35rem;margin-bottom:2px}
details.yokla{background:var(--accent-soft);border:2px dashed var(--edge)}
details.yokla[open]{background:var(--paper);border-style:solid}
.adimlar{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px 18px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--edge)}
.adimlar .eyebrow{color:var(--unit,var(--accent))}
.adimlar ol{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:a}
.adimlar li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.adimlar li::before{content:counter(a);width:32px;height:32px;border-radius:50%;background:var(--unit,var(--accent));color:var(--on-accent);display:grid;place-items:center;font-family:var(--hand);font-size:1.2rem}
.adimlar .actions{justify-content:flex-start}
.birlikte{border:2px dashed var(--unit,var(--accent));border-radius:10px;background:var(--unit-soft,var(--accent-soft));padding:16px 18px;display:grid;gap:10px}
.birlikte .eyebrow{color:var(--fg)}
.birlikte .satir{font-size:1.12rem;line-height:2.3}
.birlikte .actions{justify-content:flex-start}
input.bos{font:inherit;font-weight:800;width:3em;text-align:center;border:none;border-bottom:3px solid var(--fg);background:var(--paper);color:var(--fg);border-radius:6px 6px 0 0;padding:1px 4px;margin:0 3px;line-height:1.4}
input.bos.genis{width:5em}
.frac input.bos{width:2.4em;margin:0 0 2px}
input.bos.dogru{background:var(--ok-soft);border-bottom-color:var(--ok)}
input.bos.yanlis{background:var(--warn-soft);border-bottom-color:var(--warn)}
.bfb{font-weight:800} .bfb.iyi{color:var(--ok)} .bfb.kotu{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.adimlar li.yeni{animation:adim .35s ease}}
@keyframes adim{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (min-width:700px){ .wrap{max-width:940px} article.paper{padding:40px 52px 44px;gap:26px} #app[data-unit] article.paper{padding-top:48px} }
@media (min-width:1000px){ .wrap{max-width:980px} }


.deney{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px 18px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--edge)}
.deney .eyebrow{color:var(--unit,var(--accent))}
.deney .actions{justify-content:flex-start}
.dsonuc{display:grid;gap:8px;min-height:120px}
.dbar{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-weight:800}
.dcub{height:22px;border:2px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--bg)}
.dcub span{display:block;height:100%;transition:width .4s ease}
.dsay{font-family:var(--hand);font-size:1.25rem;font-weight:400;font-variant-numeric:tabular-nums}
.dgecmis{margin:0;padding-left:1.3em;color:var(--muted);font-size:.95rem;display:grid;gap:2px}
.dgecmis:empty{display:none}
/* ===== Bölüm listesi sayfası ===== */
.home-head .date{margin:6px 0 0;font-weight:700;color:var(--muted)}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ahead h1{font-size:3rem}
.stars{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--edge);border-radius:999px;padding:7px 16px 7px 12px;font-weight:800}
svg.st{width:24px;height:24px;flex:none}
svg.st path{fill:#FFC83D;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
.today{position:relative;background:var(--note);padding:30px 28px 26px;transform:rotate(-.8deg);box-shadow:0 10px 0 -4px var(--note-edge);display:grid;gap:12px;margin:12px 0 6px}
.today::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-70px;width:140px;height:28px;background:var(--tape);opacity:.85;transform:rotate(2deg)}
.today h2{font-size:2.2rem}
.today p{font-size:1.1rem;max-width:36em}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.bcard{text-decoration:none;color:var(--fg);background:var(--paper);border:2px solid var(--edge);border-radius:6px;box-shadow:6px 6px 0 var(--edge);display:flex;flex-direction:column;overflow:hidden}
.bcard:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--edge)}
.bcard .band{height:14px;background:var(--unit,var(--fg));border-bottom:2px solid var(--edge)}
.bcard.tcard .band{background:repeating-linear-gradient(45deg,var(--note) 0 10px,var(--note-edge) 10px 20px)}
.bbody{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:16px 18px 8px;align-items:start}
.bno{width:48px;height:48px;border-radius:50%;border:2px solid var(--edge);background:var(--unit-soft,var(--accent-soft));color:var(--unit,var(--fg));display:grid;place-items:center;font-family:var(--hand);font-size:1.6rem}
.btxt{display:grid;gap:2px}
.bcard h3{font-size:1.2rem;line-height:1.25}
.bcard .sub{font-size:.9rem;color:var(--muted)}
.bdur{display:flex;align-items:center;gap:6px;padding:4px 18px 16px;font-family:var(--hand);font-size:1.15rem;margin-top:auto}
.bcard.done .bdur{color:var(--ok)}
@media (max-width:600px){.bgrid{grid-template-columns:1fr}.ahead h1{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){.bcard:hover{transform:none}}

 --ka:#7a5a2c;--kav:#2f4d7a;--kaf:#7a3a35;--kkam:#3f6a39;--kgam:#57407a;--kok:#776628;--kan:#4a5568;--ktr:#ff7a62;
 --y1:#3f7a37;--y2:#8f8233;--y3:#8f5f2a;--y4:#5e3620}}

 --ka:#7a5a2c;--kav:#2f4d7a;--kaf:#7a3a35;--kkam:#3f6a39;--kgam:#57407a;--kok:#776628;--kan:#4a5568;--ktr:#ff7a62;
 --y1:#3f7a37;--y2:#8f8233;--y3:#8f5f2a;--y4:#5e3620}
.fig.harita{margin:0;display:grid;gap:6px}

.fig .m-lab,.fig .m-seal,.fig .m-il,.fig .m-kita,.fig .m-pusula text{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}

.m-pusula path{fill:var(--fg)} .fig .m-pusula text{font-size:12px;font-weight:800}
.m-dot{fill:var(--c3);stroke:var(--paper);stroke-width:2}
.m-eq{stroke:var(--c3);stroke-width:1.6;stroke-dasharray:6 4} .m-gr{stroke:var(--c1);stroke-width:1.6;stroke-dasharray:6 4}
.k-asya{fill:var(--ka)} .k-avrupa{fill:var(--kav)} .k-afrika{fill:var(--kaf)} .k-kam{fill:var(--kkam)} .k-gam{fill:var(--kgam)} .k-okya{fill:var(--kok)} .k-ant{fill:var(--kan)} .k-tr{fill:var(--ktr)}
.k-asya,.k-avrupa,.k-afrika,.k-kam,.k-gam,.k-okya,.k-ant{stroke:var(--edge);stroke-width:.5;stroke-linejoin:round}

<body>
<div class="wrap" id="app"></div>

<script>
const DERS='sos';
/* ---------- ETKİLEŞİMLİ ANLATIM KUTULARI ---------- */
const adimAdim=(baslik,adimlar)=>`<div class="adimlar"><span class="eyebrow">${baslik}</span><ol>${adimlar.map((a,i)=>`<li${i?' hidden':''}><span>${a}</span></li>`).join('')}</ol><div class="actions"><button class="primary" data-act="adim">Sonraki adım</button></div></div>`;
/* boşluk: cevaplar | ile ayrılır; büyük-küçük harf ve noktalama önemsiz */
const bosluk=(cevap,tur)=>`<input class="bos ${tur||'kelime'}" inputmode="${tur==='sayi'?'numeric':'text'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Boşluk" data-c="${cevap}">`;
const birlikte=(satirlar)=>`<div class="birlikte"><span class="eyebrow">Birlikte yapalım: boşlukları doldur</span>${satirlar.map(s=>`<div class="satir">${s}</div>`).join('')}<div class="actions"><button class="ghost" data-act="kontrol">Kontrol et</button></div><p class="bfb" hidden></p></div>`;
/* seçmeli kutu: her satırda doğru seçeneğe dokun */
const sec=(baslik,satirlar)=>`<div class="secim"><span class="eyebrow">${baslik}</span>${satirlar.map(([t,ops,d])=>`<div class="srow"><span class="stxt">${t}</span><span class="sops">${ops.map((o,j)=>`<button class="sop" data-act="sec" data-ok="${j===d?1:0}">${o}</button>`).join('')}</span></div>`).join('')}<p class="bfb" hidden></p></div>`;
/* ---------- ÇİZİM YARDIMCILARI ---------- */
const tbl=(head,rows)=>`<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>c===''?'<td class="blank"></td>':`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const qs=items=>`<ol class="qs">${items.map(([l,t,p])=>`<li><span class="ql">${l}</span><span>${t} <span class="pts">(${p} puan)</span></span></li>`).join('')}</ol>`;
const yok=(q,a)=>`<details class="yokla"><summary><span class="eyebrow">Kendini yokla</span><span>${q}</span></summary><p>${a}</p></details>`;
const fig=(svg,alt)=>`<figure class="fig harita">${svg}${alt?`<figcaption>${alt}</figcaption>`:''}</figure>`;
const metin=t=>`<div class="metin">${t}</div>`;
const cizgi=n=>`<span class="cizgi" style="width:${n||8}em"></span>`;

/* Dünya küresi: paraleller ve meridyenler */
const KURE=(()=>{const cx=180,cy=150,r=118;let s=`<svg viewBox="0 0 400 300" role="img" aria-label="Paraleller ve meridyenler">`;
 s+=`<circle class="k-kure" cx="${cx}" cy="${cy}" r="${r}"/>`;
 [-60,-30,30,60].forEach(l=>{const y=cy-r*Math.sin(l*Math.PI/180),rx=r*Math.cos(l*Math.PI/180);s+=`<ellipse class="k-par" cx="${cx}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${(rx*.16).toFixed(1)}"/>`;});
 s+=`<ellipse class="k-ekv" cx="${cx}" cy="${cy}" rx="${r}" ry="${(r*.16).toFixed(1)}"/>`;
 [40,80].forEach(rx=>{s+=`<ellipse class="k-mer" cx="${cx}" cy="${cy}" rx="${rx}" ry="${r}"/>`;});
 s+=`<line class="k-bas" x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}"/>`;
 s+=`<circle class="k-kutup" cx="${cx}" cy="${cy-r}" r="4"/><circle class="k-kutup" cx="${cx}" cy="${cy+r}" r="4"/>`;
 s+=`<text class="m-lab" x="${cx}" y="${cy-r-10}" text-anchor="middle">Kuzey Kutbu</text><text class="m-lab" x="${cx}" y="${cy+r+22}" text-anchor="middle">Güney Kutbu</text>`;
 s+=`<text class="m-lab ekv" x="${cx+r+6}" y="${cy+5}">Ekvator 0°</text>`;
 s+=`<text class="m-lab small par" x="${cx+r*Math.cos(Math.PI/6)+6}" y="${cy-r*.5+4}">30° Kuzey</text><text class="m-lab small par" x="${cx+r*Math.cos(Math.PI/6)+6}" y="${cy+r*.5+8}">30° Güney</text>`;
 s+=`<text class="m-lab small par" x="${cx+r*.5+6}" y="${cy-r*Math.sin(Math.PI/3)+2}">60° Kuzey</text>`;
 s+=`<text class="m-lab small bas" x="${cx+5}" y="${cy-r*0.72}" >Başlangıç</text><text class="m-lab small bas" x="${cx+5}" y="${cy-r*0.72+13}">meridyeni 0°</text>`;
 s+=`<text class="m-lab small" x="${cx-r+4}" y="${cy+r*0.33}">← Batı</text><text class="m-lab small" x="${cx+r-4}" y="${cy+r*0.33}" text-anchor="end">Doğu →</text>`;
 return s+`</svg>`;})();

/* Hayalî ada: yükselti basamakları */
const ADA=`<svg viewBox="0 0 400 230" role="img" aria-label="Fiziki haritada yükselti">
<rect class="m-sea" x="0" y="0" width="400" height="230" rx="8"/>
<path class="y1" d="M40,118C38,78,90,46,160,40C230,34,330,38,360,80C384,112,370,160,320,182C260,206,150,204,92,186C58,174,42,150,40,118Z"/>
<path class="y2" d="M130,112C132,82,180,62,236,60C292,58,344,74,348,108C352,142,316,166,262,170C206,174,128,150,130,112Z"/>
<path class="y3" d="M210,106C212,86,246,76,280,76C316,76,336,92,334,112C332,134,304,146,276,146C240,146,208,128,210,106Z"/>
<path class="y4" d="M262,108C262,96,280,90,296,92C312,94,320,104,316,114C312,124,296,128,282,126C268,124,262,118,262,108Z"/>
<circle class="m-dot" cx="70" cy="128" r="4"/><text class="m-lab small" x="62" y="150" text-anchor="middle">Kumköy</text>
<path class="m-tepe" d="M290,100l6,-11l6,11Z"/><text class="m-lab small" x="296" y="84" text-anchor="middle">Kartal Tepe</text>
<text class="m-seal" x="22" y="214">Deniz</text>
<g class="m-pusula" transform="translate(372,30)"><path d="M0,-16L6,2L0,-3L-6,2Z"/><text y="16" text-anchor="middle">K</text></g>
<g class="lejant" transform="translate(12,10)"><rect class="y1" width="14" height="10"/><text class="m-lab small" x="19" y="9">0–200 m</text>
<rect class="y2" y="15" width="14" height="10"/><text class="m-lab small" x="19" y="24">200–500 m</text>
<rect class="y3" y="30" width="14" height="10"/><text class="m-lab small" x="19" y="39">500–1000 m</text>

/* ===== BÖLÜM 1: GRUPLAR VE ROLLERİMİZ ===== */
[
{t:"Grup ne, rol ne?",h:`
<p class="lead">Bir günde kaç farklı "Nisa" oluyorsun? Sabah evde annenin kızısın, okulda öğrencisin, teneffüste arkadaşsın. Sosyal Bilgiler'de bunların her birine <b>rol</b> diyoruz.</p>
<p><b>Grup</b>, ortak bir amaç ya da ilgi etrafında bir araya gelen ve birbiriyle iletişim kuran insanlardır. Ailen, sınıfın, okulun voleybol takımı, kitap kulübü, mahallendeki komşular birer gruptur.</p>
<p><b>Rol</b>, bir grupta üstlendiğin görev ve o göreve uygun davranışlardır. Her rolün bir de <b>sorumluluğu</b> vardır.</p>
${tbl(["Grup","Bu gruptaki rolüm","Sorumluluğum"],[["Aile","Kız, kardeş","Odamı toplamak, evdeki işlere yardım etmek"],["Sınıf","Öğrenci","Derse hazırlıklı gelmek, kurallara uymak"],["Arkadaş grubu","Arkadaş","Sözümü tutmak, arkadaşıma destek olmak"],["Okul takımı","Oyuncu","Antrenmanlara düzenli katılmak"]])}
<div class="rule"><span class="eyebrow">Kolay hatırla</span><b>Grup = Nerede? · Rol = Orada kimim?</b><span>"Sınıf" bir gruptur, "öğrenci" ise o gruptaki rolündür. İkisini karıştırma.</span></div>
<div class="ornek"><span class="eyebrow">Örnek · Metinden rol bulma</span>
<p>Zeynep sabah kahvaltıda küçük kardeşine süt hazırlar. Okulda sınıf başkanıdır. Akşamları babaannesine kitap okur. Cumartesileri izci grubuyla doğa yürüyüşüne çıkar.</p>
<p>Zeynep'in rolleri: <b>abla, sınıf başkanı (öğrenci), torun, izci.</b></p></div>
<div class="hata"><b>Sık yapılan hata:</b> Soru "metne göre" diyorsa sadece metinde geçen rolleri yaz. Metinde yoksa "kuzen" yazmak puan getirmez.</div>
${birlikte([
 `Sınıf bir ${bosluk('grup|gruptur')}, öğrenci ise bu gruptaki bir ${bosluk('rol|roldür')}.`,
 `Futbol takımındaki rolü: ${bosluk('oyuncu|futbolcu|sporcu|kaptan')}`,
 `Annemle babamın çocuğu olarak rolüm: ${bosluk('evlat|kız|oğul|çocuk')}`])}
${yok("Ali, okul korosunda şarkı söyler, hafta sonu dedesinin bahçesine yardım eder. Ali'nin iki rolünü yaz.","<b>Koro üyesi</b> (koro grubunda) ve <b>torun</b> (ailesinde).")}`},
{t:"Doğuştan gelen roller, sonradan kazanılan roller",h:`
<p class="lead">Bazı rolleri sen seçmedin; doğduğun anda sahip oldun. Bazılarını ise sonradan, emek vererek ya da seçerek kazandın.</p>
<div class="cards"><div class="mini"><b>Doğuştan gelen roller</b>Doğduğumuz andan itibaren ailemizin içinde sahip olduğumuz <b>akrabalık rolleridir</b>. Kalıcıdır, kolay kolay değişmez. <br><br>Evlat (kız, oğul), kardeş, torun, kuzen, yeğen</div><div class="mini"><b>Sonradan kazanılan roller</b>Okula başlayınca, bir kulübe katılınca, seçilince ya da bir meslek edinince kazanılır. Zamanla değişebilir. <br><br>Öğrenci, sınıf başkanı, takım oyuncusu, kulüp üyesi, doktor, öğretmen</div></div>
<div class="rule"><span class="eyebrow">Sınav ipucu</span><b>"Doğuştan kazanılan ve kalıcı rol" = akrabalık rolü</b><span>Bu soruda "öğrenci" ya da "arkadaş" yazarsan puan alamazsın. Akrabalığa dayanan bir rol yaz: evlat, kardeş, torun, kuzen…</span></div>
${sec("Hangisi? Her satırda doğru kutuya dokun",[
 ["Kardeş",["Doğuştan","Sonradan"],0],
 ["Sınıf başkanı",["Doğuştan","Sonradan"],1],
 ["Torun",["Doğuştan","Sonradan"],0],
 ["Satranç kulübü üyesi",["Doğuştan","Sonradan"],1],
 ["Öğrenci",["Doğuştan","Sonradan"],1],
 ["Kuzen",["Doğuştan","Sonradan"],0]])}
<div class="hata"><b>Dikkat:</b> "Abla" olmak da akrabalık rolüdür. Ama küçük kardeş sonradan doğarsa abla rolü sonradan gelir. Sınavda güvenli cevap: <b>evlat ve torun</b>. Bunlar gerçekten doğduğun anda başlar.</div>
${yok("Doğuştan kazanılan ve kalıcı olan iki rol yaz.","Örneğin <b>evlat (kız/oğul)</b> ve <b>torun</b>. Kardeş, kuzen, yeğen de olur.")}`},
{t:"Gruplar ve roller zamanla değişir",h:`
<p class="lead">5 yaşındaki Nisa ile bugünkü Nisa aynı gruplarda değil. 10 yıl sonraki Nisa da bambaşka gruplarda olacak. Gruplar ve roller hayat boyu değişir.</p>
<div class="ornek"><span class="eyebrow">Örnek · Can'ın yolculuğu</span>
<p>Can, ilkokulda okulun satranç kulübündeydi. Ortaokulda futbola ilgi duydu ve okul takımına girdi. Bu yıl takım arkadaşları onu kaptan seçti. Can büyüyünce mühendis olmak istiyor.</p></div>
${tbl(["Zaman","Dâhil olduğu grup","Rolü"],[["Geçmişte","Satranç kulübü","Kulüp üyesi"],["Şu an","Okul futbol takımı","Oyuncu, kaptan"],["Gelecekte","Bir şirketin çalışanları","Mühendis"],["Hep devam eden","Okul / sınıf","Öğrenci"]])}
<p>Bazı roller <b>değişir</b> (kulüp üyesi → kaptan), bazıları <b>devam eder</b> (öğrencilik, evlatlık).</p>
<div class="rule"><span class="eyebrow">Neden değişir?</span><b>Büyürüz, ilgimiz değişir, yeni yerlere gideriz</b><span>Yaşımız büyür · ilgi alanlarımız değişir · okul değiştiririz ya da bir üst okula geçeriz · başka bir yere taşınırız · eğitimimizi bitirip meslek ediniriz · ailemize yeni biri katılır.</span></div>
${birlikte([
 `Can'ın geçmişte olup şu an olmadığı grup: ${bosluk('satranç kulübü|satranc kulubu|satranç|satranc kulübü|satranç kulubu')}`,
 `Can'ın hem geçmişte hem şu an devam eden rolü: ${bosluk('öğrenci|ogrenci|öğrencilik')}`,
 `Gelecekte mühendis olursa yeni rolü bir ${bosluk('meslek|iş')} rolü olur.`])}
${yok("Rollerimiz neden değişebilir? İki neden yaz.","Örneğin: <b>Yaşımız büyüdükçe ilgi alanlarımız değişir.</b> <b>Eğitimimizi tamamlayıp bir meslek edinince yeni bir gruba girer, yeni bir rol üstleniriz.</b>")}`},
{t:"Yazılıda cevap nasıl yazılır?",h:`
<p class="lead">Bu konuda sınav soruları hep bir metinle gelir. Önce metni oku, sonra şu adımlarla cevap yaz.</p>
${metin(`Defne ilkokulda okulun halk oyunları ekibindeydi. Ortaokulda resim kulübüne katıldı ve kulübün sergisinde resimleri sergilendi. Bu yıl okulun Yeşilay kulübüne de başkan seçildi. Defne ileride bir müzede sanat tarihçisi olarak çalışmayı hayal ediyor.`)}
${adimAdim("Soru: Defne'nin gruplarının ve rollerinin neden değiştiğini açıklayınız.",[
 "Metindeki <b>geçmiş</b> grubu ve rolü bul: halk oyunları ekibi → <b>oyuncu (dansçı)</b>.",
 "Metindeki <b>şu anki</b> grupları ve rolleri bul: resim kulübü → <b>üye</b>, Yeşilay kulübü → <b>başkan</b>.",
 "<b>Gelecekteki</b> grubu ve rolü bul: müze çalışanları → <b>sanat tarihçisi</b>.",
 "Nedeni yaz ve \"çünkü\" ile bağla: <b>Defne'nin grupları ve rolleri değişti, çünkü büyüdükçe ilgi alanları değişti, yeni bir okula geçti ve arkadaşları onu başkan seçti. İleride eğitimini tamamlayınca bir meslek edinecek.</b>"])}
<div class="rule"><span class="eyebrow">Cevap kalıbı</span><b>Geçmişte … idi → Şu an … → Çünkü …</b><span>Tablo istenirse önce tabloyu çiz, her satıra hem grubu hem rolü yaz. Yalnızca grubu yazarsan yarım puan alırsın.</span></div>
<div class="hata"><b>Sık yapılan hata:</b> "Grup" sütununa rol yazmak. "Başkan" bir gruptur değil, roldür. Grubu "Yeşilay kulübü".</div>
${yok("Defne'nin hangi rolü geçmişten bugüne devam ediyor?","<b>Öğrencilik.</b> İlkokulda da öğrenciydi, şimdi de öğrenci.")}`}

/* ===== BÖLÜM 2: KÜLTÜREL BAĞLAR VE MİLLÎ DEĞERLER ===== */
[
{t:"Kültür ve millî kültürün ögeleri",h:`
<p class="lead">Bayramda büyüklerin elini öpmek, düğünde halay çekmek, "Afiyet olsun!" demek… Bunları kimse sana ders olarak öğretmedi ama hepsini biliyorsun. İşte bu bizim kültürümüz.</p>
<p><b>Kültür</b>, bir toplumun yaşayış biçimidir. Dil, yemekler, giysiler, inançlar, sanat ve gelenekler kültürün parçasıdır. Bir milletin geçmişten bugüne taşıdığı kültüre <b>millî kültür</b> denir.</p>
<div class="cards">
<div class="mini"><b>Dil</b>Türkçe. Birbirimizi anlamamızı ve duygularımızı paylaşmamızı sağlar.</div>
<div class="mini"><b>Tarih</b>Ortak geçmişimiz: kurulan devletler, Malazgirt, İstanbul'un fethi, Çanakkale, Millî Mücadele.</div>
<div class="mini"><b>Din ve inanç</b>Bayramlar, ibadetler, ortak değerler.</div>
<div class="mini"><b>Gelenek ve görenek</b>Bayramlaşma, büyükleri ziyaret, komşuluk, asker uğurlama, misafirperverlik.</div>
<div class="mini"><b>Sanat</b>Ebru, hat, çini, halı dokuma, türküler, halk oyunları.</div>
<div class="mini"><b>Mutfak</b>Ortak sofralar, bayram yemekleri, aşure paylaşmak.</div></div>
<div class="rule"><span class="eyebrow">Metinde hangi öge var? İpucu kelimeler</span><b>Devlet, zafer, savaş, fetih → Tarih</b><span>Ebru, türkü, çini, halk oyunu → Sanat · Bayramlaşma, ziyaret, düğün → Gelenek-görenek · Kelimeler, konuşma, atasözü → Dil</span></div>
${sec("Metinde hangi öge anlatılıyor?",[
 ["Selçuklular Anadolu'ya geldi, Osmanlılar İstanbul'u fethetti.",["Tarih","Sanat","Dil"],0],
 ["Usta, renkli boyaları suyun üzerine damlatıp kâğıda aktardı.",["Dil","Sanat","Tarih"],1],
 ["Bayram sabahı tüm aile dedemin evinde toplandı.",["Gelenek-görenek","Tarih","Dil"],0],
 ["Dedem bana \"Damlaya damlaya göl olur.\" atasözünü öğretti.",["Sanat","Dil","Tarih"],1]])}
${yok("\"Türk milleti Orta Asya'dan Anadolu'ya uzanan yolculukta pek çok devlet kurdu.\" Bu metin millî kültürün hangi ögesini anlatıyor?","<b>Tarih.</b> Devletler, yolculuk ve ortak geçmiş anlatılıyor.")}`},
{t:"Kültürel bağlar birliği güçlendirir",h:`
<p class="lead">Mahallene yeni bir aile taşındı. Komşular kapılarını çalıp "Hoş geldiniz" diye börek götürdü. O aile artık kendini yabancı hisseder mi? Hissetmez. İşte kültürel bağların gücü.</p>
<p><b>Kültürel bağlar</b>, insanları birbirine bağlayan ortak gelenekler, değerler ve etkinliklerdir. Bu bağlar <b>toplumsal birliği</b>, yani insanların bir arada, dayanışma içinde yaşamasını güçlendirir.</p>
${tbl(["Kültürel bağ","Toplumsal birliğe katkısı"],[["Bayramda büyükleri ziyaret etmek","Kuşaklar arasındaki bağı güçlendirir"],["Birlikte yemek hazırlamak, ihtiyaç sahipleriyle paylaşmak","Yardımlaşma ve dayanışmayı artırır"],["Yeni gelenleri kutlamalara davet etmek","Aidiyet duygusunu geliştirir (\"ben de buradanım\")"],["Ebru, halk oyunları gibi sanat etkinlikleri","Farklı insanları bir araya getirir, dostluk kurulur, önyargılar azalır"],["İmece (köyde birlikte iş yapmak)","İş birliği ve dayanışmayı güçlendirir"]])}
<div class="rule"><span class="eyebrow">Sihirli kelimeler</span><b>Dayanışma · yardımlaşma · aidiyet · birlik ve beraberlik</b><span>"Toplumsal birliğe etkisi" sorulduğunda cevabında bu kelimelerden en az birini kullan.</span></div>
${birlikte([
 `İhtiyaç sahipleriyle yiyecek paylaşmak ${bosluk('yardımlaşma|dayanışma|yardimlasma|dayanisma|yardımlaşmayı|dayanışmayı')} artırır.`,
 `Yeni taşınan aileyi bayrama davet etmek ${bosluk('aidiyet')} duygusunu geliştirir.`,
 `Gençlerin büyükleri ziyaret etmesi ${bosluk('kuşaklar|kusaklar|nesiller|kuşak')} arasındaki bağı güçlendirir.`])}
${yok("Ebru sanatı farklı kültürlerden insanları bir araya getirir. Bunun toplumsal birliğe bir etkisini yaz.","Örneğin: <b>İnsanlar arasında dostluk ve arkadaşlık bağları kurulur.</b> Ya da: <b>Farklı kültürlerden insanlar birbirini tanır, önyargılar azalır.</b>")}`},
{t:"Millî değerler ve ortak kutlamalar",h:`
<p class="lead">29 Ekim'de okul bahçesinde yüzlerce kişi aynı anda İstiklâl Marşı'nı söylediğinde içinde bir şey kıpırdar. O duygu, millî değerlerin bizi birbirimize bağladığını gösterir.</p>
<p><b>Millî değerler</b>, bir milletin ortak olarak sahip çıktığı, saygı duyduğu değerlerdir: <b>Türk bayrağı, İstiklâl Marşı, Türkçe, vatan, şehitlerimiz, Atatürk ve Cumhuriyet</b>.</p>
${tbl(["Millî bayram ve gün","Ne zaman?"],[["Ulusal Egemenlik ve Çocuk Bayramı","23 Nisan"],["Atatürk'ü Anma, Gençlik ve Spor Bayramı","19 Mayıs"],["Zafer Bayramı","30 Ağustos"],["Cumhuriyet Bayramı","29 Ekim"],["Çanakkale Zaferi ve Şehitleri Anma Günü","18 Mart"]])}
<div class="cards"><div class="mini"><b>İstiklâl Marşı'nı birlikte söylemek</b>Millî değerlere bağlılığı ve aidiyet duygusunu güçlendirir.</div><div class="mini"><b>Tarihî olayları anlatan sunumlar</b>Ortak geçmişi hatırlatır, tarih bilincini geliştirir.</div><div class="mini"><b>Öğrenci, öğretmen, aile hep birlikte kutlamak</b>İnsanlar arasındaki bağları güçlendirir, birlik ve beraberlik duygusu artar.</div></div>
<div class="rule"><span class="eyebrow">Unutma</span><b>Ortak kutlama = ortak geçmişi hatırlamak + birlikte olmak</b><span>Aynı şeyi aynı anda kutlayan insanlar kendilerini aynı büyük ailenin parçası gibi hisseder.</span></div>
${birlikte([
 `Cumhuriyet Bayramı her yıl ${bosluk('29 ekim|29ekim','genis')} tarihinde kutlanır.`,
 `Ortak geçmişimizi hatırlamak ${bosluk('tarih')} bilincini geliştirir.`])}
${yok("Okulda düzenlenen 23 Nisan töreni toplumsal birliğe nasıl katkı sağlar?","Örneğin: <b>Öğrenciler, öğretmenler ve aileler bir araya gelir; aralarındaki bağlar güçlenir.</b> <b>Ulusal egemenliğin önemini hatırlamak millî değerlere bağlılığı artırır.</b>")}`},
{t:"Slogan ve \"metinle ilişkilendir\" soruları",h:`
<p class="lead">Bu konuda iki tür soru çok çıkar: "bir slogan yazınız" ve "metindeki örneklerle ilişkilendirerek açıklayınız". İkisinin de bir yolu var.</p>
<div class="rule"><span class="eyebrow">Slogan nasıl yazılır?</span><b>Kısa · akılda kalıcı · konuyla ilgili</b><span>Bir cümle yeter. Kafiye (ses benzerliği) olursa daha akılda kalır. Konunun anahtar kelimesini kullan: birlik, paylaşmak, gelenek, bayram.</span></div>
<div class="ornek"><span class="eyebrow">Örnek sloganlar</span>
<p>"Sofran paylaşınca büyür, bağın bayramla güçlenir."</p>
<p>"Geleneğini yaşat, birliğini koru!"</p>
<p>"Komşu komşuya, gönül gönüle."</p></div>
${metin(`Kasabada her yıl hasat zamanı "Ceviz Şenliği" yapılır. Kasabalılar birlikte ceviz toplar, kadınlar ortak bir sofra kurar. Yaşlılar gençlere eski türküleri öğretir. Şenliğe komşu köylerden de misafirler gelir ve herkes aynı sofrada yemek yer.`)}
${adimAdim("Soru: Metindeki kültürel bağların toplumsal birliğe katkısını örneklerle açıklayınız.",[
 "Metinde geçen <b>kültürel bağları</b> bul: birlikte ceviz toplamak, ortak sofra, yaşlıların türkü öğretmesi, misafirleri ağırlamak.",
 "Birini seç ve katkısını yaz: <b>Birlikte ceviz toplamak yardımlaşma ve dayanışmayı artırır.</b>",
 "Bir tane daha: <b>Yaşlıların gençlere türkü öğretmesi kuşaklar arasındaki bağı güçlendirir.</b>",
 "Bir tane daha: <b>Komşu köylerden gelen misafirlerle aynı sofrada yemek yemek dostluğu ve aidiyet duygusunu geliştirir.</b>"])}
<div class="hata"><b>Sık yapılan hata:</b> Sadece "birlik sağlar" yazıp bırakmak. Soru "metindeki örneklerle" diyorsa <b>metinden bir olayı yaz + katkısını yaz</b>. İkisi bir arada olmalı.</div>
${yok("Yardımlaşma ile ilgili kendi sloganını yaz.","Örneğin: <b>\"Bir elin nesi var, iki elin sesi var!\"</b> Bu bir atasözüdür ama slogan olarak da kullanılabilir. Kendi cümlen de olur: \"Uzat elini, büyüsün birliğimiz.\"")}`}
],
/* ===== BÖLÜM 3: TOPLUMSAL SORUNLARA ÇÖZÜM ===== */
[
{t:"Toplumsal sorun nedir?",h:`
<p class="lead">Okulun önündeki kaldırım kırık ve her gün birileri takılıp düşüyor. Bu sadece düşen kişinin sorunu mu? Değil. Herkesi etkileyen sorunlara <b>toplumsal sorun</b> denir.</p>
<p>Toplumsal sorunlar, birlikte yaşadığımız yerlerde (mahalle, okul, park, şehir) <b>birçok kişiyi etkileyen</b> sorunlardır.</p>
<div class="cards"><div class="mini"><b>Çevre</b>Parkta çöp birikmesi, kirlilik</div><div class="mini"><b>Okul</b>Kantin sırası, gürültülü kütüphane, kalabalık bahçe</div><div class="mini"><b>Ulaşım</b>Trafik, otobüslerin gecikmesi</div><div class="mini"><b>İsraf</b>Su, elektrik, ekmek israfı</div></div>
<p>Bir sorunu çözmek için önce <b>nedenini</b> bulmak gerekir. Bir sorunun nedeni genelde iki türlüdür:</p>
<div class="cards"><div class="mini"><b>İmkân eksikliği</b>Bir şey yetersiz ya da yok. "Çöp kutusu az." "Kütüphanede ayrı oda yok."</div><div class="mini"><b>Davranış</b>İnsanlar dikkat etmiyor. "Kutu olsa bile bazı kişiler çöpünü yere atıyor."</div></div>
<div class="rule"><span class="eyebrow">Sınav ipucu</span><b>İki kişinin görüşünü karşılaştır = biri imkâna, biri davranışa bakıyor</b><span>"Deniz kutu azlığına (imkân eksikliğine), Arda ise insanların dikkatsizliğine (davranışa) odaklanıyor" gibi yaz.</span></div>
${sec("Bu görüş sorunun hangi nedenine bakıyor?",[
 ["\"Otobüs az olduğu için duraklar kalabalık.\"",["İmkân","Davranış"],0],
 ["\"İnsanlar sırasını beklemeden itişiyor.\"",["İmkân","Davranış"],1],
 ["\"Sınıfta çöp kutusu yok.\"",["İmkân","Davranış"],0],
 ["\"Bazı öğrenciler musluğu açık bırakıyor.\"",["İmkân","Davranış"],1]])}
${yok("Okul bahçesinde top oynayanlar ve oturmak isteyenler sürekli çatışıyor. Bu neden bir toplumsal sorundur?","Çünkü sorun <b>tek bir kişiyi değil, okuldaki birçok öğrenciyi</b> etkiliyor ve ortak kullandığımız bir alanda ortaya çıkıyor.")}`},
{t:"Birlikte çözmek: dayanışma",h:`
<p class="lead">Antarktika'da hava −50 dereceye düşer. İmparator penguenleri tek başına donar. Ama yüzlercesi sıkı sıkıya sokulup bir "penguen yumağı" oluşturur. Dışarıdakiler üşüyünce içeriye geçer, içeridekiler dışarı çıkar. Sırayla ısınırlar.</p>
<p>Penguenler tek başına çözemedikleri bir sorunu <b>birlikte hareket ederek</b> çözer. İnsanlar da öyle. Toplumsal sorunlar, <b>dayanışma ve iş birliği</b> ile daha kolay çözülür.</p>
<div class="cards"><div class="mini"><b>Karıncalar</b>Tek karıncanın taşıyamayacağı yemi hep birlikte yuvaya taşır.</div><div class="mini"><b>Arılar</b>Her arının bir görevi vardır. Kovan iş bölümüyle yaşar.</div><div class="mini"><b>Kuşlar</b>Göç ederken V şeklinde uçar, öndeki yorulunca yer değiştirir.</div></div>
<div class="rule"><span class="eyebrow">Hayvandan insana</span><b>Doğadaki örnek → insanlara ders</b><span>Bu soruların ikinci şıkkı hep aynıdır: "İnsanlar da toplumsal sorunları <b>dayanışma içinde, birlikte hareket ederek</b> çözmelidir."</span></div>
${birlikte([
 `Penguenler soğuğa karşı ${bosluk('birlikte|beraber|toplu|bir arada')} hareket ederek korunur.`,
 `İnsanlar da toplumsal sorunları ${bosluk('dayanışma|iş birliği|is birligi|işbirliği|dayanisma|yardımlaşma')} içinde çözebilir.`])}
${yok("\"Bir elin nesi var, iki elin sesi var.\" atasözünü toplumsal sorunlarla ilişkilendir.","Tek kişinin çözemediği sorunlar, <b>insanlar el ele verince</b> çözülebilir. Yani dayanışma sorunları çözmeyi kolaylaştırır.")}`},
{t:"Müzakere: herkesi dinleyen çözüm",h:`
<p class="lead">Kütüphanede bazıları sessizce okumak, bazıları grup çalışması yapmak istiyor. Kim haklı? Aslında ikisi de. Ama ikisi aynı anda, aynı yerde olunca sorun çıkıyor.</p>
<p><b>Müzakere</b>, farklı görüşteki insanların birbirini dinleyip <b>herkesin kabul edebileceği</b> bir çözüm aramasıdır. Amaç kimin kazanacağını bulmak değil, <b>herkesin kazanmasıdır</b>.</p>
<ol class="how"><li>Sorunu belirle</li><li>Herkesi dinle (sadece iki kişiyi değil, sorundan etkilenen herkesi)</li><li>Görüşleri karşılaştır: nerede ayrılıyorlar?</li><li>İki görüşü de karşılayan bir çözüm öner</li><li>Nasıl uygulanacağını yaz</li><li>Neden işe yarayacağını açıkla</li></ol>
<div class="ornek"><span class="eyebrow">Örnek · Okul bahçesi</span>
<p>Ömer: "Teneffüste top oynamak istiyoruz." Elif: "Top oynayanlar yüzünden bahçede oturamıyoruz."</p>
<p><b>Çözüm:</b> Bahçe ikiye ayrılır: bir yanı oyun alanı, diğer yanı oturma alanı olur. Sınırı çizgiyle belirlemek için okul yönetiminden yardım istenir.</p>
<p><b>Neden etkili?</b> Ömer'in oyun ihtiyacı da, Elif'in dinlenme ihtiyacı da karşılanır. Kimse vazgeçmek zorunda kalmaz.</p></div>
<div class="rule"><span class="eyebrow">İyi bir çözüm önerisi</span><b>Uygulanabilir · iki tarafı da düşünür · kimin ne yapacağı belli</b><span>"Herkes dikkat etsin" bir plan değildir. "Kim, neyi, nasıl yapacak?" sorusunun cevabını yaz.</span></div>
<div class="hata"><b>Sık yapılan hata:</b> Bir tarafı seçip "Ece haklı, kütüphane sessiz olmalı" yazmak. Soru "iki görüşü de dikkate alarak" diyorsa ikisini birden karşılayan bir çözüm yazmalısın.</div>
${yok("Kütüphane sorunu için iki görüşü de karşılayan bir çözüm öner.","Örneğin: <b>Kütüphanede sessiz okuma ve grup çalışması için ayrı saatler (ya da ayrı bölümler) belirlenir ve öğrencilere duyurulur.</b> Böylece okuyanların dikkati dağılmaz, grup çalışması yapanlar da yer bulur.")}`},
{t:"Çözüm ve gerekçe yazma",h:`
<p class="lead">Sınavda bu konudan gelen soruların çoğu "çözüm öner, nasıl uygulanacağını ve neden etkili olacağını yaz" şeklindedir. Adım adım bir örnek çözelim.</p>
${metin(`Okulun kantininde teneffüslerde çok uzun kuyruk oluşuyor ve bazı öğrenciler sıra bekleyip bir şey alamadan derse giriyor. Melis, "Kantinde tek görevli olduğu için kuyruk uzuyor." diyor. Kaan ise "Öğrenciler sırayı bozup öne geçiyor, o yüzden kuyruk ilerlemiyor." diyor.`)}
${adimAdim("Soru: Sorunu belirtiniz, görüşleri karşılaştırınız ve iki görüşü de dikkate alan bir çözüm öneriniz.",[
 "<b>Sorun:</b> Teneffüste kantinde uzun kuyruk oluşması ve bazı öğrencilerin alışveriş yapamaması.",
 "<b>Karşılaştırma:</b> Melis sorunun nedenini <b>imkân eksikliğine</b> (tek görevli), Kaan ise <b>öğrencilerin davranışına</b> (sırayı bozmak) bağlıyor.",
 "<b>Çözüm (imkân için):</b> Okul yönetiminden yoğun teneffüslerde kantine ikinci bir görevli ya da ikinci bir kasa istenir.",
 "<b>Çözüm (davranış için):</b> Öğrenci meclisi sıra kuralları için afiş hazırlar, nöbetçi öğrenciler sırayı takip eder.",
 "<b>Neden etkili?</b> İkinci görevli kuyruğu hızlandırır, sıra kuralı da öne geçmeyi engeller. Böylece iki nedeni birden ortadan kaldırırız."])}
<div class="rule"><span class="eyebrow">Gerekçe kalıbı</span><b>"Bu öneri kabul edilmeli, çünkü …"</b><span>Gerekçede çözümün <b>herkese ne kazandıracağını</b> yaz: "Hem okumak isteyenlerin hem grup çalışması yapmak isteyenlerin ihtiyacı karşılanır."</span></div>
${yok("Mahalle parkında akşamları gürültü olduğundan şikâyet ediliyor. Gençler ise buluşacak başka yer olmadığını söylüyor. İki tarafı da düşünen bir öneri yaz.","Örneğin: <b>Parkın evlerden uzak bir köşesi gençlerin buluşma alanı yapılır ve belli bir saatten sonra sessiz olunması kararlaştırılır.</b> Böylece gençler buluşacak yer bulur, komşular da rahat uyur.")}`}
],
/* ===== BÖLÜM 4: PARALEL, MERİDYEN VE MUTLAK KONUM ===== */
[
{t:"Konum nedir?",h:`
<p class="lead">Arkadaşına evinin yerini nasıl tarif edersin? "Fırının karşısındaki sarı bina" diyebilirsin. Ya da "Çınar Sokak, No: 12" diyebilirsin. İkisi de konum bildirir ama çok farklıdır.</p>
<p><b>Konum</b>, bir yerin Dünya üzerinde bulunduğu yerdir. İki türlü söylenebilir:</p>
<div class="cards"><div class="mini"><b>Mutlak konum</b>Bir yerin <b>paralel ve meridyenlerle</b> (yani Ekvator'a ve başlangıç meridyenine göre) belirlenen yeridir. Kesin, tek bir cevabı vardır. <br><br>"Türkiye 36°–42° kuzey paralelleri ile 26°–45° doğu meridyenleri arasındadır."</div><div class="mini"><b>Göreceli (özel) konum</b>Bir yerin <b>çevresindeki yerlere göre</b> konumudur. <br><br>"Türkiye; Asya, Avrupa ve Afrika'nın birbirine en çok yaklaştığı yerdedir."</div></div>
<div class="rule"><span class="eyebrow">Kareli defter gibi</span><b>Mutlak konum = sıra numarası + sütun numarası</b><span>Defterindeki bir kareyi "5. satır, 8. sütun" diye bulursun. Dünya'daki bir yeri de "kaçıncı paralel, kaçıncı meridyen" diye buluruz. Paraleller satırlar, meridyenler sütunlar gibidir.</span></div>
${sec("Mutlak mı, göreceli mi?",[
 ["\"Ankara, 40° kuzey paraleli ile 33° doğu meridyeni yakınındadır.\"",["Mutlak","Göreceli"],0],
 ["\"Türkiye'nin üç tarafı denizlerle çevrilidir.\"",["Mutlak","Göreceli"],1],
 ["\"İstanbul, Asya ile Avrupa arasındadır.\"",["Mutlak","Göreceli"],1],
 ["\"Türkiye Kuzey Yarım Küre'dedir.\"",["Mutlak","Göreceli"],0]])}
${yok("Mutlak konum neye göre belirlenir?","<b>Paralel ve meridyenlere göre</b>, yani Ekvator'a ve başlangıç meridyenine göre.")}`},
{t:"Paraleller ve meridyenler",h:`
<p class="lead">Dünya'nın üzerinde gerçekten çizgiler yok. Ama yerleri kolay bulmak için insanlar Dünya'nın üzerine hayalî çizgiler çizdi: paraleller ve meridyenler.</p>
${fig(KURE)}
<div class="cards"><div class="mini"><b>Paraleller</b>Ekvator'a paralel, <b>yatay</b> çemberler. <br>Başlangıç: <b>Ekvator (0°)</b>. <br>Ekvator'un kuzeyi <b>Kuzey Yarım Küre</b>, güneyi <b>Güney Yarım Küre</b>. <br>Kuzeye ve güneye 90'ar tane. <br>"… kuzey" ya da "… güney" diye okunur.</div><div class="mini"><b>Meridyenler</b>Kutuptan kutba uzanan, <b>dikey</b> yarım çemberler. <br>Başlangıç: <b>Başlangıç meridyeni (0°)</b>, İngiltere'de Londra yakınındaki Greenwich'ten geçer. <br>Doğusu <b>Doğu Yarım Küre</b>, batısı <b>Batı Yarım Küre</b>. <br>Doğuya ve batıya 180'er tane. <br>"… doğu" ya da "… batı" diye okunur.</div></div>
<div class="rule"><span class="eyebrow">İki önemli sayı</span><b>İki paralel arası ≈ 111 km · İki meridyen arası = 4 dakika</b><span>Ardışık iki paralel arasındaki mesafe hep yaklaşık 111 km'dir. Ardışık iki meridyen arasında 4 dakikalık yerel saat farkı vardır. Doğudaki yerde Güneş daha önce doğar.</span></div>
<div class="hata"><b>Sık yapılan hata:</b> "26° doğu paraleli" demek. Doğu-batı ile biten derece <b>meridyendir</b>. Kuzey-güney ile biten derece <b>paraleldir</b>.</div>
${birlikte([
 `Dünya'yı Kuzey ve Güney Yarım Küre'ye ayıran çizgi: ${bosluk('ekvator')}`,
 `"42° Kuzey" bir ${bosluk('paralel|paraleldir')}, "45° Doğu" bir ${bosluk('meridyen|meridyendir')}`,
 `5 paralel arası yaklaşık ${bosluk('555','sayi')} km`])}
${yok("Doğudan batıya 10 meridyen gidersen yerel saat ne kadar değişir?","10 × 4 = <b>40 dakika.</b> Batıya gittikçe yerel saat geri kalır.")}`},
{t:"Türkiye'nin mutlak konumu",h:`
<p class="lead">Türkiye haritada nerede duruyor? Kesin cevap: <b>36°–42° kuzey paralelleri</b> ile <b>26°–45° doğu meridyenleri</b> arasında.</p>
${fig(MAP_TR,"Türkiye'yi çevreleyen paraleller (yatay) ve meridyenler (dikey)")}
<p>Bu tek cümleden Türkiye hakkında çok şey çıkarabiliriz:</p>
${tbl(["Mutlak konum özelliği","Sonucu"],[
 ["Ekvator'un kuzeyinde (kuzey paralelleri)","<b>Kuzey Yarım Küre</b>'dedir"],
 ["Başlangıç meridyeninin doğusunda (doğu meridyenleri)","<b>Doğu Yarım Küre</b>'dedir"],
 ["Orta kuşakta yer alır","<b>Dört mevsim</b> belirgin yaşanır"],
 ["Doğu ile batısı arasında 45 − 26 = 19 meridyen var","19 × 4 = <b>76 dakika</b> yerel saat farkı vardır. Güneş, Iğdır'da Çanakkale'den 76 dakika önce doğar."],
 ["Kuzey ile güneyi arasında 42 − 36 = 6 paralel var","6 × 111 = kuş uçuşu yaklaşık <b>666 km</b>"],

{t:"Türkiye'nin göreceli (özel) konumu",h:`
<p class="lead">Kenya'da yaşayan Amani, Almanya'daki teyzesine gidiyor. Uçağı İstanbul'da mola veriyor. Neden Paris ya da Kahire değil de İstanbul? Cevap Türkiye'nin konumunda.</p>
<p><b>Göreceli (özel) konum</b>, Türkiye'nin çevresindeki kıtalara, denizlere ve ülkelere göre yeridir. Türkiye'nin özel konumunun en önemli özellikleri:</p>
<div class="cards">
<div class="mini"><b>Üç kıtanın kavşağı</b>Asya, Avrupa ve Afrika'nın birbirine en çok yaklaştığı yerdedir. Kıtalar arasında <b>köprü</b> gibidir.</div>
<div class="mini"><b>Üç tarafı denizlerle çevrili</b>Kuzeyde Karadeniz, batıda Ege, güneyde Akdeniz. Türkiye bir <b>yarımadadır</b>.</div>
<div class="mini"><b>Boğazlar</b>İstanbul ve Çanakkale boğazları Karadeniz'i Marmara üzerinden Ege'ye ve Akdeniz'e bağlar.</div>
<div class="mini"><b>Ulaşım ve ticaret yolu</b>Kara, deniz, hava ve boru hattı yolları Türkiye'den geçer.</div></div>
<div class="ornek"><span class="eyebrow">Örnek · Neden aktarma İstanbul'da?</span>
<p>Türkiye, Afrika ile Avrupa'nın (ve Asya'nın) arasındadır. İstanbul'dan kısa uçuşlarla üç kıtadaki pek çok şehre gidilebilir. Bu yüzden İstanbul, kıtalar arası yolculuklarda uygun bir <b>aktarma noktasıdır</b>.</p></div>
<div class="ornek"><span class="eyebrow">Örnek · Boğazlardan neden çok gemi geçer?</span>
<p>Karadeniz'e kıyısı olan ülkelerin (Rusya, Ukrayna, Romanya, Bulgaristan, Gürcistan) gemileri dünya denizlerine açılmak için <b>İstanbul ve Çanakkale boğazlarından geçmek zorundadır</b>. Başka çıkış yolu yoktur.</p></div>
${birlikte([
 `Türkiye; Asya, Avrupa ve ${bosluk('afrika')} kıtalarının birbirine en çok yaklaştığı yerdedir.`,

{t:"Haritada yön bulma",h:`
<p class="lead">Haritalarda kuzey hep yukarıdadır. Bunu bilirsen hangi yerin nerede olduğunu kolayca söylersin.</p>
<div class="cards"><div class="mini"><b>Ana yönler</b>Kuzey (yukarı) · Güney (aşağı) · Doğu (sağ) · Batı (sol)</div><div class="mini"><b>Ara yönler</b>Kuzeydoğu · Kuzeybatı · Güneydoğu · Güneybatı <br>İki ana yönün arası.</div></div>

${yok("Kocaeli, Sakarya'nın hangi yönündedir?","<b>Batısında.</b> Sakarya'nın üzerinde durup Kocaeli'ye bakarsan sola, yani batıya bakarsın.")}`},
{t:"Yükseltiyi haritadan okuma",h:`
<p class="lead">Fiziki haritalarda renkler bize yerin ne kadar yüksek olduğunu söyler. Yeşil alçak, kahverengi yüksek. Haritanın köşesindeki <b>lejant</b> (açıklama kutusu) hangi rengin kaç metre olduğunu gösterir.</p>

/* kontrol grupları ve maddeler */
function blocks(key){
  const n=+key.slice(1);
  if(key[0]==='b') return [{si:0,k:n,groups:B[n-1].yazili.kontrol}];
  return T[n-1].sorular.map((s,i)=>({si:i,k:s.k,groups:s.c}));
}
function items(key){
  const out=[];
  blocks(key).forEach(bl=>bl.groups.forEach((g,gi)=>g.i.forEach((it,ii)=>out.push({id:`${key}.${bl.si}.${gi}.${ii}`,t:it[0],p:it[1],fix:it[2],k:bl.k}))));
  return out;
}
const checkedSet=key=>S.checks[key]||(S.checks[key]=new Set());
function scoreOf(key){const c=checkedSet(key);return items(key).filter(i=>c.has(i.id)).reduce((s,i)=>s+i.p,0)}
const maxOf=key=>items(key).reduce((s,i)=>s+i.p,0);

function vTest(n){
  const b=B[n-1],st=S.test[n]||(S.test[n]={i:0,ans:[]}),Q=b.test;

    const q=Q[st.i],a=st.ans[st.i],answered=a!=null;

    q.o.forEach((o,j)=>{let cls='';if(answered){if(j===q.a)cls='right';else if(j===a)cls='wrong';}
      h+=`<button class="opt ${cls}" data-act="ans" data-j="${j}" ${answered?'disabled':''}>${String.fromCharCode(65+j)}) ${o}</button>`;});
    h+=`</div>`;
    if(answered){h+=a===q.a?`<div class="fb good"><b>Doğru!</b> ${q.n}</div>`:`<div class="fb bad"><b>Doğru cevap: ${q.o[q.a]}.</b> ${q.n}</div>`;

    return h+`</section>`;

  const sc=Q.filter((q,i)=>st.ans[i]===q.a).length, wrong=Q.filter((q,i)=>st.ans[i]!==q.a);

  ${i===0?`<div class="note">Gerçek sınav gibi çöz: cevapları kağıda, soru numarasıyla yaz. Bitince telefonu babana ver.</div>`:''}
  <h2>${i+1}. Soru</h2>${q.h}
  <div class="actions">${i>0?`<button class="ghost" data-act="tprev" data-n="${n}">← Önceki</button>`:''}
  ${i<L-1?`<button class="primary" data-act="tnext" data-n="${n}">Sonraki soru →</button>`:`<a class="btn primary" href="#t${n}-kontrol">Bitirdim, babama veriyorum →</a>`}</div></section>`;
  return h;
}
function vSonucT(n){
  const key='t'+n, c=checkedSet(key), all=items(key), s=scoreOf(key), mx=maxOf(key), p100=Math.round(s/mx*100);
  P.t[n]=p100; save();
  const per=KONU_AD.map((_,i)=>i+1).map(k=>{const its=all.filter(i=>i.k===k);return [its.filter(i=>c.has(i.id)).reduce((a,i)=>a+i.p,0),its.reduce((a,i)=>a+i.p,0)]});
  const miss=all.filter(i=>!c.has(i.id)).map(i=>i.fix);
  const uniq=[...new Set(miss)];
  const msg=`Nisa · Sosyal ${T[n-1].ad}\nPuan: ${p100}/100\n`+per.map((v,i)=>`${KONU_AD[i]}: ${v[0]}/${v[1]}`).join('\n')+(uniq.length?`\nTekrar edilecekler:\n- ${uniq.join('\n- ')}`:'\nEksik yok.');
  let h=topBar(null)+`<section class="paper result"><span class="eyebrow">${T[n-1].ad} · Sonuç</span><div class="big-score">${p100}<span class="muted" style="font-size:1.2rem">/100</span></div>
  <div class="scores">${per.map((v,i)=>`<div>${KONU_AD[i]}<b>${v[0]}/${v[1]}</b></div>`).join('')}</div>`;
  h+=uniq.length?`<span class="eyebrow">Tekrar edilecekler</span><ul class="todo">${uniq.map(m=>`<li>${m}</li>`).join('')}</ul>`:`<div class="allgood">Eksik yok, sınava hazırsın!</div>`;
  h+=sendBox(msg)+`<div class="actions center"><a class="btn ghost" href="#t${n}-kontrol">Kontrole dön</a><a class="btn primary" href="#ana">Ana sayfa</a></div></section>`;
  return h;
}
function vTekrar(){
  const R=TEKRAR;
  return topBar(null)+`<article class="paper"><span class="eyebrow">Sınav sabahı</span><h1>Son Tekrar</h1>${R.map(([t,l])=>`<section><h2>${t}</h2><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('')}
  <div class="rule"><b>Unutma:</b><span>Her cevabı tam cümleyle yaz. Soru "açıklayınız" diyorsa "çünkü…" ile gerekçe ver. Metin varsa cevabını metindeki örneklerle destekle. Koordinat yazarken yönü (Kuzey, Doğu) unutma.</span></div></article>`;
}

/* ---------- YÖNLENDİRME ---------- */
function render(){
  const h=(location.hash||'#ana').slice(1); let html; let m;
  try{const bm=h.match(/^b(\d)-/),tm=h.match(/^t(\d)-/);if(bm)localStorage.setItem('nisaSon',JSON.stringify({d:DERS,b:+bm[1],t:Date.now()}));else if(tm)localStorage.setItem('nisaSon',JSON.stringify({d:DERS,tt:+tm[1],t:Date.now()}));}catch(e){}
  const um=h.match(/^b([1-6])-/);
  if(um){app.style.setProperty('--unit',`var(--c${um[1]})`);app.style.setProperty('--unit-soft',`var(--c${um[1]}-soft)`);app.dataset.unit=um[1];}
  else{app.style.removeProperty('--unit');app.style.removeProperty('--unit-soft');delete app.dataset.unit;}
  if((m=h.match(/^b([1-6])-(konu|test|yazili|kontrol|sonuc)$/))){const n=+m[1];
    html={konu:()=>vKonu(n),test:()=>vTest(n),yazili:()=>vYazili(n),kontrol:()=>vKontrol('b'+n),sonuc:()=>vSonucB(n)}[m[2]]();}
  else if((m=h.match(/^t([1-9])-(soru|kontrol|sonuc)$/))){const n=+m[1];
    html={soru:()=>vTSoru(n),kontrol:()=>vKontrol('t'+n),sonuc:()=>vSonucT(n)}[m[2]]();}
  else if(h==='tekrar') html=vTekrar();
  else html=vAna();
  app.innerHTML=html;
}
function goTop(){window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();goTop();});
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='startTest'){const n=+el.dataset.n;S.test[n]={i:0,ans:[]};if(location.hash==='#b'+n+'-test'){render();goTop();}else location.hash='b'+n+'-test';}
  else if(act==='ans'){const n=+location.hash.match(/b(\d)/)[1],st=S.test[n];st.ans[st.i]=+el.dataset.j;render();}
  else if(act==='next'){const n=+location.hash.match(/b(\d)/)[1],st=S.test[n];st.i++;
    if(st.i>=B[n-1].test.length){const sc=B[n-1].test.filter((q,i)=>st.ans[i]===q.a).length;P.b[n]=Object.assign({},P.b[n],{test:sc});save();}
    render();goTop();}
  else if(act==='pg'||act==='pnext'||act==='pprev'){const n=+location.hash.match(/b(\d)/)[1];const cur=S.page[n]||0;
    S.page[n]=act==='pg'?+el.dataset.p:cur+(act==='pnext'?1:-1);render();goTop();}
  else if(act==='theme'){THEME={oto:'acik',acik:'koyu',koyu:'oto'}[THEME];try{localStorage.setItem('nisaTema',THEME)}catch(e){}applyTheme();document.querySelectorAll('.themebtn').forEach(b=>b.textContent='Tema: '+THEME_AD[THEME]);}
  else if(act==='reset1'){document.getElementById('resetZone').innerHTML=`<span>Bütün puanlar silinsin mi?</span><button class="ghost" data-act="reset0">Vazgeç</button><button class="primary" data-act="reset2">Evet, sıfırla</button>`;}
  else if(act==='reset0'){render();}
  else if(act==='reset2'){P={b:{},t:{}};save();S.test={};S.checks={};S.tIdx={};S.page={};render();goTop();}
  else if(act==='tnext'||act==='tprev'){const n=+el.dataset.n;S.tIdx[n]=(S.tIdx[n]||0)+(act==='tnext'?1:-1);render();goTop();}
  else if(act==='adim'){const box=el.closest('.adimlar'),nx=box.querySelector('li[hidden]');if(nx){nx.hidden=false;nx.classList.add('yeni');}if(!box.querySelector('li[hidden]')){el.textContent='Çözüm tamam';el.disabled=true;el.className='ghost';}}
  else if(act==='deney'){const box=el.closest('.deney'),n=+el.dataset.n,c={'Mavi':0,'Sarı':0,'Kırmızı':0},renk={'Mavi':'#3c86d6','Sarı':'#e9a619','Kırmızı':'#d0452f'};for(let i=0;i<n;i++){const r=Math.floor(Math.random()*4);c[r<2?'Mavi':r===2?'Sarı':'Kırmızı']++;}box.querySelector('.dsonuc').innerHTML='<p><b>'+n+' kez çevrildi:</b></p>'+Object.keys(c).map(k=>'<div class="dbar"><span class="dad">'+k+'</span><span class="dcub"><span style="width:'+(c[k]/n*100)+'%;background:'+renk[k]+'"></span></span><span class="dsay">'+c[k]+'/'+n+'</span></div>').join('');box.querySelector('.dgecmis').insertAdjacentHTML('afterbegin','<li>'+n+' çevirme → mavi '+c['Mavi']+'/'+n+'</li>');}
  else if(act==='sec'){const row=el.closest('.srow');if(row.dataset.done)return;const ok=el.dataset.ok==='1';el.classList.add(ok?'dogru':'yanlis');if(ok){row.dataset.done=1;row.querySelectorAll('.sop').forEach(b=>{if(b!==el)b.disabled=true;});}const box=el.closest('.secim'),rows=[...box.querySelectorAll('.srow')],d=rows.filter(r=>r.dataset.done).length,fb=box.querySelector('.bfb');fb.hidden=false;fb.className='bfb '+(d===rows.length?'iyi':'');fb.textContent=d===rows.length?'Harika, hepsini buldun!':ok?'Doğru! '+(rows.length-d)+' tane kaldı.':'Olmadı, bir daha dene.';}
  else if(act==='kontrol'){const box=el.closest('.birlikte'),ins=[...box.querySelectorAll('input.bos')];const nz=v=>String(v).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ı]/g,'');let ok=0;ins.forEach(i=>{const d=i.dataset.c.split('|').some(c=>nz(c)===nz(i.value));i.classList.toggle('dogru',d);i.classList.toggle('yanlis',!d);if(d)ok++;});const fb=box.querySelector('.bfb');fb.hidden=false;fb.className='bfb '+(ok===ins.length?'iyi':'kotu');fb.textContent=ok===ins.length?'Harika, hepsi doğru!':(ins.length-ok)+' boşluk yanlış. Kırmızı olanları düzeltip tekrar dene.';}
  else if(act==='copy'){const box=document.getElementById('copybox');const txt=box.value;
    const fallback=()=>{box.hidden=false;box.focus();box.select();el.textContent='Seç ve kopyala';};
    try{navigator.clipboard.writeText(txt).then(()=>{el.textContent='Kopyalandı ✓';},fallback);}catch(err){fallback();}}
});
app.addEventListener('change',e=>{
  const cb=e.target.closest('input[data-id]'); if(!cb) return;
  const key=cb.dataset.id.split('.')[0], set=checkedSet(key);
  cb.checked?set.add(cb.dataset.id):set.delete(cb.dataset.id);
  const sc=document.getElementById('score'); if(sc) sc.textContent=scoreOf(key);
});
render();
</script>
