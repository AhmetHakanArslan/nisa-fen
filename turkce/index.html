<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nisa Türkçe Çalışması</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Türkçe · Layout: tek sütun "çalışma defteri"; sayfalama hash ile (ana → bölüm: konu → test → yazılı → baba kontrolü → sonuç; tatbikat: 7 soru → kontrol → sonuç) */
:root{
  --bg:#eef2f8; --paper:#ffffff; --fg:#1b2540; --muted:#5d6a86; --line:#d6deec;
  --accent:#2f5bd3; --accent-soft:#e6ecfc; --ok:#178a57; --ok-soft:#e0f3e9; --warn:#b5531a; --warn-soft:#fbeadf;
  --force:#d0452f; --box:#c7d2e6; --sun:#f4b733; --shadow:rgba(20,28,48,.30); --on-accent:#ffffff;
  --c1:#4b46c7; --c1-soft:#e9e8fb; --c2:#c26510; --c2-soft:#fcecd9; --c3:#c93a2b; --c3-soft:#fbe3df; --c4:#1d8656; --c4-soft:#dcf2e6; --c5:#0b7f86; --c5-soft:#d8f1f2; --c6:#8a4fd6; --c6-soft:#efe6fb; --c7:#b8336a; --c7-soft:#fbe4ee;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629; --c5:#4fd2da; --c5-soft:#113538; --c6:#c5a3ff; --c6-soft:#2c2246; --c7:#ff8ab8; --c7-soft:#3d1f2d}}
:root[data-theme="dark"]{
  --bg:#0e1424; --paper:#161f35; --fg:#e7ecf8; --muted:#9eabc6; --line:#2a3655;
  --accent:#86a8ff; --accent-soft:#1f2b4b; --ok:#4fd39a; --ok-soft:#163629; --warn:#f2a073; --warn-soft:#3b2518;
  --force:#ff7a62; --box:#3a4868; --sun:#f6c24f; --shadow:rgba(0,0,0,.55); --on-accent:#0e1424; color-scheme:dark;
  --c1:#a9a4ff; --c1-soft:#25244b; --c2:#f2a54e; --c2-soft:#3a2a14; --c3:#ff8370; --c3-soft:#3f201c; --c4:#5fd39a; --c4-soft:#163629; --c5:#4fd2da; --c5-soft:#113538; --c6:#c5a3ff; --c6-soft:#2c2246; --c7:#ff8ab8; --c7-soft:#3d1f2d}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{font-weight:700;text-decoration:none;font-size:.95rem}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.crumb.on{background:var(--unit,var(--accent));border-color:var(--unit,var(--accent));color:var(--on-accent)}
.crumb.done{color:var(--ok);border-color:var(--ok)}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.paper > section{display:grid;gap:10px}
.rule{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.rule b{font-family:var(--display);font-size:1.15rem}
.ornek{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ornek .eyebrow{color:var(--accent)}
.hata{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px}
.hata b:first-child{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.mini > b:first-child{font-family:var(--display);font-size:1.05rem;display:block}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:420px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:800}
td.blank{height:2.2em}

.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:320px}
.fig text{font-family:var(--body);font-weight:700;font-size:13px;fill:var(--fg)}
.cap{font-size:.82rem;color:var(--muted);text-align:center}

.qs{list-style:none;padding:0;display:grid;gap:10px}
.qs li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.ql{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.5}
.pts{color:var(--muted);font-size:.85rem;white-space:nowrap}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}

button,.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.wa{background:#1f9d55;color:#fff}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions.center{justify-content:center}

.lead{font-size:1.05rem;border-left:4px solid var(--unit,var(--accent));padding:4px 0 4px 14px;color:var(--fg)}
details.yokla{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
details.yokla summary{cursor:pointer;font-weight:700;display:grid;gap:2px}
details.yokla summary .eyebrow{color:var(--accent)}
details.yokla summary::after{content:"Cevabı görmek için dokun";font-weight:600;font-size:.82rem;color:var(--muted)}
details.yokla[open] summary::after{content:""}
details.yokla p{margin-top:8px;background:var(--ok-soft);border-radius:8px;padding:8px 10px}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pg{width:36px;height:36px;padding:0;border-radius:50%;font-size:.95rem;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pg.on{background:var(--unit,var(--accent));color:var(--on-accent);border-color:var(--unit,var(--accent))}
.pg.done{color:var(--ok);border-color:var(--ok)}
.hata ul{margin-top:6px}
.themebtn{min-height:0;padding:6px 12px;font-size:.85rem;border-radius:999px;margin-left:auto}
/* Ana sayfa */
.home-head{display:grid;gap:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;list-style:none;padding:0;counter-reset:h}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;counter-increment:h}
.how li::before{content:counter(h);font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.3rem;display:block;line-height:1}
.unit{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg)}
.unit:hover{border-color:var(--unit,var(--accent))}
.unit .no{font-family:var(--display);font-weight:800;font-size:1.6rem;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--unit-soft,var(--accent-soft));color:var(--unit,var(--accent))}
.unit h3{font-size:1.1rem}
.unit .sub{font-size:.85rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.list{display:grid;gap:10px}

/* Test */
.opts{display:grid;gap:8px}
.opt{background:var(--paper);color:var(--fg);border:2px solid var(--line);text-align:left;font-family:var(--body);font-weight:700;font-size:1rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--ok-soft)} .fb.good b{color:var(--ok)}
.fb.bad{background:var(--warn-soft)} .fb.bad b{color:var(--warn)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--unit,var(--accent));border-radius:99px}
#app[data-unit] .paper{border-top:5px solid var(--unit)}

/* Kontrol */
.grp{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.grp.first{border-top:0;padding-top:0}
.qhead{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--accent);margin-top:6px}
.model{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
label.item{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;cursor:pointer;padding:6px 4px;border-radius:8px}
label.item:hover{background:var(--accent-soft)}
label.item input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ok)}
.item .p{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.scorebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--paper);border-radius:14px;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.scorebar .big{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.scorebar button{background:var(--paper);color:var(--fg);padding:10px 14px}

/* Sonuç */
.result{text-align:center;justify-items:center}
.big-score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.scores div{border:1px solid var(--line);border-radius:12px;padding:10px}
.scores b{font-family:var(--display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.todo{list-style:none;padding:0;display:grid;gap:8px;text-align:left;width:100%}
.todo li{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px}
.allgood{background:var(--ok-soft);padding:12px;border-radius:10px;width:100%}
textarea.copybox{width:100%;min-height:140px;font-family:var(--body);font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}

/* Matematik ekleri */
.num{font-family:var(--display);font-size:1.35em;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.blot{display:inline-block;width:1em;height:1.05em;border-radius:48% 52% 40% 60%/55% 45% 55% 45%;background:var(--fg);vertical-align:-.12em;margin:0 2px}
.ph{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;padding:0 3px;border:2px dashed var(--unit,var(--accent));border-radius:6px;font-size:.75em;margin:0 2px;color:var(--unit,var(--accent));font-weight:800;vertical-align:middle;box-sizing:border-box;letter-spacing:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-weight:800;line-height:1.15;margin:0 3px;font-variant-numeric:tabular-nums}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.algo-row{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.algo-box{display:grid;gap:6px;justify-items:center}
.algo{display:grid;grid-template-columns:auto auto;font-family:var(--display);font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.55}
.algo span{padding:0 14px}
.algo span:nth-child(odd){border-right:3px solid var(--fg);text-align:right}
.algo span:nth-child(even){color:var(--unit,var(--accent))}
.sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:560px;width:100%;margin:0 auto}
.sieve span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-weight:800;font-size:.85rem;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.sieve span.p{background:var(--unit,var(--accent));color:var(--on-accent)}
.sieve span.one{background:transparent;border:1px dashed var(--line)}
.unit.other .no{font-size:1.3rem}
.basamak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 18px repeat(3,minmax(0,1fr));gap:6px;max-width:640px;width:100%;margin:0 auto}
.basamak .bs{border:2px solid var(--edge);border-radius:8px;background:var(--paper);display:grid;grid-template-rows:auto 1fr;text-align:center;overflow:hidden}
.basamak .bs.ond{background:var(--unit-soft,var(--accent-soft))}
.basamak .bs.bosb{opacity:.45}
.basamak .ba{font-size:.72rem;font-weight:800;padding:4px 2px;border-bottom:2px solid var(--edge);line-height:1.25;color:var(--muted)}
.basamak .br{font-family:var(--display);font-size:2.2rem;line-height:1.5;min-height:1.5em}
.basamak .virgul{font-family:var(--display);font-size:2.8rem;display:grid;align-items:end;justify-content:center;line-height:1.1}
.fig.yuz svg{max-width:250px;min-width:0;margin:0 auto}

html{-webkit-text-size-adjust:100%}
button,.btn,.opt,label.item,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Tablet (iPad) */
@media (min-width:700px){
  body{font-size:18px;line-height:1.65;padding-block:28px 64px}
  .wrap{max-width:860px;gap:20px}
  .paper{padding:30px 34px;gap:18px;border-radius:20px}
  h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.25rem}
  .lead{font-size:1.15rem}
  .fig svg{min-width:0}
  .fig text{font-size:14px}
  table{font-size:1rem}
  th,td{padding:10px 14px}
  button,.btn{font-size:1.15rem;padding:14px 22px;min-height:52px}
  .opts{grid-template-columns:1fr 1fr;gap:12px}
  .opt{min-height:64px;font-size:1.08rem}
  .pg{width:46px;height:46px;font-size:1.05rem;min-height:0;padding:0}
  label.item{grid-template-columns:30px 1fr auto;padding:10px 8px;font-size:1.05rem}
  label.item input{width:26px;height:26px}
  .unit{grid-template-columns:64px 1fr auto;padding:18px}
  .unit .no{width:64px;height:64px;font-size:1.9rem}
  .unit h3{font-size:1.3rem}
  .cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .mini{padding:14px 16px}
  details.yokla{padding:14px 18px}
  .scorebar{padding:14px 22px}
  .big-score{font-size:4rem}
}
@media (min-width:1000px){ .wrap{max-width:920px} }
@media (prefers-reduced-motion:no-preference){.paper{animation:in .22s ease}}
@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}

/* ===== Kareli defter teması ===== */
:root{
  --bg:#F8FAFD; --grid:#DCE6F5; --paper:#FFFFFF; --fg:#1E2A5A; --muted:#51608F; --line:#C9D4EA; --edge:#1E2A5A;
  --accent:#2C47A8; --accent-soft:#EEF2FB; --on-accent:#FFFFFF; --note:#FFF06A; --note-edge:#E3D23E; --tape:#9FD8F7;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --display:var(--hand);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}}
:root[data-theme="dark"]{
  --bg:#121933; --grid:#1D2650; --paper:#1A2346; --fg:#E8EDFF; --muted:#AAB6DC; --line:#36437A; --edge:#8294D8;
  --accent:#AFC2FF; --accent-soft:#232F5C; --on-accent:#121933; --note:#4A4318; --note-edge:#2C280C; --tape:#2D5D7D}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2{font-family:var(--hand);font-weight:400;letter-spacing:.2px}
h1{font-size:2.3rem;line-height:1.05} h2{font-size:1.7rem;line-height:1.1}
h3{font-family:var(--body);font-weight:800}
.eyebrow{text-transform:none;letter-spacing:0;font-size:.88rem;font-weight:800}
.back{font-weight:800;color:var(--fg)}
.paper{border:2px solid var(--edge);border-radius:8px;box-shadow:6px 6px 0 var(--edge)}
#app[data-unit] .paper{border-top:2px solid var(--edge);background-image:linear-gradient(var(--unit),var(--unit));background-size:100% 12px;background-repeat:no-repeat;padding-top:32px}
.rule{background:var(--note);border-radius:3px;box-shadow:0 6px 0 -2px var(--note-edge)}
.rule b{font-family:var(--hand);font-weight:400;font-size:1.45rem;line-height:1.2}
.note{background:var(--accent-soft);border:2px dashed var(--line)}
.ornek{background:var(--paper)}
.unit{border:2px solid var(--edge);border-radius:8px;box-shadow:4px 4px 0 var(--edge)}
.unit:hover{border-color:var(--edge);box-shadow:5px 5px 0 var(--edge);transform:translate(-1px,-1px)}
.unit .no{border:2px solid var(--edge);border-radius:50%;font-family:var(--hand);font-weight:400}
.how li{border:2px solid var(--edge);border-radius:8px}
.how li::before{font-family:var(--hand);font-weight:400;font-size:1.6rem;color:var(--fg)}
button,.btn{font-family:var(--body);font-weight:800}
.primary{background:var(--fg);color:var(--paper);border:2px solid var(--fg)}
.ghost{background:var(--paper);color:var(--fg);border:2px solid var(--edge)}
.opt{border:2px solid var(--edge);border-radius:10px}
.crumb{border:2px solid var(--line)}
.pg{border:2px solid var(--line)}
.progress{height:12px;background:var(--paper);border:2px solid var(--edge)}
.chip{border:1.5px solid var(--line);font-family:var(--hand);font-weight:400;font-size:1.02rem;background:var(--paper)}
.chip.ok{border-color:var(--ok)}
.scorebar{background:var(--fg);color:var(--paper);border-radius:10px}
.big-score{font-family:var(--hand);font-weight:400}
.scores div{border:2px solid var(--edge);border-radius:8px}
.scores b{font-family:var(--hand);font-weight:400}
details.yokla{border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.qhead{font-family:var(--hand);font-weight:400;font-size:1.55rem}
.themebtn{border:2px solid var(--edge)}
.todo li{border-radius:3px}
@media (min-width:700px){ h1{font-size:2.8rem} h2{font-size:2rem} .rule b{font-size:1.6rem} }

/* ===== Anlatım sayfaları: ferah düzen ve defter süsleri ===== */
:root{--rl:#E3EAF6;--margin:#F3A6A6;--hl:rgba(255,232,64,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}}
:root[data-theme="dark"]{--rl:#28336A;--margin:#7E4458;--hl:rgba(255,224,77,.24)}
article.paper{gap:22px}
article.paper > p, article.paper > .lead{max-width:40em}
article.paper h1{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--unit,var(--accent));text-decoration-thickness:2px;text-underline-offset:12px;text-decoration-skip-ink:none;padding-bottom:4px}
article.paper h3{margin-top:4px}
article.paper p b, article.paper li b{background:linear-gradient(transparent 56%,var(--hl) 56%);padding:0 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rule p b, .rule li b, .hata p b, .hata li b{background:none;padding:0}
article.paper .deney p b{background:none;padding:0}
.rule span b{font-family:inherit;font-size:inherit;font-weight:800;line-height:inherit}
.ornek{position:relative;display:block;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rl) 31px,var(--rl) 32px);background-position:0 12px;border:2px solid var(--edge);border-radius:6px;box-shadow:4px 4px 0 var(--edge);padding:12px 18px 14px 50px;line-height:32px}
.ornek > *{margin:0;line-height:32px}
.ornek .eyebrow{display:block;color:var(--unit,var(--accent))}
.ornek .tbl-wrap,.ornek .fig{margin:8px 0;line-height:1.5}
.ornek .tbl-wrap *{line-height:1.5}
.rule{position:relative;transform:rotate(-.4deg);padding:20px 20px 18px;margin-top:6px}
.rule::before{content:"";position:absolute;top:-11px;left:24px;width:84px;height:22px;background:var(--tape);opacity:.8;transform:rotate(-3deg)}
article.paper > .fig{background:var(--paper);border:2px solid var(--edge);border-radius:6px;padding:14px 12px}
.hata{background:var(--warn-soft);border:2px dashed var(--warn);border-radius:6px;padding:14px 16px}
.mini{border:2px solid var(--edge);border-radius:8px;background:var(--paper);box-shadow:3px 3px 0 var(--edge)}
.mini > b:first-child{font-family:var(--hand);font-weight:400;font-size:1.35rem;margin-bottom:2px}
details.yokla{background:var(--accent-soft);border:2px dashed var(--edge)}
details.yokla[open]{background:var(--paper);border-style:solid}
.adimlar{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px 18px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--edge)}
.adimlar .eyebrow{color:var(--unit,var(--accent))}
.adimlar ol{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:a}
.adimlar li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.adimlar li::before{content:counter(a);width:32px;height:32px;border-radius:50%;background:var(--unit,var(--accent));color:var(--on-accent);display:grid;place-items:center;font-family:var(--hand);font-size:1.2rem}
.adimlar .actions{justify-content:flex-start}
.birlikte{border:2px dashed var(--unit,var(--accent));border-radius:10px;background:var(--unit-soft,var(--accent-soft));padding:16px 18px;display:grid;gap:10px}
.birlikte .eyebrow{color:var(--fg)}
.birlikte .satir{font-size:1.12rem;line-height:2.3}
.birlikte .actions{justify-content:flex-start}
input.bos{font:inherit;font-weight:800;width:3em;text-align:center;border:none;border-bottom:3px solid var(--fg);background:var(--paper);color:var(--fg);border-radius:6px 6px 0 0;padding:1px 4px;margin:0 3px;line-height:1.4}
input.bos.genis{width:5em}
.frac input.bos{width:2.4em;margin:0 0 2px}
input.bos.dogru{background:var(--ok-soft);border-bottom-color:var(--ok)}
input.bos.yanlis{background:var(--warn-soft);border-bottom-color:var(--warn)}
.bfb{font-weight:800} .bfb.iyi{color:var(--ok)} .bfb.kotu{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.adimlar li.yeni{animation:adim .35s ease}}
@keyframes adim{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (min-width:700px){ .wrap{max-width:940px} article.paper{padding:40px 52px 44px;gap:26px} #app[data-unit] article.paper{padding-top:48px} }
@media (min-width:1000px){ .wrap{max-width:980px} }


.deney{border:2px solid var(--edge);border-radius:10px;background:var(--paper);padding:16px 18px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--edge)}
.deney .eyebrow{color:var(--unit,var(--accent))}
.deney .actions{justify-content:flex-start}
.dsonuc{display:grid;gap:8px;min-height:120px}
.dbar{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-weight:800}
.dcub{height:22px;border:2px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--bg)}
.dcub span{display:block;height:100%;transition:width .4s ease}
.dsay{font-family:var(--hand);font-size:1.25rem;font-weight:400;font-variant-numeric:tabular-nums}
.dgecmis{margin:0;padding-left:1.3em;color:var(--muted);font-size:.95rem;display:grid;gap:2px}
.dgecmis:empty{display:none}
/* ===== Bölüm listesi sayfası ===== */
.home-head .date{margin:6px 0 0;font-weight:700;color:var(--muted)}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ahead h1{font-size:3rem}
.stars{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--edge);border-radius:999px;padding:7px 16px 7px 12px;font-weight:800}
svg.st{width:24px;height:24px;flex:none}
svg.st path{fill:#FFC83D;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
.today{position:relative;background:var(--note);padding:30px 28px 26px;transform:rotate(-.8deg);box-shadow:0 10px 0 -4px var(--note-edge);display:grid;gap:12px;margin:12px 0 6px}
.today::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-70px;width:140px;height:28px;background:var(--tape);opacity:.85;transform:rotate(2deg)}
.today h2{font-size:2.2rem}
.today p{font-size:1.1rem;max-width:36em}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.bcard{text-decoration:none;color:var(--fg);background:var(--paper);border:2px solid var(--edge);border-radius:6px;box-shadow:6px 6px 0 var(--edge);display:flex;flex-direction:column;overflow:hidden}
.bcard:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--edge)}
.bcard .band{height:14px;background:var(--unit,var(--fg));border-bottom:2px solid var(--edge)}
.bcard.tcard .band{background:repeating-linear-gradient(45deg,var(--note) 0 10px,var(--note-edge) 10px 20px)}
.bbody{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:16px 18px 8px;align-items:start}
.bno{width:48px;height:48px;border-radius:50%;border:2px solid var(--edge);background:var(--unit-soft,var(--accent-soft));color:var(--unit,var(--fg));display:grid;place-items:center;font-family:var(--hand);font-size:1.6rem}
.btxt{display:grid;gap:2px}
.bcard h3{font-size:1.2rem;line-height:1.25}
.bcard .sub{font-size:.9rem;color:var(--muted)}
.bdur{display:flex;align-items:center;gap:6px;padding:4px 18px 16px;font-family:var(--hand);font-size:1.15rem;margin-top:auto}
.bcard.done .bdur{color:var(--ok)}
@media (max-width:600px){.bgrid{grid-template-columns:1fr}.ahead h1{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){.bcard:hover{transform:none}}

 --ka:#f6c98b;--kav:#b9d3f5;--kaf:#f3aaa2;--kkam:#bfe3b0;--kgam:#d9c2f2;--kok:#f4dc80;--kan:#eef2f7;--ktr:#d0452f;

 --ka:#7a5a2c;--kav:#2f4d7a;--kaf:#7a3a35;--kkam:#3f6a39;--kgam:#57407a;--kok:#776628;--kan:#4a5568;--ktr:#ff7a62;
 --y1:#3f7a37;--y2:#8f8233;--y3:#8f5f2a;--y4:#5e3620}}
:root[data-theme="dark"]{--sea:#132a4a;--land:#4a4230;--near:#2a3248;--prov:#6d6044;--seatext:#8fc1f2;
 --ka:#7a5a2c;--kav:#2f4d7a;--kaf:#7a3a35;--kkam:#3f6a39;--kgam:#57407a;--kok:#776628;--kan:#4a5568;--ktr:#ff7a62;
 --y1:#3f7a37;--y2:#8f8233;--y3:#8f5f2a;--y4:#5e3620}

.k-asya{fill:var(--ka)} .k-avrupa{fill:var(--kav)} .k-afrika{fill:var(--kaf)} .k-kam{fill:var(--kkam)} .k-gam{fill:var(--kgam)} .k-okya{fill:var(--kok)} .k-ant{fill:var(--kan)} .k-tr{fill:var(--ktr)}

.metin{background:var(--paper);border:2px solid var(--edge);border-left:8px solid var(--unit,var(--accent));border-radius:6px;padding:14px 16px;font-size:1.05rem;line-height:1.6}

<body>
<div class="wrap" id="app"></div>

<script>
const DERS='tr';
/* ---------- ETKİLEŞİMLİ ANLATIM KUTULARI ---------- */
const adimAdim=(baslik,adimlar)=>`<div class="adimlar"><span class="eyebrow">${baslik}</span><ol>${adimlar.map((a,i)=>`<li${i?' hidden':''}><span>${a}</span></li>`).join('')}</ol><div class="actions"><button class="primary" data-act="adim">Sonraki adım</button></div></div>`;
/* boşluk: cevaplar | ile ayrılır; büyük-küçük harf ve noktalama önemsiz */
const bosluk=(cevap,tur)=>`<input class="bos ${tur||'kelime'}" inputmode="${tur==='sayi'?'numeric':'text'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Boşluk" data-c="${cevap}">`;
const birlikte=(satirlar)=>`<div class="birlikte"><span class="eyebrow">Birlikte yapalım: boşlukları doldur</span>${satirlar.map(s=>`<div class="satir">${s}</div>`).join('')}<div class="actions"><button class="ghost" data-act="kontrol">Kontrol et</button></div><p class="bfb" hidden></p></div>`;
/* seçmeli kutu: her satırda doğru seçeneğe dokun */
const sec=(baslik,satirlar)=>`<div class="secim"><span class="eyebrow">${baslik}</span>${satirlar.map(([t,ops,d])=>`<div class="srow"><span class="stxt">${t}</span><span class="sops">${ops.map((o,j)=>`<button class="sop" data-act="sec" data-ok="${j===d?1:0}">${o}</button>`).join('')}</span></div>`).join('')}<p class="bfb" hidden></p></div>`;
/* ---------- ÇİZİM YARDIMCILARI ---------- */
const tbl=(head,rows)=>`<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>c===''?'<td class="blank"></td>':`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const qs=items=>`<ol class="qs">${items.map(([l,t,p])=>`<li><span class="ql">${l}</span><span>${t} <span class="pts">(${p} puan)</span></span></li>`).join('')}</ol>`;
const yok=(q,a)=>`<details class="yokla"><summary><span class="eyebrow">Kendini yokla</span><span>${q}</span></summary><p>${a}</p></details>`;
const fig=(svg,alt)=>`<figure class="fig harita">${svg}${alt?`<figcaption>${alt}</figcaption>`:''}</figure>`;
const metin=t=>`<div class="metin">${t}</div>`;
const cizgi=n=>`<span class="cizgi" style="width:${n||8}em"></span>`;


const KONU=[
/* ===== BÖLÜM 1: KELİMENİN ANLAMINI TAHMİN ETME ===== */
[
{t:"Bilmediğin bir kelime çıktı. Ne yapacaksın?",h:`
<p class="lead">Okurken hiç duymadığın bir kelimeyle karşılaştın. Sözlük yanında yok. Panik yok: <b>dedektif</b> gibi çevresindeki cümlelere bakıp anlamını tahmin edebilirsin.</p>
<p>Kelimeler tek başına durmaz. Önündeki ve arkasındaki sözler, o kelimenin ne anlama geldiğini çoğu zaman <b>ele verir</b>. Bu sözlere <b>ipucu</b> diyoruz.</p>
<div class="ornek"><span class="eyebrow">Örnek · Dedektif işi</span>
<p>Dedem çok <b>cömert</b> biriydi; elindeki son ekmeği bile komşusuyla paylaşırdı.</p>
<p>“Cömert” ne demek? İpucu: <b>“son ekmeği bile komşusuyla paylaşırdı”</b>. Demek ki cömert, <b>elindekini başkalarıyla paylaşmayı seven, eli açık</b> kişidir.</p></div>
${adimAdim("Adım adım · Anlam tahmini",[
 "Bilmediğin kelimenin geçtiği <b>cümleyi</b> baştan sona bir daha oku.",
 "Bir önceki ve bir sonraki cümleye de bak. İpucu bazen komşu cümlededir.",
 "Kelimeyi anlatan, ona örnek veren ya da tam tersini söyleyen <b>ipucu ifadeyi</b> bul ve altını çiz.",
 "İpucuna göre bir <b>tahmin</b> yap: “Bu kelime galiba … demek.”",
 "Tahminini kelimenin yerine koy ve cümleyi tekrar oku. Cümle anlamlı oluyorsa tahminin doğrudur."])}
<div class="rule"><span class="eyebrow">Kolay hatırla</span><b>Kelime yalnız değildir</b><span>Anlamını bilmediğin kelimenin cevabı, hemen yanındaki sözlerde saklıdır.</span></div>
${yok("“Annem bu vazoyu çok <b>kıymetli</b> bulur; kimsenin dokunmasına izin vermez, tozunu bile kendisi alır.” Kıymetli ne demek, hangi ifadeden anladın?","<b>Değerli, önemli.</b> İpucu: “kimsenin dokunmasına izin vermez, tozunu bile kendisi alır”.")}`},
{t:"İpucu türleri",h:`
<p class="lead">İpuçları farklı kılıklarda saklanır. Hangi kılıkta olduklarını bilirsen onları çok daha çabuk yakalarsın.</p>
${tbl(["İpucu türü","Nasıl tanırım?","Örnek"],[
 ["Açıklama","“yani”, “başka bir deyişle” ya da noktalı virgülden sonra kelime anlatılır","Ali çok <b>sabırlı</b>dır; yani beklemekten hiç sıkılmaz."],
 ["Eş anlam","Aynı anlama gelen başka bir kelime yakında geçer","Bu <b>kadim</b> şehir, dünyanın en eski şehirlerinden biridir."],
 ["Zıt anlam","“ama”, “fakat”, “oysa”, “değil” gibi kelimelerle tersi söylenir","Kardeşim eskiden <b>çekingendi</b> ama artık herkesle rahatça konuşuyor."],
 ["Örnek","“örneğin”, “gibi” ile kelimeye örnekler verilir","Bahçede <b>kemirgenler</b> vardı; fareler, sincaplar gibi."],
 ["Sonuç / durum","Kelimeden sonra ne olduğu anlatılır","Koşudan sonra öyle <b>bitkin</b> düştü ki bir adım bile atamadı."]])}
${sec("Hangi ipucu? Her satırda doğru kutuya dokun",[
 ["Kuzenim çok <b>dalgın</b>dır; yani etrafında olanları çoğu zaman fark etmez.",["Açıklama","Zıt anlam","Örnek"],0],
 ["Elif sınavdan önce çok <b>tedirgin</b>di ama sınav başlayınca rahatladı.",["Örnek","Zıt anlam","Açıklama"],1],
 ["Pazarda <b>baklagiller</b> satılıyordu: nohut, fasulye, mercimek gibi.",["Zıt anlam","Açıklama","Örnek"],2],
 ["Bütün gece uyumayınca sabah çok <b>mahmur</b>du; gözleri kapanıyor, esneyip duruyordu.",["Sonuç / durum","Zıt anlam","Örnek"],0]])}
<div class="hata"><b>Dikkat:</b> İpucu her zaman aynı cümlede olmayabilir. Bulamazsan bir önceki ve bir sonraki cümleye mutlaka bak.</div>
${yok("“Bu kitap çok <b>sürükleyici</b>; okumaya başlayınca bir türlü elimden bırakamadım.” Hangi ipucu türü kullanılmış?","<b>Sonuç / durum ipucu.</b> Kitabı bırakamamak, kitabın sürükleyici olmasının sonucudur. Sürükleyici: insanı kendine bağlayan, merakla okutan.")}`},
{t:"Yerine koy testi",h:`
<p class="lead">Tahminini yaptın. Doğru mu, emin değil misin? Çok kolay bir yolu var: tahminini kelimenin yerine koy.</p>
<div class="ornek"><span class="eyebrow">Örnek · Yerine koy</span>
<p>Mahallemize yeni gelen aile çok <b>misafirperver</b>; kapılarını çalan herkesi içeri buyur edip çay ikram ediyorlar.</p>
<p>Tahmin: “misafirlerini güler yüzle ağırlamayı seven”.</p>
<p>Yerine koyalım: Mahallemize yeni gelen aile çok <b>misafirlerini güler yüzle ağırlamayı seven</b> bir aile. Cümle anlamlı oldu, tahmin doğru.</p></div>
<div class="rule"><span class="eyebrow">Altın kural</span><b>Tahmin cümleye oturuyorsa doğrudur</b><span>Yerine koyduğunda cümle saçma oluyorsa ipucuna bir daha bak, yeni bir tahmin yap.</span></div>
${birlikte([
 `Nine her sabah bahçesindeki çiçekleri büyük bir <b>özenle</b> sular. Özen = ${bosluk('dikkat|itina|ihtimam|titizlik')}`,
 `Babam bana sevindirici bir <b>müjde</b> verdi: Yaz tatilinde denize gidecekmişiz! Müjde = sevindirici ${bosluk('haber|bir haber')}`,
 `Bu <b>kadim</b> köprü çok eskidir, yüzlerce yıl önce yapılmıştır. Kadim = çok ${bosluk('eski|eskiden kalma')}`,
 `Ayşe hastalanan arkadaşını <b>teselli</b> etti; ona sarılıp “Merak etme, yakında iyileşeceksin.” dedi. Teselli etmek = ${bosluk('avutmak|gönlünü almak|rahatlatmak|moral vermek|üzüntüsünü hafifletmek')}`])}
${yok("“Okulun bahçesi teneffüste çok <b>hareketli</b>ydi; çocuklar koşuyor, top oynuyor, ip atlıyordu.” Hareketli için bir tahmin yap ve yerine koyarak dene.","Tahmin: <b>canlı, kıpır kıpır, çok kişinin hareket ettiği.</b> “Bahçe teneffüste çok canlıydı” cümlesi anlamlı, tahmin doğru.")}`},
{t:"Sınavda nasıl yazarım?",h:`
<p class="lead">Sınavda bu sorudan tam puan almak için <b>iki şey</b> yazman gerekir: kelimenin anlamı ve bu anlamı <b>hangi ifadeden</b> çıkardığın.</p>
<div class="rule"><span class="eyebrow">Cevap kalıbı</span><b>“… kelimesi … anlamına gelir. Bunu metindeki “…” ifadesinden çıkardım.”</b><span>Bu kalıbı ezberle. Her kelime sorusunda işine yarar.</span></div>
<div class="ornek"><span class="eyebrow">Örnek · Tam puanlık cevap</span>
${metin("Kasabamızın kütüphanesi çok eski bir binadaydı. Yıllarca <b>bakımsız</b> kaldığı için duvarları çatlamış, pencereleri kırılmış, rafları tozla kaplanmıştı.")}
<p><b>Soru:</b> “Bakımsız” kelimesinin anlamını tahmin ediniz. Hangi ifadeden yararlandığınızı belirtiniz.</p>
<p><b>Cevap:</b> “Bakımsız” kelimesi <b>ilgilenilmemiş, onarılmamış, temizlenmemiş</b> anlamına gelir. Bunu metindeki <b>“duvarları çatlamış, pencereleri kırılmış, rafları tozla kaplanmıştı”</b> ifadesinden çıkardım.</p></div>
<div class="hata"><b>Sık yapılan hata:</b> Sadece anlamı yazıp ipucunu yazmamak. Soru “hangi ifadeden yararlandığınızı belirtiniz” diyorsa ipucunu <b>tırnak içinde</b> metinden aynen yaz. Yoksa puanın yarısı gider.</div>
${adimAdim("Tablo sorusu gelirse",[
 "Tabloda her kelime için ayrı bir satır olur. Her satıra o kelimenin anlamını yaz.",
 "Anlamı <b>kısa ve net</b> yaz: “öğüt: nasihat, birine doğru yolu göstermek için söylenen söz”.",
 "Emin olmadığın kelimede yerine koy testini yap.",
 "Boş satır bırakma. Tahmin bile olsa yaz; yakın bir anlam da puan getirebilir."])}
${yok("Tabloya “kuşak” kelimesinin anlamını yaz: “Her kelime kuşaktan kuşağa aktarılan bir mirastır.”","<b>Kuşak: nesil</b>, yaklaşık aynı dönemde doğmuş insanlar. Kelimeler dedelerden torunlara, nesilden nesile aktarılır.")}`}
],
/* ===== BÖLÜM 2: METNİN YÜZEY ANLAMI ===== */
[
{t:"Yüzey anlam ne demek?",h:`
<p class="lead">Bir metin bir havuza benzer. <b>Yüzeyde</b> açıkça görünen şeyler vardır. Bu bölümde, metinde <b>açıkça yazan</b> bilgileri bulmayı öğreneceğiz.</p>
<p><b>Yüzey anlam</b>, metinde doğrudan yazılmış bilgilerdir. Tahmin etmene ya da yorum yapmana gerek yoktur; cevap metnin içinde kelimesi kelimesine durur.</p>
<p>Yüzey anlamı bulmak için metne <b>6 soru</b> sorarız. Bunlara <b>5N1K</b> denir.</p>
${tbl(["Soru","Ne arar?"],[["Ne?","Ne oldu, ne yapıldı?"],["Nerede?","Olay nerede geçti?"],["Ne zaman?","Ne zaman oldu?"],["Nasıl?","Nasıl yapıldı?"],["Neden?","Niçin, hangi amaçla?"],["Kim?","Kim yaptı, kimler var?"]])}
<div class="ornek"><span class="eyebrow">Örnek · 5N1K</span>
${metin("Geçen cumartesi sabahı 6-B sınıfı öğrencileri, okulun yanındaki parkı temizlemek için toplandı. Eldiven ve çöp poşetleriyle bütün parkı dolaştılar. Topladıkları plastikleri geri dönüşüm kutusuna attılar.")}
${tbl(["Soru","Metindeki cevap"],[["Kim?","6-B sınıfı öğrencileri"],["Ne zaman?","Geçen cumartesi sabahı"],["Nerede?","Okulun yanındaki parkta"],["Ne?","Parkı temizlediler"],["Nasıl?","Eldiven ve çöp poşetleriyle"],["Neden?","Parkı temizlemek için"]])}</div>
${birlikte([
 `Öğrenciler parkı ne zaman temizledi? Geçen ${bosluk('cumartesi|cumartesi sabahı')} sabahı.`,
 `Topladıkları plastikleri nereye attılar? Geri dönüşüm ${bosluk('kutusuna|kutusu')}`])}
${yok("Yukarıdaki metne göre öğrenciler parkta ne kullandı?","<b>Eldiven ve çöp poşeti.</b> Cevap metinde açıkça yazıyor.")}`},
{t:"Cevap metnin neresinde?",h:`
<p class="lead">Yüzey anlam sorularında altın kural şudur: <b>Cevabı kendi kafandan değil, metinden</b> bulacaksın.</p>
<div class="rule"><span class="eyebrow">Altın kural</span><b>“Metne göre” = Metinde ne yazıyorsa o</b><span>Sen başka bir şey düşünsen bile metinde yazanı yaz.</span></div>
${adimAdim("Adım adım · Cevabı bulma",[
 "Soruyu dikkatle oku ve sorudaki <b>önemli kelimeyi</b> bul. Örneğin “hangi amaçla” sorusunun önemli kelimesi <b>amaç</b>tır.",
 "Metinde bu kelimeyi ya da ona yakın bir kelimeyi ara: “amacıyla”, “için”, “diye”.",
 "Bulduğun cümleyi bir daha oku. Cevap genellikle o cümlededir.",
 "Cevabı <b>tam cümleyle</b> yaz. Metindeki kelimeleri kullanabilirsin."])}
<h3>“Bu”, “bunlar”, “bu sorunlar” neyi anlatıyor?</h3>
<p>Bazen metin bir şeyi anlattıktan sonra ona <b>“bu”</b> diye geri döner. Soru “bu sorunlar” ifadesiyle neyin anlatıldığını sorarsa, o ifadenin <b>hemen öncesine</b> bak.</p>
<div class="ornek"><span class="eyebrow">Örnek · Geri dönüp bak</span>
${metin("Sınıfımızın kitaplığında kitaplar karışık duruyordu. Öğrenciler aradıkları kitabı bulamıyor, okudukları kitabı da yerine koymayı unutuyordu. Öğretmenimiz <b>bu sorunları</b> çözmek için kitaplığa etiketler yapıştırdı.")}
<p>“Bu sorunlar” = <b>1)</b> Öğrencilerin aradıkları kitabı bulamaması. <b>2)</b> Okudukları kitabı yerine koymayı unutmaları.</p></div>
${sec("Doğru cevap hangisi? Yukarıdaki metne göre",[
 ["Öğretmen sorunları çözmek için ne yaptı?",["Yeni kitap aldı","Kitaplığa etiket yapıştırdı","Kitaplığı kapattı"],1],
 ["Kitaplar nasıl duruyordu?",["Karışık","Çok düzenli","Kutularda"],0]])}`},
{t:"Afiş ve görsel okuma",h:`
<p class="lead">Sınavda bazen metnin yanında bir <b>afiş</b> olur. Afiş de bir metindir; sadece kısa ve maddeler hâlindedir.</p>
<div class="afis"><span class="eyebrow">Afiş</span><h4>KİTAP TAKAS GÜNÜ</h4><p><b>15 Kasım Cuma · Okul Bahçesi · 12.30</b></p>
<ol><li>Okuduğun bir kitabı yanında getir.</li><li>Kitabını masaya bırak, karşılığında bir kitap seç.</li><li>Kitabın yoksa kütüphane öğretmenine adını yazdır; sana kütüphaneden bir kitap ödünç verilir.</li><li>Seçtiğin kitabı iki hafta içinde oku ve arkadaşlarına anlat.</li></ol></div>
${adimAdim("Adım adım · Afiş okuma",[
 "Önce afişin <b>başlığını</b> oku. Başlık sana afişin ne hakkında olduğunu söyler.",
 "Tarihi, saati ve yeri bul. Bunlar “ne zaman?” ve “nerede?” sorularının cevabıdır.",
 "Maddeleri tek tek oku. Her madde bir kuraldır ya da ne yapman gerektiğini söyler.",
 "Soru “afişteki yönergeye göre” diyorsa cevabı mutlaka maddelerden birinden bul."])}
${birlikte([
 `Kitap takas günü nerede yapılacak? Okul ${bosluk('bahçesinde|bahçesi|bahcesi|bahcesinde')}`,
 `Saat kaçta başlayacak? ${bosluk('12.30|1230|12 30|on iki otuz|on iki buçuk','sayi')}`,
 `Kitabın yoksa kime adını yazdırmalısın? Kütüphane ${bosluk('öğretmenine|öğretmeni|ogretmenine|ogretmeni')}`,
 `Seçtiğin kitabı kaç hafta içinde okumalısın? ${bosluk('2|iki','sayi')} hafta`])}
${yok("Kitap takas gününe katıldın ama getirecek kitabın yok. Afişe göre ne yapmalısın?","Afişin 3. maddesine göre: <b>Kütüphane öğretmenine adımı yazdırmalıyım. Bana kütüphaneden bir kitap ödünç verilir.</b>")}`},
{t:"Kaç şey soruyor? Hepsini yaz",h:`
<p class="lead">Sınavdaki yüzey anlam soruları genellikle <b>a, b, c, d</b> diye maddelere ayrılır ve bazıları birden fazla cevap ister. Puanı kaçırmamak için sayıya dikkat et.</p>
<div class="rule"><span class="eyebrow">Sınav ipucu</span><b>“Hangi iki sorun?” = İki ayrı madde</b><span>Soru “iki” diyorsa iki, “üç” diyorsa üç cevap yaz. Her cevabı ayrı satıra, numaralı yaz.</span></div>
<div class="ornek"><span class="eyebrow">Örnek · Metin + afiş birlikte</span>
<p>Soru: “Metne ve afişe göre bilgilendirme kartlarının arkasında hangi iki bilgi bulunur?”</p>
<p>Bu soruda <b>hem metne hem afişe</b> bakman gerekir. Bilginin biri metinde, biri afişte olabilir. Sadece birine bakarsan cevabın eksik kalır.</p></div>
${tbl(["Sorudaki ifade","Nereye bakarım?"],[["“Metne göre…”","Sadece metne"],["“Afişe göre…”","Sadece afişe"],["“Metne ve afişe göre…”","İkisine de"],["“Afişteki yönergeye göre ne yapmalısınız?”","Afişteki maddelere"]])}
<div class="hata"><b>Sık yapılan hata:</b> Cevabı kendi fikrinle yazmak. Örneğin “Kartım yoksa arkadaşımdan isterim.” yazmak, afiş başka bir şey söylüyorsa puan getirmez. Afişte ne yazıyorsa onu yaz.</div>
${sec("Nereye bakmalısın?",[
 ["“Metne göre Kelime Köşesi hangi amaçla hazırlandı?”",["Metne","Afişe","İkisine de"],0],
 ["“Afişteki yönergeye göre kartın yoksa ne yapmalısın?”",["Metne","Afişe","İkisine de"],1],
 ["“Metne ve afişe göre kartların arkasında hangi bilgiler var?”",["Metne","Afişe","İkisine de"],2]])}
${yok("Soru “Öğrencilerin yaşadığı hangi iki sorun anlatılıyor?” diyor. Cevabını nasıl yazarsın?","İki ayrı satır, numaralı: <b>1.</b> … <b>2.</b> … Her sorunu metindeki kelimelerle tam cümle olarak yaz.")}`}
],
/* ===== BÖLÜM 3: ANAHTAR KELİME ===== */
[
{t:"Anahtar kelime nedir?",h:`
<p class="lead">Anahtar bir kapıyı açar. <b>Anahtar kelime</b> de bir metnin kapısını açar: onu duyunca metnin neyi anlattığını hemen anlarsın.</p>
<p><b>Anahtar kelime</b>, metnin konusunu en iyi anlatan kelime ya da kelime grubudur. Metinde genellikle <b>birkaç kez geçer</b> ve metin onun etrafında döner.</p>
<div class="ornek"><span class="eyebrow">Örnek · Anahtar kelimeleri bul</span>
${metin("Simit, Türkiye'nin en sevilen sokak lezzetlerinden biridir. Susamlı halka biçimindeki simit, yüzyıllardır sabah kahvaltılarının vazgeçilmezidir. Simitçiler sabahın erken saatlerinde tepsilerini başlarına alıp sokak sokak dolaşır. Simit, ucuz ve doyurucu olduğu için her yaştan insanın gönlünü kazanmıştır. Bu lezzet, geleneklerimizin bir parçası olarak bugün de yaşamaktadır.")}
<p>Anahtar kelimeler: <b>simit</b>, <b>sokak lezzeti</b>, <b>gelenek</b>. Hepsi metnin ana konusuyla doğrudan ilgili.</p>
<p>Anahtar kelime olmayanlar: “sabah”, “tepsi”, “insan”. Bunlar metinde geçiyor ama metnin konusu değil, sadece küçük ayrıntılar.</p></div>
${sec("Yukarıdaki metin için anahtar kelime mi?",[
 ["Simit",["Anahtar kelime","Ayrıntı"],0],
 ["Tepsi",["Anahtar kelime","Ayrıntı"],1],
 ["Sokak lezzeti",["Anahtar kelime","Ayrıntı"],0],
 ["Erken saatler",["Anahtar kelime","Ayrıntı"],1],
 ["Gelenek",["Anahtar kelime","Ayrıntı"],0]])}
<div class="rule"><span class="eyebrow">Kolay hatırla</span><b>Anahtar kelime = Metnin konusu</b><span>Kelime grubu da olabilir: “Türk kültürü”, “kültürel miras”, “sokak lezzeti”.</span></div>`},
{t:"Anahtar kelime nasıl bulunur?",h:`
<p class="lead">Anahtar kelimeyi bulmak için 4 küçük soru sorarız. Hepsini sırayla deneyelim.</p>
${adimAdim("Adım adım · Anahtar kelime avı",[
 "<b>Konu ne?</b> Metni bitirince kendine sor: “Bu metin ne hakkında?” Cevabın ilk anahtar kelimendir.",
 "<b>Ne tekrar ediyor?</b> Metinde birden çok geçen kelimelere bak. Sık geçen kelime çoğu zaman anahtardır.",
 "<b>Başlık deneyi:</b> Bu kelime metnin başlığı olabilir mi? Olabiliyorsa anahtar kelimedir.",
 "<b>Çıkarma deneyi:</b> Bu kelimeyi metinden çıkarınca metin anlamını kaybediyor mu? Kaybediyorsa anahtar kelimedir."])}
<div class="ornek"><span class="eyebrow">Örnek · Deneyelim</span>
${metin("Bal arıları, doğanın en çalışkan canlılarındandır. Bir arı, çiçekten çiçeğe konarak nektar toplar. Arılar bu sırada çiçeklerin tozlaşmasını da sağlar. Tozlaşma olmasaydı meyve ve sebzelerin çoğu yetişmezdi. Bu yüzden arıları korumak, doğayı korumak demektir.")}
${tbl(["Soru","Cevap"],[["Konu ne?","Bal arıları"],["Ne tekrar ediyor?","Arı (4 kez), tozlaşma (2 kez)"],["Başlık olur mu?","“Bal Arıları”, “Tozlaşma” olur"],["Anahtar kelimeler","<b>bal arısı, tozlaşma, doğayı korumak</b>"]])}</div>
${birlikte([
 `Yukarıdaki metinde en çok tekrar eden kelime: ${bosluk('arı|arılar|bal arısı|bal arıları')}`,
 `Arıların çiçeklere sağladığı şey: ${bosluk('tozlaşma|tozlasma')}`])}
${yok("“Japonya” kelimesi lokum hakkında bir metinde bir kez geçiyorsa anahtar kelime olur mu?","<b>Olmaz.</b> Japonya metnin konusu değil, sadece küçük bir ayrıntı. Anahtar kelime lokum, Türk mutfağı, gelenek gibi metnin konusunu anlatan kelimelerdir.")}`},
{t:"İpucu kartları",h:`
<p class="lead">Sınavda bazen anahtar kelimeyi sen bulmazsın; sana <b>ipucu kartları</b> verilir ve kartın başına uygun anahtar kelimeyi yazman istenir. Bir bilmece gibi!</p>
<div class="kartlar">
<div class="kart"><span class="kb">?</span><ul><li>Uyumadan önce söylenir</li><li>Annelerin sesiyle</li></ul></div>
<div class="kart"><span class="kb">?</span><ul><li>Kısa ve öğüt verir</li><li>Atalarımızdan kalmıştır</li></ul></div>
<div class="kart"><span class="kb">?</span><ul><li>Bir zamanlar…</li><li>Devler, periler</li></ul></div></div>
${sec("Her kartın anahtar kelimesi hangisi?",[
 ["1. kart: uyumadan önce, annelerin sesiyle",["Ninni","Türkü","Fıkra"],0],
 ["2. kart: kısa, öğüt verir, atalardan",["Masal","Atasözü","Şiir"],1],
 ["3. kart: bir zamanlar, devler, periler",["Masal","Haber","Ninni"],0]])}
<h3>Tersi de sorulabilir</h3>
<p>Bu kez sen bir anahtar kelime seçip ona <b>iki ipucu</b> yazarsın. Bir de seçtiğin kelimenin metnin konusuyla ilişkisini açıklarsın.</p>
<div class="ornek"><span class="eyebrow">Örnek · Ben bir kelime seçtim</span>
<p><b>Anahtar kelime:</b> Türkü · <b>1. ipucu:</b> Saz eşliğinde söylenir · <b>2. ipucu:</b> Halkın ortak eseridir</p>
<p><b>İlişkisi:</b> Metin, kuşaktan kuşağa aktarılan kültürel mirasımızı anlattığı için “türkü” kelimesini seçtim; türküler de bu mirasın bir parçasıdır.</p></div>
<div class="hata"><b>Dikkat:</b> İpucu yazarken anahtar kelimenin kendisini yazma. “Türkü” için “türkü söyleriz” ipucu olmaz, cevabı söyler.</div>`},
{t:"Sınavda nasıl yazarım?",h:`
<p class="lead">Anahtar kelime sorularında puanı bazen sadece kelime için değil, <b>neden o kelimeyi seçtiğini açıklaman</b> için de verirler.</p>
<div class="rule"><span class="eyebrow">Cevap kalıbı</span><b>“Metin … anlattığı için bu kelimeyi seçtim.”</b><span>Önce metnin konusunu bir cümleyle söyle, sonra seçtiğin kelimeyi ona bağla.</span></div>
<div class="ornek"><span class="eyebrow">Örnek · Tam puanlık cevap</span>
${metin("Kitap okumak, hayal dünyamızı geliştirir. Okudukça yeni kelimeler öğrenir, kendimizi daha iyi anlatırız. Bu yüzden her gün biraz kitap okumalıyız.")}
<p><b>Anahtar kelime:</b> kitap okumak</p>
<p><b>İlişkisi:</b> Metin, kitap okumanın bize kazandırdıklarını ve her gün kitap okumamız gerektiğini anlattığı için bu kelime grubunu seçtim.</p></div>
${tbl(["İyi anahtar kelime","Kötü anahtar kelime","Neden kötü?"],[["Kitap okumak","Şey","Çok genel, hiçbir şey anlatmıyor"],["Hayal dünyası","Bu yüzden","Bağlaç, konu değil"],["Kelime öğrenmek","Gün","Küçük bir ayrıntı"]])}
${yok("Lokum metninde neden “Türk kültürü” iyi bir anahtar kelimedir?","Çünkü metin, lokumun sadece bir tatlı olmadığını, <b>Türk kültürünün bir simgesi</b> olduğunu anlatıyor. Kelime metnin ana fikrine bağlı.")}`}
],
/* ===== BÖLÜM 4: GERÇEK VE MECAZ ANLAM ===== */
[
{t:"Gerçek anlam",h:`
<p class="lead">Bir kelimeyi duyunca aklına gelen <b>ilk anlam</b>, o kelimenin gerçek anlamıdır. Sözlükte de ilk sırada bu anlam yazar.</p>
<p><b>Gerçek anlam</b>, kelimenin herkesin bildiği, ilk ve temel anlamıdır. Genellikle onu <b>görebilir, dokunabilir, ölçebilirsin</b>.</p>
${tbl(["Kelime","Gerçek anlamlı cümle","Ne anlatıyor?"],[["sıcak","Çorba çok <b>sıcak</b>tı, ağzım yandı.","Isısı yüksek"],["tatlı","Annemin yaptığı kurabiye çok <b>tatlı</b>ydı.","Şekerli tat"],["ağır","Bu valiz çok <b>ağır</b>, kaldıramıyorum.","Tartıda çok çeken"],["köprü","Nehrin üstündeki <b>köprü</b>den geçtik.","İki kıyıyı birleştiren yapı"]])}
<div class="rule"><span class="eyebrow">Kolay hatırla</span><b>Gerçek anlam = Sözlükteki ilk anlam</b><span>Kelime tam olarak kendi işini yapıyorsa gerçek anlamdadır: sıcak çorba gerçekten sıcaktır.</span></div>
${yok("“Kar yağınca hava çok <b>soğuk</b> oldu.” Soğuk kelimesi gerçek anlamda mı?","<b>Evet, gerçek anlam.</b> Havanın ısısı gerçekten düşük. Termometreyle ölçebilirsin.")}`},
{t:"Mecaz anlam",h:`
<p class="lead">Bazen bir kelimeyi ilk anlamından <b>uzaklaştırıp</b> başka bir şeyi anlatmak için kullanırız. Buna <b>mecaz anlam</b> denir.</p>
<p>“Bizi çok <b>sıcak</b> karşıladılar.” Burada kimse ateş yakmadı! Sıcak, “içten, samimi, sevgi dolu” demek. Kelime gerçek anlamından uzaklaştı, yani <b>mecaz</b> oldu.</p>
${tbl(["Kelime","Gerçek anlam","Mecaz anlam"],[
 ["sıcak","Çorba <b>sıcak</b>tı.","Bizi <b>sıcak</b> karşıladılar. (samimi)"],
 ["tatlı","Kurabiye <b>tatlı</b>ydı.","Bana <b>tatlı</b> sözler söyledi. (hoş, sevimli)"],
 ["ağır","Valiz <b>ağır</b>dı.","Arkadaşıma <b>ağır</b> bir söz söyledim. (kırıcı)"],
 ["soğuk","Hava <b>soğuk</b>tu.","Bana çok <b>soğuk</b> davrandı. (ilgisiz)"],
 ["engin","<b>Engin</b> denize baktık. (çok geniş)","Kitapta <b>engin</b> bir sevgi anlatılıyor. (çok büyük, derin)"],
 ["aydınlık","<b>Aydınlık</b> bir odada çalıştık. (ışıklı)","<b>Aydınlık</b> düşünceler yol gösterir. (umutlu, olumlu)"],
 ["köprü","<b>Köprü</b>den geçtik.","Dostluk insanlar arasında bir <b>köprü</b>dür. (bağ)"]])}
${sec("Gerçek mi, mecaz mı? Her satırda doğru kutuya dokun",[
 ["Kardeşimin <b>kalbi kırıldı</b>.",["Gerçek","Mecaz"],1],
 ["Bardak yere düşüp <b>kırıldı</b>.",["Gerçek","Mecaz"],0],
 ["Dedemin <b>tatlı</b> dili herkesi güldürür.",["Gerçek","Mecaz"],1],
 ["Bu bıçak çok <b>keskin</b>.",["Gerçek","Mecaz"],0],
 ["Ayşe'nin çok <b>keskin</b> bir zekâsı var.",["Gerçek","Mecaz"],1],
 ["Odanın lambası çok <b>parlak</b>.",["Gerçek","Mecaz"],0]])}`},
{t:"Nasıl karar veririm?",h:`
<p class="lead">Bir kelimenin gerçek mi mecaz mı olduğuna karar vermek için kısa bir yol izleriz.</p>
${adimAdim("Adım adım · Gerçek mi mecaz mı?",[
 "Kelimenin <b>sözlükteki ilk anlamını</b> düşün. “Ağır = tartıda çok çeken.”",
 "Cümleye dön ve sor: “Burada kelime gerçekten bu anlamda mı kullanılmış?”",
 "Dokunabiliyor, ölçebiliyor, görebiliyor musun? “Ağır valiz” tartılabilir, <b>gerçek</b>tir.",
 "Kelime bir duyguyu, düşünceyi ya da davranışı anlatıyorsa ilk anlamdan uzaklaşmıştır. “Ağır söz” tartılamaz, <b>mecaz</b>dır."])}
<div class="ornek"><span class="eyebrow">Örnek · Karar verelim</span>
<p>“Bu kötü haberi duyunca <b>içim karardı</b>.”</p>
<p>Kararmak = ışığın gitmesi, karanlık olması. İçimizde ışık yanmaz, sönmez! Burada “çok üzüldüm” anlatılıyor. Kelime <b>mecaz</b> anlamda.</p></div>
${birlikte([
 `“Bizi sıcak karşıladılar.” cümlesinde sıcak kelimesi ${bosluk('mecaz|mecaz anlam|mecaz anlamda')} anlamdadır.`,
 `“Çaydanlıktaki su çok sıcak.” cümlesinde sıcak kelimesi ${bosluk('gerçek|gerçek anlam|gerçek anlamda|gercek')} anlamdadır.`,
 `“Arkadaşım bana soğuk davrandı.” Soğuk burada ${bosluk('ilgisiz|ilgisizce|samimiyetsiz|sevgisiz|mesafeli|uzak')} demek.`])}
<div class="hata"><b>Dikkat:</b> Aynı kelime bir cümlede gerçek, başka bir cümlede mecaz olabilir. Karar verirken kelimeye değil, <b>cümleye</b> bak.</div>`},
{t:"Sınavda nasıl yazarım?",h:`
<p class="lead">Sınavda genellikle bir tablo olur: kelimenin sözlükteki ilk anlamı verilir, sen metinde <b>gerçek mi mecaz mı</b> kullanıldığını yazarsın. Sonra da aynı kelimeyle <b>yeni bir cümle</b> kurarsın.</p>
${tbl(["Sözcük","Sözlükteki ilk anlamı","Metindeki anlam özelliği"],[["engin","Ucu bucağı görünmeyecek kadar geniş","<b>Mecaz</b>: “engin sevgi” çok büyük sevgi demek"],["aydınlık","Işık alan, ışıklı","<b>Mecaz</b>: “aydınlık düşünceler” umut veren düşünceler demek"]])}
<div class="rule"><span class="eyebrow">Sınav ipucu</span><b>“Metin dışındaki diğer anlamıyla cümle kur”</b><span>Metinde mecazsa sen <b>gerçek</b> anlamla cümle kur. Metinde gerçekse sen <b>mecaz</b> anlamla cümle kur. Tersini yap!</span></div>
<div class="ornek"><span class="eyebrow">Örnek · Köprü</span>
<p><b>Metin:</b> “Dostluk, insanları birbirine bağlayan bir köprüdür.”</p>
<p><b>Metindeki anlam özelliği:</b> Mecaz. Çünkü köprü burada bir yapı değil, insanlar arasındaki bağ anlamında.</p>
<p><b>Diğer anlamıyla (gerçek) cümle:</b> Köyün girişindeki taş köprü, derenin iki yakasını birleştiriyordu.</p></div>
${yok("Metinde “Annemin yumuşak sesi beni sakinleştirdi.” yazıyor. Yumuşak kelimesini diğer anlamıyla bir cümlede kullan.","Metinde mecaz (nazik, kırıcı olmayan ses). Gerçek anlamla: <b>“Yeni yastığım pamuk gibi yumuşak.”</b>")}`}
],
/* ===== BÖLÜM 5: PARAGRAF TÜRLERİ ===== */
[
{t:"Dört tür, dört amaç",h:`
<p class="lead">Her paragrafın bir <b>amacı</b> vardır. Ne anlatmak istediğine göre paragrafın türü değişir. Sınavda dört türü bilmen gerekiyor.</p>
${tbl(["Tür","Amacı","İpucu kelimeler"],[
 ["<b>Betimleme</b>","Bir yeri, kişiyi, varlığı <b>gözde canlandırmak</b>, resmini kelimelerle çizmek","renk, ses, koku, şekil; “mavi gözlü”, “ılık rüzgâr”"],
 ["<b>Tanıtma</b>","Bir kişiyi, yeri, kitabı, ürünü ya da etkinliği <b>tanıtmak</b>, özelliklerini anlatmak","adı, yeri, özellikleri, neden ilginç olduğu"],
 ["<b>Öyküleme</b>","Bir <b>olayı</b> baştan sona sırayla anlatmak","kişi, yer, zaman; “önce, sonra, ertesi gün, o sırada”"],
 ["<b>Açıklama</b>","Bilgi vermek, bir şeyi <b>öğretmek</b>, tavsiye ve öneri sunmak","“şunu yapabilirsin”, “böylece”, “çünkü”, “bu sayede”"]])}
<div class="rule"><span class="eyebrow">Kolay hatırla</span><b>Resim · Vitrin · Film · Öğretmen</b><span>Betimleme bir <b>resim</b> çizer. Tanıtma bir <b>vitrin</b>dir. Öyküleme bir <b>film</b> gibi olayı oynatır. Açıklama bir <b>öğretmen</b> gibi bilgi verir ve yol gösterir.</span></div>
${sec("Hangi tür? Amaca göre seç",[
 ["Olayı sırayla anlatır",["Betimleme","Öyküleme","Açıklama"],1],
 ["Bir yerin rengini, sesini, kokusunu anlatır",["Betimleme","Tanıtma","Açıklama"],0],
 ["Tavsiye verir, nasıl yapılacağını anlatır",["Öyküleme","Betimleme","Açıklama"],2],
 ["Bir kitabın adını, yazarını, konusunu anlatır",["Tanıtma","Öyküleme","Betimleme"],0]])}`},
{t:"Aynı konu, dört paragraf",h:`
<p class="lead">Aynı konuyu dört farklı türde yazabiliriz. Konumuz: <b>okul kütüphanesi</b>. Farklarını bulabilecek misin?</p>
<div class="ornek"><span class="eyebrow">Betimleme</span><p>Kütüphanenin büyük pencerelerinden içeri sarı bir ışık süzülüyordu. Ahşap raflar tavana kadar uzanıyor, eski kitapların kâğıt kokusu bütün odayı sarıyordu. Sessizlikte sadece sayfaların hışırtısı duyuluyordu.</p></div>
<div class="ornek"><span class="eyebrow">Tanıtma</span><p>Okulumuzun kütüphanesi zemin katta, kantinin yanındadır. Kütüphanede iki binden fazla kitap vardır. Her gün 08.30 ile 16.00 arasında açıktır. Öğrenciler kartlarıyla iki haftalığına kitap ödünç alabilir.</p></div>
<div class="ornek"><span class="eyebrow">Öyküleme</span><p>Geçen pazartesi kütüphaneye ilk kez gittim. Önce rafların arasında biraz dolaştım. Sonra bir köşede eski bir macera kitabı gördüm. Kitabı açar açmaz içine daldım ve zil çaldığını duymadım bile.</p></div>
<div class="ornek"><span class="eyebrow">Açıklama</span><p>Kütüphaneyi daha iyi kullanmak istiyorsan önce kütüphane kartı çıkarmalısın. Böylece istediğin kitabı evine götürebilirsin. Kitap seçerken arka kapaktaki yazıyı oku, çünkü bu yazı kitabın konusunu kısaca anlatır.</p></div>
${sec("Bu cümle hangi türden?",[
 ["Kütüphanenin kapısı açılınca içeriye mis gibi bir kitap kokusu yayıldı, raflar renk renk kitaplarla doluydu.",["Betimleme","Açıklama","Tanıtma"],0],
 ["Kitapları iki hafta içinde geri getirmelisin; böylece başka arkadaşların da okuyabilir.",["Öyküleme","Açıklama","Betimleme"],1],
 ["Dün akşam kitabımı bitirdim, sonra hemen ikinci cildini okumaya başladım.",["Öyküleme","Tanıtma","Açıklama"],0],
 ["Bu kitabın yazarı Jules Verne'dir; kitap, balonla Afrika'yı geçen kâşifleri anlatır.",["Betimleme","Tanıtma","Öyküleme"],1]])}`},
{t:"Duruma göre tür seç",h:`
<p class="lead">Sınavda sana bir <b>durum</b> verilir ve “Bu durumda hangi tür paragraf yazarsın?” diye sorulur. Cevap, <b>ne yapmak istediğine</b> bağlıdır.</p>
${tbl(["Durum","Ne yapmak istiyorum?","Tür"],[
 ["Arkadaşım bir sorun yaşıyor, ona yardım etmek istiyorum","Tavsiye vermek","<b>Açıklama</b>"],
 ["Yaz tatilinde başıma gelen komik bir olayı anlatacağım","Olay anlatmak","<b>Öyküleme</b>"],
 ["Odamın nasıl göründüğünü anlatacağım","Gözde canlandırmak","<b>Betimleme</b>"],
 ["Sınıfıma en sevdiğim kitabı sunacağım","Tanıtmak","<b>Tanıtma</b>"]])}
<div class="rule"><span class="eyebrow">Sınav ipucu</span><b>“Tavsiye”, “öneri”, “nasıl” = Açıklama</b><span>Soru “arkadaşınıza tavsiyede bulunmak amacıyla” diyorsa cevap neredeyse her zaman <b>açıklama</b>dır. Çünkü bilgi verip yol gösteriyorsun.</span></div>
${sec("Hangi türü seçersin?",[
 ["Kardeşin dişlerini fırçalamayı unutuyor. Ona öneriler yazacaksın.",["Açıklama","Betimleme","Öyküleme"],0],
 ["Bayramda dedeni ziyaret ettiğin günü anlatacaksın.",["Tanıtma","Öyküleme","Açıklama"],1],
 ["Denizin gün batımında nasıl göründüğünü anlatacaksın.",["Betimleme","Açıklama","Tanıtma"],0],
 ["Şehrindeki bir müzeyi okul gazetesinde tanıtacaksın.",["Öyküleme","Tanıtma","Betimleme"],1]])}`},
{t:"Tavsiye paragrafı yazma kalıbı",h:`
<p class="lead">Sınavda en çok çıkan yazma sorusu: Bir arkadaşına <b>iki öneri</b> sunan ve her önerinin <b>neden işe yarayacağını</b> açıklayan en az <b>altı cümlelik</b> bir paragraf.</p>
${adimAdim("Adım adım · 6 cümlelik kalıp",[
 "<b>1. cümle (giriş):</b> Sorunu ve genel öneriyi söyle. “Görevini zamanında bitirmek için işlerini planlaman gerekir.”",
 "<b>2. cümle (1. öneri):</b> “Önce … yapabilirsin.”",
 "<b>3. cümle (1. neden):</b> “Böylece / Çünkü …”",
 "<b>4. cümle (2. öneri):</b> “Ayrıca … yapabilirsin.”",
 "<b>5. cümle (2. neden):</b> “Bu sayede …”",
 "<b>6. cümle (sonuç):</b> “Bu iki öneriyi uygularsan …”",
 "Bitirince cümlelerini say. En az altı cümle olmalı. Her cümle büyük harfle başlamalı ve noktayla bitmeli."])}
<div class="ornek"><span class="eyebrow">Örnek · Ödevlerini unutan arkadaşa</span>
<p>Ödevlerini unutmamak için biraz düzenli olman yeterli. Önce her derste verilen ödevi küçük bir deftere yazabilirsin. Böylece akşam neyi yapacağını hatırlarsın. Ayrıca çantanı yatmadan önce hazırlayabilirsin. Bu sayede sabah aceleyle bir şey unutmazsın. Bu iki öneriyi uygularsan öğretmenine her gün ödevini gururla teslim edersin.</p></div>
${birlikte([
 `Öneriden sonra nedenini anlatmak için “${bosluk('böylece|çünkü|bu sayede|bu sayade')}” diye başlayan bir cümle yazarım.`,
 `İkinci öneriye geçerken “${bosluk('ayrıca|ayrica|bir de|hem de|bunun yanında')}” kelimesini kullanırım.`,
 `Tavsiye paragrafının türü: ${bosluk('açıklama|aciklama|açıklayıcı')}`])}
<div class="hata"><b>Sık yapılan hata:</b> Öneriyi yazıp nedenini yazmamak. “Not defteri kullan.” tek başına yarım puandır. “… çünkü aradığın bilgiyi kolayca bulursun.” diye devam et.</div>`}
],

[
{t:"Kesme işareti ve kısaltmalar",h:`
<p class="lead">Özel isimlere ve kısaltmalara gelen ekler <b>kesme işaretiyle (')</b> ayrılır. Kısaltmalarda bir sır daha var: Ek, kısaltmanın <b>nasıl okunduğuna</b> göre gelir.</p>
<p><b>Özel isimler:</b> Ankara'da, Nisa'nın, Yunus Emre'yi, Türkiye'ye</p>
<div class="rule"><span class="eyebrow">Kısaltma kuralı</span><b>Ek, son harfin okunuşuna uyar</b><span>Kısaltmayı yüksek sesle oku. Son harfi nasıl söylüyorsan eki ona göre getir.</span></div>
${tbl(["Kısaltma","Nasıl okunur?","Doğru yazım"],[
 ["TDK","te-de-<b>ke</b>","TDK'<b>ye</b>, TDK'<b>nin</b>, TDK'<b>de</b>"],
 ["TRT","te-re-<b>te</b>","TRT'<b>ye</b>, TRT'<b>nin</b>, TRT'<b>de</b>"],
 ["PTT","pe-te-<b>te</b>","PTT'<b>ye</b>, PTT'<b>den</b>"],
 ["TBMM","te-be-me-<b>me</b>","TBMM'<b>ye</b>, TBMM'<b>nin</b>"],
 ["ABD","a-be-<b>de</b>","ABD'<b>ye</b>, ABD'<b>den</b>"],
 ["NATO","<b>nato</b> (kelime gibi)","NATO'<b>ya</b>, NATO'<b>nun</b>"]])}
<div class="ornek"><span class="eyebrow">Örnek · Sınavdaki tuzak</span>
<p>Yanlış: TDK'<b>nın</b> yayımladığı eserler · Doğru: TDK'<b>nin</b> yayımladığı eserler</p>
<p>Neden? TDK “te-de-<b>ke</b>” diye okunur. “Ke”deki <b>e</b> ince ünlüdür, bu yüzden ek de ince olur: <b>-nin</b>.</p></div>
${birlikte([
 `TDK' ${bosluk('ye')} mektup yazdım.`,
 `Haberi TRT' ${bosluk('de|den')} izledim.`,
 `Paketi PTT' ${bosluk('den|ye')} aldım.`,
 `Milletvekilleri TBMM' ${bosluk('ye|de|den')} toplandı.`])}`},
{t:"de / da: ek mi, bağlaç mı?",h:`
<p class="lead">Türkçede en çok karıştırılan yazım kuralı budur. İki farklı “de” var ve biri <b>bitişik</b>, biri <b>ayrı</b> yazılır.</p>
<div class="cards"><div class="mini"><b>-de / -da / -te / -ta (ek)</b>Bulunma eki. <b>Bitişik</b> yazılır. “Nerede? Ne zaman?” sorusuna cevap verir.<br><br>Evde, okulda, saat üçte, sokakta</div>
<div class="mini"><b>de / da (bağlaç)</b>“Dahi, bile, ayrıca” anlamı katar. <b>Ayrı</b> yazılır. Asla “te / ta” olmaz.<br><br>Ben de geldim. Kardeşim de gülüyor.</div></div>
<div class="rule"><span class="eyebrow">Çıkarma testi</span><b>Çıkar, cümle bozuluyorsa ek; bozulmuyorsa bağlaç</b><span>“Ben <b>de</b> geldim.” → “Ben geldim.” Cümle bozulmadı, demek ki <b>bağlaç</b>, ayrı yazılır.<br>“Ev<b>de</b> kaldım.” → “Ev kaldım.” Cümle bozuldu, demek ki <b>ek</b>, bitişik yazılır.</span></div>
${sec("Ek mi, bağlaç mı? Her satırda doğru kutuya dokun",[
 ["Çocukluğumun en güzel anıları bu evin bahçesin<b>de</b> saklıdır.",["Ek (bitişik)","Bağlaç (ayrı)"],0],
 ["Sen <b>de</b> bizimle gel.",["Ek (bitişik)","Bağlaç (ayrı)"],1],
 ["Toplantı saat beş<b>te</b> başlayacak.",["Ek (bitişik)","Bağlaç (ayrı)"],0],
 ["Kardeşim <b>de</b> bu kitabı çok sevdi.",["Ek (bitişik)","Bağlaç (ayrı)"],1],
 ["Kitabım çantam<b>da</b> duruyor.",["Ek (bitişik)","Bağlaç (ayrı)"],0]])}
<div class="hata"><b>Dikkat:</b> Ek olan “-de”, sertleşip “-te, -ta” olabilir: kitapta, sokakta. Bağlaç olan “de” <b>asla</b> “te” olmaz. “Ahmet te geldi.” yanlıştır, “Ahmet de geldi.” doğrudur.</div>`},
{t:"ki: ayrı mı, bitişik mi?",h:`
<p class="lead">“ki” de ikiye ayrılır: biri cümleleri <b>bağlar</b> ve ayrı yazılır, öteki kelimeye <b>yapışır</b> ve bitişik yazılır.</p>
<div class="cards"><div class="mini"><b>ki (bağlaç)</b>Kelimeleri ya da cümleleri birbirine bağlar. <b>Ayrı</b> yazılır.<br><br>Anladım <b>ki</b> sevgi paylaştıkça çoğalır. · Öyle yoruldum <b>ki</b> hemen uyudum.</div>
<div class="mini"><b>-ki (ek)</b>Kelimeye eklenir, “hangi?” sorusuna cevap verir ya da bir ismin yerini tutar. <b>Bitişik</b> yazılır.<br><br>Evde<b>ki</b> kedi · yarın<b>ki</b> maç · Benim kalemim mavi, senin<b>ki</b> kırmızı.</div></div>
<div class="rule"><span class="eyebrow">Hangi? testi</span><b>“Hangi?” sorusuna cevap veriyorsa ek, bitişik</b><span>“Evdeki kedi” → Hangi kedi? Evdeki. Bu bir <b>ek</b>tir.<br>“Gözlerindeki pırıltı” → Hangi pırıltı? Gözlerindeki. Bu da <b>ek</b>tir.</span></div>
${sec("Bağlaç mı, ek mi?",[
 ["Duydum <b>ki</b> yarın kar yağacakmış.",["Bağlaç (ayrı)","Ek (bitişik)"],0],
 ["Masada<b>ki</b> kitabı bana uzatır mısın?",["Bağlaç (ayrı)","Ek (bitişik)"],1],
 ["O kadar güldük <b>ki</b> karnımız ağrıdı.",["Bağlaç (ayrı)","Ek (bitişik)"],0],
 ["Dün<b>kü</b> maçı izledin mi?",["Bağlaç (ayrı)","Ek (bitişik)"],1]])}
<div class="hata"><b>Bunlar hep bitişik:</b> belki, çünkü, sanki, hâlbuki, oysaki, mademki. Bu kelimelerdeki “ki”yi ayırma.</div>
${yok("“Bahçede<b>ki</b> ağaçlar çiçek açtı.” cümlesindeki ki neden bitişik yazılmış?","Çünkü “Hangi ağaçlar?” sorusuna cevap veriyor: <b>bahçedeki ağaçlar.</b> Bu, ismi niteleyen <b>-ki ekidir</b>, bitişik yazılır.")}`},
{t:"mi: soru eki ve “-ince” anlamı",h:`
<p class="lead">“mi” her zaman <b>ayrı</b> yazılır. Ama iki farklı görevi vardır: soru sormak ve “-ınca, -ırsa” anlamı katmak.</p>
<div class="rule"><span class="eyebrow">Altın kural</span><b>mi her zaman ayrı, ondan sonraki ekler mi'ye bitişik</b><span>Geldin <b>mi</b>? · Gelecek <b>misin</b>? · Okudun <b>mu</b>? · Güzel <b>mi</b>ydi?<br>“Gelecekmisin” yanlış · “Gelecek misin” doğru</span></div>
<p>“mi”, önündeki kelimeye uyar: <b>mı, mi, mu, mü</b> olur. Kitap <b>mı</b>, kalem <b>mi</b>, okul <b>mu</b>, gül <b>mü</b>?</p>
<div class="cards"><div class="mini"><b>Soru eki mi</b>Bir şey sorar. Cümlenin sonunda soru işareti olur.<br><br>Eski mektupları sakladığın kutu hâlâ duruyor <b>mu</b>?</div>
<div class="mini"><b>Zaman / şart anlamı veren mi</b>Soru sormaz. “-ınca” ya da “-ırsa” anlamı katar.<br><br>Bahar geldi <b>mi</b> içimi sevinç kaplar. = Bahar <b>gelince</b> içimi sevinç kaplar.</div></div>
${sec("Hangi görevde?",[
 ["Kar yağdı <b>mı</b> bütün çocuklar sokağa koşar.",["Soru","Zaman / şart"],1],
 ["Ödevini bitirdin <b>mi</b>?",["Soru","Zaman / şart"],0],
 ["Akşam oldu <b>mu</b> dedem çayını demler.",["Soru","Zaman / şart"],1],
 ["Yarın sinemaya gidecek <b>miyiz</b>?",["Soru","Zaman / şart"],0]])}
${birlikte([
 `Sen de bizimle gelecek ${bosluk('misin')}?`,
 `Bu kitabı okudun ${bosluk('mu')}?`])}`},
{t:"İki nokta, noktalı virgül, virgül",h:`
<p class="lead">Noktalama işaretleri cümlenin trafik işaretleridir. Nerede duracağını, nerede yavaşlayacağını gösterir. Sınavda en çok bu üçü çıkar.</p>
${tbl(["İşaret","Ne zaman kullanırım?","Örnek"],[

<h3>Virgülün sınavdaki üç görevi</h3>
${tbl(["Görev","Örnek"],[

${sec("Virgülün görevi hangisi?",[

{t:"Kalıp sözler: doğru yerde doğru söz",h:`
<p class="lead">Bazı durumlarda herkesin söylediği <b>hazır sözler</b> vardır. Bunlara <b>kalıp söz</b> denir. Doğru durumda doğru kalıp sözü söylemek nezaketin bir parçasıdır.</p>
${tbl(["Durum","Söylenen kalıp söz"],[
 ["Yeni bir eve taşınan komşuya","<b>Güle güle oturun!</b> / Hayırlı olsun!"],

 ["Yemek yiyip teşekkür eden misafire","<b>Afiyet olsun!</b>"],
 ["Yemeği hazırlayan kişiye","<b>Eline sağlık!</b>"],
 ["Hasta olan ya da hastaneden çıkan kişiye","<b>Geçmiş olsun!</b>"],
 ["Çalışan birinin yanından geçerken","<b>Kolay gelsin!</b>"],
 ["Yolculuğa çıkan kişiye","<b>İyi yolculuklar!</b> / Yolun açık olsun!"],
 ["Uzun süredir görmediğin birine","<b>Nasılsınız, iyi misiniz?</b> / Ne var ne yok?"]])}
${birlikte([

<div class="hata"><b>Dikkat:</b> “Afiyet olsun” yemeği yiyecek ya da yemiş olan kişiye söylenir. Yemeği yapan kişiye “eline sağlık” denir. Bu ikisini karıştırma.</div>`},
{t:"Deyimler",h:`
<p class="lead"><b>Deyim</b>, en az iki kelimeden oluşan, kalıplaşmış ve genellikle <b>mecaz anlamlı</b> bir sözdür. Deyimler anlatımı renklendirir.</p>
<div class="rule"><span class="eyebrow">Deyimi tanı</span><b>En az iki kelime · Kalıplaşmış · Çoğu “-mek / -mak” ile biter</b><span>Kelimelerinin yeri değiştirilemez. “El ele vermek” yerine “ele el vermek” denmez.</span></div>
${tbl(["Deyim","Anlamı"],[

 ["Kapısı herkese açık olmak","Herkesi evinde ağırlamak, misafirperver olmak"],

 ["Etekleri zil çalmak","Çok sevinmek"],
 ["Kulak vermek","Dikkatle dinlemek"],
 ["Omuz omuza vermek","Birlikte, dayanışarak çalışmak"],
 ["Gözden düşmek","Değerini, sevgisini kaybetmek"]])}
${sec("Deyimin anlamı hangisi?",[
 ["Etekleri zil çalmak",["Çok sevinmek","Çok korkmak","Dans etmek"],0],

 ["El ele vermek",["El sıkışmak","Birlikte çalışmak","Kavga etmek"],1]])}
${yok("“Kardeşim bayram harçlığını alınca çok sevindi.” cümlesini bir deyimle yeniden yaz.","<b>“Kardeşim bayram harçlığını alınca etekleri zil çaldı.”</b>")}`},
{t:"Atasözleri",h:`
<p class="lead"><b>Atasözü</b>, atalarımızın yaşadıklarından çıkardığı dersleri anlatan, kısa ve kalıplaşmış <b>cümlelerdir</b>. Atasözleri genellikle bir <b>öğüt</b> verir.</p>
${tbl(["Atasözü","Ne anlatır?"],[

 ["Damlaya damlaya göl olur.","Küçük birikimler zamanla büyük olur."],

<div class="cards"><div class="mini"><b>Deyim</b>Kalıplaşmış <b>söz</b>dür. Çoğu “-mek, -mak” ile biter. Öğüt vermez, bir durumu anlatır.<br><br>El ele vermek</div>
<div class="mini"><b>Atasözü</b>Kalıplaşmış <b>cümle</b>dir. Bir ders, bir öğüt verir.<br><br>Birlikten kuvvet doğar.</div></div>
${sec("Deyim mi, atasözü mü?",[

 ["Göz kulak olmak",["Deyim","Atasözü"],0]])}`},
{t:"Paragrafta kullanmak",h:`
<p class="lead">Sınavda sana bir <b>havuz</b> verilir: içinde deyimler, atasözleri, kalıp sözler olur. En az ikisini seçip <b>4–5 cümlelik</b> bilgilendirici bir paragraf yazman istenir.</p>
${adimAdim("Adım adım · Havuzdan paragraf",[
 "Paragrafın <b>konusunu</b> oku. Örneğin: “komşuluk ilişkilerinde yardımlaşmanın önemi”.",
 "Havuzdan konuya en uygun <b>iki ifadeyi</b> seç ve anlamlarını düşün.",
 "<b>1. cümle:</b> Konuyu söyle. “Komşuluk ilişkilerinde yardımlaşma çok önemlidir.”",

 "<b>4. cümle:</b> İkinci ifadeyi kullan, bir örnekle destekle.",
 "<b>5. cümle:</b> Sonuç cümlesi yaz. “Böylece komşular arasındaki dostluk güçlenir.”"])}
<div class="ornek"><span class="eyebrow">Örnek · Okulda yardımlaşma</span>
<p>Okulda yardımlaşmak, hepimizin işini kolaylaştırır. “Birlikten kuvvet doğar.” atasözü, birlikte hareket edenlerin daha güçlü olduğunu anlatır. Sınıfça <b>el ele verdiğimizde</b> bahçeyi bir saatte temizledik. Tek başımıza yapsaydık günlerce sürerdi. Bu yüzden zor işlerde birbirimize destek olmalıyız.</p></div>
<div class="hata"><b>Sık yapılan hata:</b> İfadeleri art arda dizip bırakmak: “Birlikten kuvvet doğar. El ele vermek önemlidir.” Bu bir paragraf değil. İfadeyi cümlenin içinde, anlamına uygun kullan ve düşünceni desteklemesini sağla.</div>
${yok("“Göz kulak olmak” deyimini komşulukla ilgili bir cümlede kullan.","Örneğin: <b>“Tatile giden komşumuzun evine biz göz kulak olduk.”</b>")}`}
]

P.b=P.b||{}; P.t=P.t||{};
function save(){try{localStorage.setItem('nisaTr',JSON.stringify(P))}catch(e){}}
/* tema: oto / acik / koyu */
const HOST_THEME=document.documentElement.getAttribute('data-theme');
let THEME=(()=>{try{return localStorage.getItem('nisaTema')||'oto'}catch(e){return 'oto'}})();
const THEME_AD={oto:'Otomatik',acik:'Açık',koyu:'Koyu'};
function applyTheme(){const r=document.documentElement;
  if(THEME==='oto'){HOST_THEME?r.setAttribute('data-theme',HOST_THEME):r.removeAttribute('data-theme');}
  else r.setAttribute('data-theme',THEME==='acik'?'light':'dark');}

/* kontrol grupları ve maddeler */
function blocks(key){
  const n=+key.slice(1);
  if(key[0]==='b') return [{si:0,k:n,groups:B[n-1].yazili.kontrol}];
  return T[n-1].sorular.map((s,i)=>({si:i,k:s.k,groups:s.c}));
}
function items(key){
  const out=[];
  blocks(key).forEach(bl=>bl.groups.forEach((g,gi)=>g.i.forEach((it,ii)=>out.push({id:`${key}.${bl.si}.${gi}.${ii}`,t:it[0],p:it[1],fix:it[2],k:bl.k}))));
  return out;
}
const checkedSet=key=>S.checks[key]||(S.checks[key]=new Set());
function scoreOf(key){const c=checkedSet(key);return items(key).filter(i=>c.has(i.id)).reduce((s,i)=>s+i.p,0)}
const maxOf=key=>items(key).reduce((s,i)=>s+i.p,0);

}
const BC=["Konu","Test","Yazılı","Sonuç"];
function sendBox(msg){

      :{b:'Hepsi tamam!',m:'Bütün bölümler ve tatbikatlar bitti. Sınav sabahı Son Tekrar sayfasına bir göz at.',l:'#tekrar',d:"Son Tekrar'ı aç"};}

function vKonu(n){
  const b=B[n-1], pages=KONU[n-1], L=pages.length, i=Math.min(S.page[n]||0,L-1), pg=pages[i];
  return topBar(BC,0)+`<article class="paper"><div class="top"><span class="eyebrow">Bölüm ${n} · ${b.ad}</span><span class="eyebrow">Sayfa ${i+1}/${L}</span></div>

  <nav class="pages" aria-label="Sayfalar">${pages.map((p,j)=>`<button class="pg ${j===i?'on':j<i?'done':''}" data-act="pg" data-p="${j}" title="${p.t}">${j+1}</button>`).join('')}</nav>

  <div class="actions">${i>0?`<button class="ghost" data-act="pprev">← Önceki</button>`:''}${i<L-1?`<button class="primary" data-act="pnext">Sonraki sayfa →</button>`:`<button class="primary" data-act="startTest" data-n="${n}">Teste geç →</button>`}</div></article>`;
}
function vTest(n){
  const b=B[n-1],st=S.test[n]||(S.test[n]={i:0,ans:[]}),Q=b.test;
  if(st.i<Q.length){
    const q=Q[st.i],a=st.ans[st.i],answered=a!=null;
    let h=topBar(BC,1)+`<section class="paper"><div class="top"><span class="eyebrow">Bölüm ${n} · Test</span><span class="eyebrow">Soru ${st.i+1}/${Q.length}</span></div>
    <div class="progress"><span style="width:${(st.i+(answered?1:0))/Q.length*100}%"></span></div><h2>${q.q}</h2><div class="opts">`;
    q.o.forEach((o,j)=>{let cls='';if(answered){if(j===q.a)cls='right';else if(j===a)cls='wrong';}
      h+=`<button class="opt ${cls}" data-act="ans" data-j="${j}" ${answered?'disabled':''}>${String.fromCharCode(65+j)}) ${o}</button>`;});
    h+=`</div>`;
    if(answered){h+=a===q.a?`<div class="fb good"><b>Doğru!</b> ${q.n}</div>`:`<div class="fb bad"><b>Doğru cevap: ${q.o[q.a]}.</b> ${q.n}</div>`;
      h+=`<div class="actions"><button class="primary" data-act="next">${st.i+1<Q.length?'Sonraki soru →':'Test sonucunu gör →'}</button></div>`;}
    return h+`</section>`;
  }
  const sc=Q.filter((q,i)=>st.ans[i]===q.a).length, wrong=Q.filter((q,i)=>st.ans[i]!==q.a);
  let h=topBar(BC,1)+`<section class="paper result"><span class="eyebrow">Bölüm ${n} · Test sonucu</span><div class="big-score">${sc}/${Q.length}</div>`;
  h+=wrong.length?`<p>Yanlış yaptığın konular için kısa notların:</p><ul class="todo">${wrong.map(q=>`<li><b>${q.q}</b><br>${q.n}</li>`).join('')}</ul>`:`<div class="allgood">Hepsi doğru! Yazılı sorusuna geçebilirsin.</div>`;
  h+=`<div class="actions center"><button class="ghost" data-act="startTest" data-n="${n}">Testi tekrar çöz</button><a class="btn primary" href="#b${n}-yazili">Yazılı sorusuna geç →</a></div></section>`;
  return h;
}

function vKontrol(key){
  const n=+key.slice(1), isB=key[0]==='b', set=checkedSet(key);
  let h=topBar(isB?BC:null,2)+`<section class="paper"><span class="eyebrow">${isB?`Bölüm ${n}`:T[n-1].ad} · Baba kontrolü</span>
  <div class="note">Babacığım, Nisa'nın kağıdına bak. Yazdığı her madde için kutuyu işaretle. Aynı anlamı kendi cümlesiyle yazdıysa da say.</div>`;
  blocks(key).forEach(bl=>{
    if(!isB) h+=`<div class="qhead">Soru ${bl.si+1} · ${KONU_AD[bl.k-1]}</div>`;
    bl.groups.forEach((g,gi)=>{
      h+=`<div class="grp ${gi===0?'first':''}"><h3>${g.b}</h3><div class="model">${g.m}</div>`;

      h+=`</div>`;
    });
  });
  h+=`</section><div class="scorebar"><span>Puan <span class="big" id="score">${scoreOf(key)}</span> / ${maxOf(key)}</span><a class="btn" style="background:var(--paper);color:var(--fg);padding:10px 14px" href="#${key}-sonuc">Sonucu gör</a></div>`;
  return h;
}
function vSonucB(n){
  const key='b'+n, s=scoreOf(key), mx=maxOf(key), c=checkedSet(key);
  P.b[n]=Object.assign({},P.b[n],{yazili:s}); save();
  const test=P.b[n].test, miss=items(key).filter(i=>!c.has(i.id)).map(i=>i.fix);

  let h=topBar(BC,3)+`<section class="paper result"><span class="eyebrow">Bölüm ${n} · Sonuç</span><h1>${B[n-1].ad}</h1>

  h+=sendBox(msg)+`<div class="actions center"><a class="btn ghost" href="#b${n}-kontrol">Kontrole dön</a>${n<B.length?`<a class="btn primary" href="#b${n+1}-konu">Sonraki bölüm →</a>`:`<a class="btn primary" href="#ana">Bölümlere dön</a>`}</div></section>`;

}
function vTSoru(n){
  const t=T[n-1],i=S.tIdx[n]||0,q=t.sorular[i],L=t.sorular.length;
  let h=topBar(null)+`<section class="paper"><div class="top"><span class="eyebrow">${t.ad} · ${KONU_AD[q.k-1]}</span><span class="eyebrow">Soru ${i+1}/${L}</span></div>
  <div class="progress"><span style="width:${(i+1)/L*100}%"></span></div>

  ${i<L-1?`<button class="primary" data-act="tnext" data-n="${n}">Sonraki soru →</button>`:`<a class="btn primary" href="#t${n}-kontrol">Bitirdim, babama veriyorum →</a>`}</div></section>`;

function vSonucT(n){
  const key='t'+n, c=checkedSet(key), all=items(key), s=scoreOf(key), mx=maxOf(key), p100=Math.round(s/mx*100);
  P.t[n]=p100; save();
  const per=KONU_AD.map((_,i)=>i+1).map(k=>{const its=all.filter(i=>i.k===k);return [its.filter(i=>c.has(i.id)).reduce((a,i)=>a+i.p,0),its.reduce((a,i)=>a+i.p,0)]});
  const miss=all.filter(i=>!c.has(i.id)).map(i=>i.fix);
  const uniq=[...new Set(miss)];
  const msg=`Nisa · Türkçe ${T[n-1].ad}\nPuan: ${p100}/100\n`+per.map((v,i)=>`${KONU_AD[i]}: ${v[0]}/${v[1]}`).join('\n')+(uniq.length?`\nTekrar edilecekler:\n- ${uniq.join('\n- ')}`:'\nEksik yok.');
  let h=topBar(null)+`<section class="paper result"><span class="eyebrow">${T[n-1].ad} · Sonuç</span><div class="big-score">${p100}<span class="muted" style="font-size:1.2rem">/100</span></div>
  <div class="scores">${per.map((v,i)=>`<div>${KONU_AD[i]}<b>${v[0]}/${v[1]}</b></div>`).join('')}</div>`;
  h+=uniq.length?`<span class="eyebrow">Tekrar edilecekler</span><ul class="todo">${uniq.map(m=>`<li>${m}</li>`).join('')}</ul>`:`<div class="allgood">Eksik yok, sınava hazırsın!</div>`;
  h+=sendBox(msg)+`<div class="actions center"><a class="btn ghost" href="#t${n}-kontrol">Kontrole dön</a><a class="btn primary" href="#ana">Ana sayfa</a></div></section>`;
